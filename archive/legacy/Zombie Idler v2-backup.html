<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Idler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Oswald:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="game-data.js"></script>
<script src="pixel-art.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens-v2.jsx"></script>
<script type="text/babel" src="screens-v2b.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0e0c;
    --bg2:       #1a1814;
    --bg3:       #242018;
    --bg4:       #2e2820;
    --border:    #3a3228;
    --border2:   #4a4038;
    --text:      #d4c9b0;
    --text2:     #8a7d68;
    --text3:     #5a5040;
    --amber:     #c8a96e;
    --amber2:    #e8c98e;
    --red:       #8b3a2a;
    --red2:      #c8612a;
    --green:     #4caf7d;
    --green2:    #7ab87a;
    --blue:      #4a8ec2;
    --purple:    #a855f7;
    --font-title: 'Special Elite', serif;
    --font-body:  'Oswald', sans-serif;
    --font-mono:  'Share Tech Mono', monospace;
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

  #root { width: 100%; height: 100%; }

  /* Texture overlays */
  .paper-texture::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: 
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Utility */
  .font-title { font-family: var(--font-title); }
  .font-mono  { font-family: var(--font-mono); }
  .text-amber { color: var(--amber); }
  .text-red   { color: var(--red2); }
  .text-green { color: var(--green); }
  .text-dim   { color: var(--text2); }
  .text-dimmer{ color: var(--text3); }

  /* Panels */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .panel::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(200,169,110,0.03) 0%, transparent 50%);
  }
  .panel-title {
    font-family: var(--font-title);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }

  /* Buttons */
  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    padding: 8px 16px;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); background: var(--bg4); }
  .btn-amber { border-color: var(--amber); color: var(--amber); }
  .btn-amber:hover { background: rgba(200,169,110,0.12); }
  .btn-red { border-color: var(--red); color: var(--red2); }
  .btn-red:hover { background: rgba(139,58,42,0.15); }
  .btn-green { border-color: var(--green); color: var(--green); }
  .btn-green:hover { background: rgba(76,175,125,0.12); }
  .btn-sm { font-size: 11px; padding: 5px 10px; }
  .btn-lg { font-size: 15px; padding: 12px 28px; letter-spacing: 0.12em; }

  /* Tags */
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }

  /* Progress bars */
  .progress-bar {
    height: 6px;
    background: var(--bg4);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.3s ease;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px; height: 100%;
    background: rgba(255,255,255,0.4);
  }

  /* Dividers */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 8px 0;
  }

  /* Tooltip */
  .tooltip-wrap { position: relative; }
  .tooltip-wrap:hover .tooltip-box { opacity: 1; pointer-events: auto; }
  .tooltip-box {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg4); border: 1px solid var(--border2);
    padding: 8px 12px; min-width: 160px; max-width: 220px;
    font-size: 11px; line-height: 1.5; color: var(--text2);
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 9999; white-space: normal;
  }

  /* Animated ticker */
  @keyframes tick-up { from { opacity: 0; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
  .tick-float { animation: tick-up 1.5s ease-out forwards; pointer-events: none; }

  /* Threat pulse */
  @keyframes threat-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .threat-active { animation: threat-pulse 2s ease-in-out infinite; }

  /* Screen transitions */
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen-enter { animation: screen-in 0.25s ease-out; }

  /* Scanline effect on hover for mode cards */
  @keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  .scanline-hover:hover .scanline-inner {
    animation: scanline 1.5s linear infinite;
  }
  .scanline-inner {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, transparent 40%, rgba(200,169,110,0.04) 50%, transparent 60%);
  }

  /* Loading bar animation */
  @keyframes loading-fill { from { width: 0%; } to { width: 100%; } }

  /* Notification badge */
  .notif-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red2);
    box-shadow: 0 0 6px var(--red2);
    flex-shrink: 0;
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 9px 16px;
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    position: relative;
    top: 1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }

  /* World event banner */
  @keyframes scroll-event { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .event-scroll { animation: scroll-event 18s linear infinite; white-space: nowrap; display: inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const ZI = window.ZI;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : Math.floor(n); }
function fmtTime(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}
function clamp(v,min,max) { return Math.max(min, Math.min(max, v)); }

function getNutritionLevel(val) {
  return ZI.NUTRITION.levels.find(l => val >= l.min && val < l.max) || ZI.NUTRITION.levels[ZI.NUTRITION.levels.length-1];
}
function getHydrationLevel(val) {
  return ZI.NUTRITION.hydration.find(l => val >= l.min && val < l.max) || ZI.NUTRITION.hydration[ZI.NUTRITION.hydration.length-1];
}

function ProgressBar({ value, max=100, color='var(--amber)', height=6, animated=false }) {
  const pct = clamp((value/max)*100, 0, 100);
  return (
    <div className="progress-bar" style={{height}}>
      <div className="progress-fill" style={{
        width: `${pct}%`, background: color,
        boxShadow: animated ? `0 0 8px ${color}` : 'none',
      }}/>
    </div>
  );
}

function Tag({ children, color='var(--amber2)', bg='transparent' }) {
  return <span className="tag" style={{color, borderColor: color, background: bg}}>{children}</span>;
}

function RiskBar({ risk }) {
  const colors = ['','var(--green)','var(--green2)','var(--amber)','var(--red2)','var(--red)'];
  return (
    <div style={{display:'flex', gap:3}}>
      {[1,2,3,4,5].map(i => (
        <div key={i} style={{
          width:8, height:14, borderRadius:1,
          background: i <= risk ? colors[risk] : 'var(--bg4)',
          opacity: i <= risk ? 1 : 0.4,
        }}/>
      ))}
    </div>
  );
}

// ─── TOP BAR ─────────────────────────────────────────────────────────────────
function TopBar({ mode, screen, setScreen, resources, threatLevel, worldEvent }) {
  const [time, setTime] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const gameDay = 47;
  const isCamp = mode === 'camp';

  return (
    <div style={{
      height: 44, background: 'var(--bg3)', borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'center', gap: 0, flexShrink: 0, zIndex: 100, position: 'relative',
    }}>
      {/* Logo */}
      <div style={{
        padding: '0 18px', borderRight: '1px solid var(--border)',
        display: 'flex', alignItems: 'center', gap: 8, height: '100%', cursor: 'pointer',
      }} onClick={() => setScreen('mode-select')}>
        <div style={{
          fontFamily: 'var(--font-title)', fontSize: 16, color: 'var(--amber)',
          letterSpacing: '0.05em', lineHeight: 1,
        }}>ZOMBIE<br/><span style={{fontSize: 10, letterSpacing: '0.3em', color: 'var(--text2)'}}>IDLER</span></div>
      </div>

      {/* Mode badge */}
      <div style={{
        padding: '0 14px', borderRight: '1px solid var(--border)', height: '100%',
        display: 'flex', alignItems: 'center', gap: 6,
      }}>
        <div style={{
          width: 7, height: 7, borderRadius: '50%',
          background: isCamp ? 'var(--green)' : 'var(--amber)',
          boxShadow: `0 0 6px ${isCamp ? 'var(--green)' : 'var(--amber)'}`,
        }}/>
        <span style={{fontFamily:'var(--font-body)', fontSize:11, letterSpacing:'0.12em', color:'var(--text2)', textTransform:'uppercase'}}>
          {isCamp ? 'Camp Leader' : 'Solo Survivor'}
        </span>
      </div>

      {/* Resources row */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 0, flex: 1,
        height: '100%', borderRight: '1px solid var(--border)', overflow: 'hidden',
        padding: '0 4px',
      }}>
        {Object.entries(resources).slice(0,6).map(([key, val]) => (
          <ResourceChip key={key} label={key} value={val} />
        ))}
      </div>

      {/* Day + Threat */}
      <div style={{
        padding: '0 14px', borderRight: '1px solid var(--border)', height: '100%',
        display: 'flex', alignItems: 'center', gap: 12,
      }}>
        <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)'}}>
          DAY <span style={{color:'var(--amber)', fontWeight:'bold'}}>{gameDay}</span>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:5}}>
          <div className="threat-active" style={{
            width: 8, height: 8, borderRadius: '50%',
            background: threatLevel > 3 ? 'var(--red2)' : threatLevel > 1 ? 'var(--amber)' : 'var(--green)',
          }}/>
          <span style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)'}}>
            THREAT <span style={{color: threatLevel > 3 ? 'var(--red2)' : 'var(--amber)'}}>{threatLevel}/5</span>
          </span>
        </div>
      </div>

      {/* Nav tabs */}
      <div style={{display:'flex', height:'100%', borderRight:'1px solid var(--border)'}}>
        {(isCamp ? [
          ['camp-main','Overview'],
          ['camp-schedule','Schedule'],
          ['marketplace','Market'],
          ['rmat-crafting','Crafting'],
          ['factions','Factions'],
          ['stat-leveling','Stats'],
          ['hack-slash','Combat'],
        ] : [
          ['solo-main','Routes'],
          ['traversal','Traversal'],
          ['solo-schedule','Schedule'],
          ['marketplace','Market'],
          ['rmat-crafting','Crafting'],
          ['factions','Factions'],
          ['stat-leveling','Stats'],
          ['hack-slash','Combat'],
        ]).map(([s, label]) => (
          <button key={s} onClick={() => setScreen(s)} style={{
            fontFamily:'var(--font-body)', fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase',
            color: screen===s ? 'var(--amber)' : 'var(--text2)',
            padding:'0 14px', background:'none', border:'none', cursor:'pointer',
            borderBottom: screen===s ? '2px solid var(--amber)' : '2px solid transparent',
            transition:'all 0.15s', position:'relative', top:1,
          }}>{label}</button>
        ))}
      </div>

      {/* World event ticker */}
      {worldEvent && (
        <div style={{
          flex:1, overflow:'hidden', padding:'0 12px',
          display:'flex', alignItems:'center', gap:8,
        }}>
          <div className="notif-dot"/>
          <div style={{overflow:'hidden', flex:1}}>
            <div className="event-scroll" style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--purple)'}}>
              ⚠ ACTIVE EVENT: {worldEvent.name} — {worldEvent.effect} ⚠
            </div>
          </div>
        </div>
      )}

      {/* Time */}
      <div style={{padding:'0 14px', fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text3)', flexShrink:0}}>
        {time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
      </div>
    </div>
  );
}

function ResourceChip({ label, value }) {
  const colors = {
    Food:'var(--green2)', Scrap:'var(--text2)', Ammo:'var(--amber)', Medicine:'var(--blue)',
    Fuel:'var(--red2)', RMAT:'var(--purple)',
  };
  const color = colors[label] || 'var(--text2)';
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:5, padding:'0 10px',
      borderRight:'1px solid var(--border)', height:'100%',
    }}>
      <span style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)', letterSpacing:'0.08em'}}>{label}</span>
      <span style={{fontFamily:'var(--font-mono)', fontSize:12, color, fontWeight:'bold'}}>{fmt(value.current)}</span>
      {value.rate > 0 && (
        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)', opacity:0.8}}>+{value.rate}/m</span>
      )}
    </div>
  );
}

// ─── MODE SELECT SCREEN ───────────────────────────────────────────────────────
function ModeSelectScreen({ onSelect }) {
  const [hovered, setHovered] = useState(null);

  return (
    <div className="screen-enter" style={{
      width:'100%', height:'100%', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', background:'var(--bg)',
      position:'relative', overflow:'hidden',
    }}>
      {/* Background grid */}
      <div style={{
        position:'absolute', inset:0, opacity:0.06,
        backgroundImage: 'linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px)',
        backgroundSize: '48px 48px',
      }}/>

      {/* Title block */}
      <div style={{textAlign:'center', marginBottom:56, position:'relative', zIndex:1}}>
        <div style={{
          fontFamily:'var(--font-title)', fontSize:60, lineHeight:1,
          color:'var(--amber)', letterSpacing:'0.04em',
          textShadow: '0 0 60px rgba(200,169,110,0.3)',
        }}>
          ZOMBIE IDLER
        </div>
        <div style={{
          fontFamily:'var(--font-body)', fontSize:13, letterSpacing:'0.35em',
          color:'var(--text2)', marginTop:10, textTransform:'uppercase',
        }}>
          Two survival fantasies. One apocalypse.
        </div>
        <div style={{
          width:180, height:1, background:'linear-gradient(90deg, transparent, var(--amber), transparent)',
          margin:'16px auto 0',
        }}/>
      </div>

      {/* Mode cards */}
      <div style={{display:'flex', gap:32, position:'relative', zIndex:1}}>
        {[
          {
            id: 'camp',
            title: 'CAMP LEADER',
            subtitle: 'The Overseer',
            desc: 'Command a fragile settlement. Automate production, assign survivors, and defend against escalating hordes.',
            pillars: ['Base Construction','Survivor Workforce','Horde Defense','Idle Production','Long-term Optimization'],
            color: 'var(--green)',
            icon: (
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <rect x="8" y="32" width="14" height="20" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <rect x="26" y="24" width="12" height="28" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <rect x="42" y="36" width="14" height="16" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <line x1="4" y1="52" x2="60" y2="52" stroke="currentColor" strokeWidth="1.5"/>
                <polyline points="4,36 15,24 28,16 36,16 48,24 60,36" fill="none" stroke="currentColor" strokeWidth="1" strokeDasharray="3 2" opacity="0.4"/>
              </svg>
            ),
          },
          {
            id: 'solo',
            title: 'SOLO SURVIVOR',
            subtitle: 'The Wanderer',
            desc: 'Traverse lethal biomes alone. Scavenge rare RMAT, repair vehicles, and extract through high-risk expeditions.',
            pillars: ['Biome Traversal','RMAT Extraction','Gear & Vehicles','Hideout Upgrades','Risk Runs'],
            color: 'var(--amber)',
            icon: (
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="14" r="6" fill="none" stroke="currentColor" strokeWidth="1.5"/>
                <line x1="32" y1="20" x2="32" y2="42" stroke="currentColor" strokeWidth="2"/>
                <line x1="20" y1="30" x2="44" y2="30" stroke="currentColor" strokeWidth="1.5"/>
                <line x1="32" y1="42" x2="22" y2="54" stroke="currentColor" strokeWidth="1.5"/>
                <line x1="32" y1="42" x2="42" y2="54" stroke="currentColor" strokeWidth="1.5"/>
                <path d="M12 48 Q22 36 32 44 Q42 52 52 38" fill="none" stroke="currentColor" strokeWidth="1" strokeDasharray="3 2" opacity="0.5"/>
              </svg>
            ),
          },
        ].map(mode => (
          <div
            key={mode.id}
            className="scanline-hover"
            onMouseEnter={() => setHovered(mode.id)}
            onMouseLeave={() => setHovered(null)}
            onClick={() => onSelect(mode.id)}
            style={{
              width: 340, cursor: 'pointer', position: 'relative',
              border: `1px solid ${hovered === mode.id ? mode.color : 'var(--border)'}`,
              background: hovered === mode.id ? 'var(--bg3)' : 'var(--bg2)',
              transition: 'all 0.2s', padding: 32,
              boxShadow: hovered === mode.id ? `0 0 40px rgba(${mode.id==='camp'?'76,175,125':'200,169,110'},0.1)` : 'none',
            }}
          >
            <div className="scanline-inner"/>
            {/* Mode icon */}
            <div style={{color: mode.color, marginBottom:20, display:'flex', justifyContent:'center'}}>
              {mode.icon}
            </div>
            <div style={{fontFamily:'var(--font-title)', fontSize:28, color: mode.color, letterSpacing:'0.06em', textAlign:'center'}}>
              {mode.title}
            </div>
            <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--text3)', letterSpacing:'0.2em', textAlign:'center', marginTop:4, marginBottom:16}}>
              {mode.subtitle}
            </div>
            <div style={{
              height:1, background:`linear-gradient(90deg, transparent, ${mode.color}, transparent)`,
              marginBottom:16, opacity:0.4,
            }}/>
            <div style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--text2)', lineHeight:1.6, textAlign:'center', marginBottom:20}}>
              {mode.desc}
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:6}}>
              {mode.pillars.map(p => (
                <div key={p} style={{display:'flex', alignItems:'center', gap:8}}>
                  <div style={{width:4, height:4, background:mode.color, flexShrink:0}}/>
                  <span style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--text2)', letterSpacing:'0.06em'}}>{p}</span>
                </div>
              ))}
            </div>
            {hovered === mode.id && (
              <div style={{
                marginTop:24, display:'flex', justifyContent:'center',
              }}>
                <div style={{
                  fontFamily:'var(--font-body)', fontSize:12, letterSpacing:'0.2em', textTransform:'uppercase',
                  color: mode.color, border:`1px solid ${mode.color}`, padding:'8px 24px',
                }}>
                  Begin Survival →
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Footer */}
      <div style={{

// ─── MOODLES PANEL (PZ-inspired status effects) ────────────────────────────
function MoodlesPanel({ survivor }) {
  // Derive moodles from survivor stats — mirrors PZ's automatic moodle system
  const moodles = [];
  const nutri = getNutritionLevel(survivor.nutrition);
  const hydration = getHydrationLevel(survivor.hydration);

  // Hunger moodle (PZ: Peckish → Hungry → Very Hungry → Famished → Starving)
  if (survivor.nutrition < 35) {
    const lvl = survivor.nutrition < 15 ? 4 : survivor.nutrition < 25 ? 3 : 2;
    moodles.push({ key:'hungry', icon:'🍖', label: ZI.MOODLES.Hungry.levels[lvl], color: ZI.MOODLES.Hungry.color,
      severity: lvl, penalty: `Stamina ${(ZI.MOODLES.Hungry.staminaPenalties[lvl]*100).toFixed(0)}% · XP ${(ZI.MOODLES.Hungry.xpPenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Famished survivors have visibly shaking hands and reduced combat speed' });
  }
  if (survivor.hydration < 45) {
    const lvl = survivor.hydration < 20 ? 3 : survivor.hydration < 32 ? 2 : 1;
    moodles.push({ key:'thirsty', icon:'💧', label: ZI.MOODLES.Thirsty.levels[lvl], color: ZI.MOODLES.Thirsty.color,
      severity: lvl, penalty: `Stamina ${(ZI.MOODLES.Thirsty.staminaPenalties[lvl]*100).toFixed(0)}% · Speed ${(ZI.MOODLES.Thirsty.speedPenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Dehydration causes blurred vision effects and rapid stamina drain' });
  }
  if (survivor.morale < 50) {
    const lvl = survivor.morale < 25 ? 2 : 1;
    moodles.push({ key:'panicked', icon:'😰', label: ZI.MOODLES.Panicked.levels[lvl], color: ZI.MOODLES.Panicked.color,
      severity: lvl, penalty: `Accuracy ${(ZI.MOODLES.Panicked.accuracyPenalties[lvl]*100).toFixed(0)}% · Noise +${(ZI.MOODLES.Panicked.noisePenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Panicked survivors breathe loudly — increasing detection radius' });
  }
  if (survivor.status === 'hungry') {
    moodles.push({ key:'tired', icon:'😴', label:'Tired', color: ZI.MOODLES.Tired.color,
      severity:1, penalty:'Attack Speed -10% · Awareness -15%',
      pzNote:'PZ: Tired survivors miss more often and react slower to threats' });
  }
  if (survivor.id === 4) { // Cole Marsh — show infection for demo
    moodles.push({ key:'sick', icon:'🤢', label:'Queasy', color: ZI.MOODLES.Sick.color,
      severity:0, penalty:'HP drain 0/hr · Stamina -5%',
      pzNote:'PZ: Queasy can be early infection — check for bites immediately' });
  }

  if (moodles.length === 0) return (
    <div style={{padding:'6px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>✓ No active moodles</div>
    </div>
  );

  return (
    <div style={{display:'flex', flexDirection:'column', gap:4}}>
      {moodles.map(m => (
        <div key={m.key} style={{
          padding:'5px 8px', background:'var(--bg4)',
          borderLeft:`3px solid ${m.color}`,
          border:`1px solid ${m.color}33`,
        }}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
            <span style={{fontSize:11}}>{m.icon}</span>
            <span style={{fontFamily:'var(--font-body)', fontSize:12, color:m.color, fontWeight:500}}>{m.label}</span>
            <div style={{display:'flex', gap:1, marginLeft:'auto'}}>
              {[0,1,2,3].map(i => (
                <div key={i} style={{
                  width:5, height:5, borderRadius:1,
                  background: i <= m.severity ? m.color : 'var(--border2)',
                }}/>
              ))}
            </div>
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{m.penalty}</div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:2, fontStyle:'italic', opacity:0.7}}>{m.pzNote}</div>
        </div>
      ))}
    </div>
  );
}

// ─── INFECTION TRACKER (PZ's Knox Infection logic) ─────────────────────────
function InfectionTracker({ survivor }) {
  // Simulate infection state
  const infectionStates = {
    1: null,
    2: null,
    3: null,
    4: { stage: 0, hoursElapsed: 2, source: 'Laceration (25% chance)', treatable: true },
    5: null,
    6: null,
  };
  const infection = infectionStates[survivor.id];

  return (
    <div style={{marginBottom:8}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>
        INFECTION STATUS
        <span style={{marginLeft:6, color:'var(--text3)', fontSize:8}}>(PZ Knox Model)</span>
      </div>
      {infection ? (
        <div style={{padding:'7px 8px', background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)'}}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
            <div className="notif-dot"/>
            <span style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--red2)', fontWeight:500}}>
              {ZI.INFECTION.symptoms[infection.stage]}
            </span>
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:3}}>
            Source: {infection.source} · {infection.hoursElapsed}h elapsed
          </div>
          {infection.treatable && (
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>
              ✓ Medical RMAT cure available ({'<'}6h window)
            </div>
          )}
          {/* Symptom progression */}
          <div style={{display:'flex', gap:2, marginTop:5, flexWrap:'wrap'}}>
            {ZI.INFECTION.symptoms.map((s, i) => (
              <div key={i} style={{
                fontFamily:'var(--font-mono)', fontSize:8, padding:'1px 5px',
                background: i === infection.stage ? 'rgba(139,58,42,0.3)' : 'transparent',
                color: i === infection.stage ? 'var(--red2)' : i < infection.stage ? 'var(--text3)' : 'var(--text3)',
                border:`1px solid ${i === infection.stage ? 'var(--red)' : 'var(--border)'}`,
              }}>{s}</div>
            ))}
          </div>
          <div style={{marginTop:5, fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic'}}>
            PZ: Bite = 100% fatal. Laceration = 25%. Treat immediately with Medical RMAT.
          </div>
        </div>
      ) : (
        <div style={{padding:'5px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>
            ✓ No active infection · Last checked: post-horde
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:2}}>
            Bite: 100% · Laceration: 25% · Scratch: 7% infection chance
          </div>
        </div>
      )}
    </div>
  );
}

// ─── FATIGUE TRACKER (PZ-style sleep deprivation cascade) ──────────────────
function FatigueTracker({ hoursAwake = 14 }) {
  const phase = ZI.FATIGUE_MODEL.phases.find(p => hoursAwake >= p.hoursAwake[0] && hoursAwake < p.hoursAwake[1])
    || ZI.FATIGUE_MODEL.phases[ZI.FATIGUE_MODEL.phases.length - 1];
  const pct = clamp((hoursAwake / 24) * 100, 0, 100);

  return (
    <div style={{marginBottom:8}}>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:3}}>
        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>FATIGUE</span>
        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:phase.color}}>{phase.level} · {hoursAwake}h awake</span>
      </div>
      <ProgressBar value={pct} color={phase.color} height={5} animated={hoursAwake > 20}/>
      <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:3}}>
        Combat {phase.combatMod >= 0 ? '+' : ''}{(phase.combatMod*100).toFixed(0)}% · XP {phase.xpMod >= 0 ? '+' : ''}{(phase.xpMod*100).toFixed(0)}%
        <span style={{marginLeft:6, fontStyle:'italic', opacity:0.7}}>· PZ: ignored fatigue → forced blackout</span>
      </div>
    </div>
  );
}

// ─── NOISE METER (PZ noise mechanics) ────────────────────────────────────────
function NoiseMeter({ route, runMode }) {
  const vehicleNoise = ZI.VEHICLE_SYSTEMS.noiseBiome[route.biome] || ZI.VEHICLE_SYSTEMS.noiseBiome.suburbia;
  // Base noise: vehicle engine + run mode modifier
  const baseDb = runMode === 'passive' ? vehicleNoise.engineNoise : Math.round(vehicleNoise.engineNoise * 0.6);
  const hearingRange = runMode === 'passive' ? vehicleNoise.hearingRange : Math.round(vehicleNoise.hearingRange * 0.5);
  const noisePct = clamp((baseDb / 160) * 100, 0, 100);
  const noiseColor = noisePct > 75 ? 'var(--red2)' : noisePct > 45 ? 'var(--amber)' : 'var(--green)';

  return (
    <div style={{marginBottom:10}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>
        NOISE PROFILE <span style={{fontStyle:'italic', color:'var(--text3)', fontSize:7}}>· PZ hearing model</span>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:4}}>
        <div>
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
            <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
              {runMode === 'passive' ? 'Vehicle (engine on)' : 'Foot movement'}
            </span>
            <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:noiseColor}}>{baseDb} dB</span>
          </div>
          <ProgressBar value={noisePct} color={noiseColor} height={5} animated={noisePct > 75}/>
        </div>
        <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
          Hearing range: <span style={{color:noiseColor}}>{hearingRange}m</span>
          <span style={{marginLeft:8, fontSize:8, fontStyle:'italic'}}>{vehicleNoise.note}</span>
        </div>
        {runMode === 'passive' && baseDb > 100 && (
          <div style={{padding:'4px 7px', background:'rgba(139,58,42,0.12)', border:'1px solid var(--red)', fontFamily:'var(--font-mono)', fontSize:8, color:'var(--red2)'}}>
            ⚠ PZ rule: sustained engine noise draws migration waves. Consider foot approach at POIs.
          </div>
        )}
        {/* Quick reference: key noise sources */}
        <div style={{marginTop:2}}>
          {[
            { label:'Gunshot', db: 140, icon:'🔫' },
            { label:'Running', db: 50,  icon:'🏃' },
            { label:'Crouch',  db: 15,  icon:'🦶' },
          ].map(n => (
            <div key={n.label} style={{display:'flex', alignItems:'center', gap:5, marginBottom:2}}>
              <span style={{fontSize:9}}>{n.icon}</span>
              <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', width:50}}>{n.label}</span>
              <div style={{flex:1, height:3, background:'var(--bg4)', borderRadius:1, overflow:'hidden'}}>
                <div style={{width:`${(n.db/160)*100}%`, height:'100%',
                  background: n.db > 100 ? 'var(--red2)' : n.db > 60 ? 'var(--amber)' : 'var(--green)'
                }}/>
              </div>
              <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', width:28, textAlign:'right'}}>{n.db}dB</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── WEATHER PANEL (PZ weather impact) ───────────────────────────────────────
function WeatherPanel({ biomeId }) {
  const weatherByBiome = {
    mountain:  { condition: 'Fog', data: ZI.WEATHER_EFFECTS.Fog,       icon:'🌫️' },
    suburbia:  { condition: 'Rain', data: ZI.WEATHER_EFFECTS.Rain,      icon:'🌧️' },
    metro:     { condition: 'Acid Rain', data: ZI.WEATHER_EFFECTS.AcidRain, icon:'☠️' },
    perimeter: { condition: 'Radiation Storm', data: ZI.WEATHER_EFFECTS.RadiationStorm, icon:'☢️' },
  };
  const w = weatherByBiome[biomeId] || weatherByBiome.suburbia;

  const effects = Object.entries(w.data)
    .filter(([k]) => k !== 'note')
    .slice(0, 4);

  return (
    <div style={{marginBottom:10}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>WEATHER CONDITIONS</div>
      <div style={{padding:'7px 9px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
        <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:5}}>
          <span style={{fontSize:14}}>{w.icon}</span>
          <span style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--amber)'}}>{w.condition}</span>
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:3}}>
          {effects.map(([key, val]) => {
            const isGood = typeof val === 'number' && val < 0;
            const isBad  = typeof val === 'number' && val > 0 && key !== 'rmatYield';
            const label = key.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
            const display = typeof val === 'boolean' ? (val ? 'Active' : 'None') :
              typeof val === 'number' ? `${val > 0 ? '+' : ''}${(val*100).toFixed(0)}%` : val;
            return (
              <div key={key} style={{display:'flex', justifyContent:'space-between'}}>
                <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{label}</span>
                <span style={{fontFamily:'var(--font-mono)', fontSize:9,
                  color: isGood ? 'var(--green)' : isBad ? 'var(--red2)' : 'var(--amber)'
                }}>{display}</span>
              </div>
            );
          })}
        </div>
        {w.data.note && (
          <div style={{marginTop:5, fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic', lineHeight:1.4}}>
            {w.data.note}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CONTAINERS PANEL (PZ loot container logic) ──────────────────────────────
function ContainersPanel({ biomeId }) {
  const containersByBiome = {
    mountain:  ['Glovebox','CarTrunk','KitchenCabinet'],
    suburbia:  ['KitchenCabinet','CarTrunk','WarehouseShelf','GunCabinet'],
    metro:     ['WarehouseShelf','HospitalShelf','PoliceArmory','GunCabinet'],
    perimeter: ['LabStorage','HospitalShelf','PoliceArmory'],
  };
  const containers = (containersByBiome[biomeId] || containersByBiome.suburbia)
    .map(k => ({ key:k, ...ZI.LOOT_CONTAINERS[k] }));

  return (
    <div style={{marginBottom:10}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>
        LOOT CONTAINERS <span style={{fontSize:7, fontStyle:'italic'}}>· PZ container model</span>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:4}}>
        {containers.map(c => (
          <div key={c.key} style={{
            padding:'5px 8px', background:'var(--bg3)', border:'1px solid var(--border)',
            display:'flex', alignItems:'center', gap:8,
          }}>
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', gap:5, marginBottom:2}}>
                <span style={{fontFamily:'var(--font-body)', fontSize:11, color:'var(--text)'}}>
                  {c.key.replace(/([A-Z])/g,' $1').trim()}
                </span>
                {c.locked && <Tag color="var(--red2)">Locked</Tag>}
                {c.requiresKeycard && <Tag color="var(--purple)">Keycard</Tag>}
              </div>
              <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)'}}>{c.items.slice(0,2).join(' · ')}</div>
            </div>
            <div style={{textAlign:'right', flexShrink:0}}>
              <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--amber)'}}>{Math.round(c.baseChance*100)}% find</div>
              {c.rmatChance > 0 && (
                <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--purple)'}}>
                  {Math.round(c.rmatChance*100)}% RMAT
                </div>
              )}
            </div>
          </div>
        ))}
        <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic', lineHeight:1.5}}>
          PZ: containers exhausted after {containers[0]?.exhaustedAfter||1} loot{(containers[0]?.exhaustedAfter||1)>1?'s':''}. Respawn in 7–30 days.
        </div>
      </div>
    </div>
  );
}

                      </div>

              <div style={{marginTop:8, padding:'6px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
                <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.6}}>
                  <b style={{color:'var(--text2)'}}>Memory:</b> Zombies forget position after ~{ZI.ZOMBIE_BEHAVIOR.memory.duration_s}s<br/>
                  <b style={{color:'var(--text2)'}}>Migration:</b> Above {ZI.ZOMBIE_BEHAVIOR.hearing.migration_threshold} in area = wave begins<br/>

        {tab === 'loot' && (
          <ContainersPanel biomeId={route.biome}/>

        {!canRun && (
          <div style={{
            padding:'6px 10px', background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)',
            fontFamily:'var(--font-mono)', fontSize:10, color:'var(--red2)', marginTop:8,
          }}>
            ⚠ Stamina too low. Eat and rest before departing.
          </div>
        )}
      </div>
      <div style={{padding:10, borderTop:'1px solid var(--border)'}}>
        <button
          onClick={canRun ? onLaunch : undefined}
          className="btn btn-amber"
          style={{ width:'100%', opacity: canRun ? 1 : 0.4, cursor: canRun ? 'pointer' : 'not-allowed' }}

          {runMode==='active' ? '→ Deploy (Active)' : '→ Deploy (Idle)'}

}

// ─── LOOT LOADING SCREEN ─────────────────────────────────────────────────────
// PZ justification: in PZ, transferring items between containers and vehicles
// takes real time proportional to item count. Heavier/bulkier items take longer.
// Zombie Idler makes this a dedicated screen to reinforce resource weight & time cost.
function LootLoadingScreen({ route, onComplete }) {
  const [phase, setPhase] = useState('arriving');
  const [loadProgress, setLoadProgress] = useState({});
  const [lootItems] = useState([
    { id:'l1', cat:'heavy',  name:'Reinforced Steel Panels ×4',  weight:120, container:'WarehouseShelf', timeMs:9000 },
    { id:'l2', cat:'medium', name:'Canned Rations ×18',           weight:36,  container:'KitchenCabinet', timeMs:4500 },
    { id:'l3', cat:'medium', name:'Advanced Toolkit',             weight:8,   container:'CarTrunk',       timeMs:3200 },
    { id:'l4', cat:'light',  name:'RMAT-1 Mechanical Shard ×2',  weight:1,   container:'ZombiePocket',   timeMs:1800 },
    { id:'l5', cat:'light',  name:'RMAT-1 Chemical Vial',         weight:1,   container:'LabStorage',     timeMs:1500 },
    { id:'l6', cat:'data',   name:'Blueprint: Workshop III',      weight:0,   container:'LabStorage',     timeMs:800  },
  ]);
  const [completedItems, setCompletedItems] = useState(new Set());
  const [activeItem, setActiveItem] = useState(null);
  const [vehicleOffload, setVehicleOffload] = useState(0);

  // PZ vehicle condition degradation during route
  const vehicleCondition = { before: 65, after: 47 };
  const vehComponents = [
    { name:'Engine',     before: 80, after: 74, component: ZI.VEHICLE_SYSTEMS.components.Engine },
    { name:'Tires',      before: 62, after: 42, component: ZI.VEHICLE_SYSTEMS.components.Tires },
    { name:'Battery',    before: 90, after: 88, component: ZI.VEHICLE_SYSTEMS.components.Battery },
    { name:'Brake Fluid',before: 75, after: 73, component: ZI.VEHICLE_SYSTEMS.components.BrakeFluid },
  ];

  // Character state after run (PZ fatigue model)
  const runHours = route?.duration || 4;
  const fatiguePhase = ZI.FATIGUE_MODEL.phases.find(p => (10 + runHours) >= p.hoursAwake[0] && (10 + runHours) < p.hoursAwake[1])
    || ZI.FATIGUE_MODEL.phases[ZI.FATIGUE_MODEL.phases.length-1];

  useEffect(() => {
    if (phase !== 'unloading') return;
    let delay = 1000;
    lootItems.forEach((item) => {
      setTimeout(() => {
        setActiveItem(item.id);
        const start = Date.now();
        const interval = setInterval(() => {
          const elapsed = Date.now() - start;
          const pct = Math.min((elapsed / item.timeMs) * 100, 100);
          setLoadProgress(p => ({ ...p, [item.id]: pct }));
          setVehicleOffload(v => Math.min(v + 0.3, 100));
          if (pct >= 100) {
            clearInterval(interval);
            setCompletedItems(prev => new Set([...prev, item.id]));
            setActiveItem(null);
          }
        }, 80);
      }, delay);
      delay += item.timeMs + 600;
    });
    setTimeout(() => setPhase('complete'), delay + 1000);
  }, [phase]);

  useEffect(() => {
    const t = setTimeout(() => setPhase('unloading'), 2400);
    return () => clearTimeout(t);
  }, []);

  const catColors = { heavy:'var(--red2)', medium:'var(--amber)', light:'var(--purple)', data:'var(--blue)' };

  return (
    <div className="screen-enter" style={{
      display:'flex', height:'100%', background:'var(--bg)',
      position:'relative', overflow:'hidden',
    }}>
      {/* Background grid */}
      <div style={{
        position:'absolute', inset:0, opacity:0.03,
        backgroundImage:'linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)',
        backgroundSize:'48px 48px', pointerEvents:'none',
      }}/>

      {/* Main content */}
      <div style={{
        position:'relative', zIndex:1, width:'100%',
        display:'flex', gap:0, padding:0, overflow:'hidden',
      }}>
        {/* CENTER: Loot unloading */}
        <div style={{flex:1, display:'flex', flexDirection:'column', padding:'24px 28px', overflow:'auto'}}>
          {/* Header */}
          <div style={{marginBottom:24}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)', letterSpacing:'0.3em', marginBottom:6}}>
              {phase==='arriving' ? '— VEHICLE RETURNING —' : phase==='unloading' ? '— UNLOADING CARGO —' : '— EXTRACTION COMPLETE —'}
            </div>
            <div style={{fontFamily:'var(--font-title)', fontSize:30, color:'var(--amber)', lineHeight:1}}>
              {route?.name || 'Crestwood Drive'}
            </div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)', marginTop:5, display:'flex', gap:12}}>
              <span>{route?.biome ? ZI.BIOMES.find(b=>b.id===route.biome)?.name : 'Ruined Suburbia'}</span>
              <span>·</span>
              <span>{route?.duration || 4}h Run</span>
              <span>·</span>
              <span style={{color: fatiguePhase.color}}>{fatiguePhase.level} on return</span>
            </div>
          </div>

          {/* Vehicle status bar */}
          <div style={{
            background:'var(--bg2)', border:'1px solid var(--border)',
            padding:'12px 16px', marginBottom:16,
            display:'flex', alignItems:'center', gap:16,
          }}>
            <div style={{fontSize:28, flexShrink:0}}>🚛</div>
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5}}>
                <span style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--text)'}}>Reinforced Truck — Cargo Bay</span>
                <span style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--amber)'}}>
                  {Math.round(vehicleOffload)}% Unloaded
                </span>
              </div>
              <ProgressBar value={vehicleOffload} color="var(--amber)" animated={phase==='unloading'} height={7}/>
            </div>
            <div style={{textAlign:'right', flexShrink:0}}>
              {phase === 'arriving' && (
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)'}}>ARRIVING...</div>
              )}
              {phase === 'complete' && (
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--green)'}}>✓ UNLOADED</div>
              )}
            </div>
          </div>

          {/* Loot items */}
          <div style={{display:'flex', flexDirection:'column', gap:5, marginBottom:16}}>
            {lootItems.map(item => {
              const isDone = completedItems.has(item.id);
              const isActive = activeItem === item.id;
              const pct = loadProgress[item.id] || 0;
              const catObj = ZI.LOOT_CATEGORIES[item.cat];
              const color = catColors[item.cat];
              const container = ZI.LOOT_CONTAINERS[item.container];

              return (
                <div key={item.id} style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'8px 14px', background:'var(--bg2)',
                  border:`1px solid ${isDone ? 'var(--border2)' : isActive ? color : 'var(--border)'}`,
                  transition:'all 0.3s', opacity: phase==='arriving' ? 0.5 : 1,
                }}>
                  <div style={{
                    width:8, height:8, borderRadius:'50%', flexShrink:0,
                    background: isDone ? 'var(--green)' : isActive ? color : 'var(--border2)',
                    boxShadow: isActive ? `0 0 8px ${color}` : 'none',
                    transition:'all 0.3s',
                  }}/>
                  <div style={{flex:1}}>
                    <div style={{display:'flex', alignItems:'center', gap:8, marginBottom: (isActive||isDone) ? 3 : 0}}>
                      <span style={{fontFamily:'var(--font-body)', fontSize:13, color: isDone?'var(--text2)':isActive?'var(--text)':'var(--text2)'}}>
                        {item.name}
                      </span>
                      <Tag color={color}>{catObj?.label}</Tag>
                      {item.weight > 0 && (
                        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{item.weight}kg</span>
                      )}
                      <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginLeft:'auto'}}>
                        from {item.container.replace(/([A-Z])/g,' $1').trim()}
                      </span>
                    </div>
                    {(isActive || isDone) && (
                      <ProgressBar value={pct} color={isDone?'var(--green)':color} height={3} animated={isActive}/>
                    )}
                  </div>
                  <div style={{
                    fontFamily:'var(--font-mono)', fontSize:11,
                    color: isDone?'var(--green)':isActive?color:'var(--text3)',
                    width:64, textAlign:'right', flexShrink:0,
                  }}>
                    {isDone ? '✓ STORED' : isActive ? `${Math.round(pct)}%` : phase==='arriving'?'PENDING':'QUEUED'}
                  </div>
                </div>
              );
            })}
          </div>

          {phase === 'unloading' && (
            <div style={{
              textAlign:'center', fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)',
              padding:'8px', background:'var(--bg2)', border:'1px solid var(--border)',
            }}>
              Unloading in progress — heavy cargo takes longer (PZ container transfer logic). Do not interrupt.
            </div>
          )}

          {phase === 'complete' && (
            <div style={{display:'flex', gap:10, justifyContent:'center', marginTop:8}}>
              <button className="btn btn-amber btn-lg" onClick={onComplete}>
                Return to Hideout →
              </button>
            </div>
          )}
        </div>

        {/* RIGHT SIDEBAR: Vehicle condition + character state */}
        <div style={{
          width:280, borderLeft:'1px solid var(--border)', background:'var(--bg2)',
          display:'flex', flexDirection:'column', overflow:'auto', flexShrink:0,
        }}>
          {/* Vehicle degradation (PZ mechanics) */}
          <div style={{padding:'14px 14px 10px', borderBottom:'1px solid var(--border)'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>
              VEHICLE CONDITION <span style={{fontSize:7, fontStyle:'italic'}}>· PZ degradation model</span>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:7}}>
              {vehComponents.map(vc => {
                const drop = vc.before - vc.after;
                const condColor = vc.after > 70 ? 'var(--green)' : vc.after > 40 ? 'var(--amber)' : 'var(--red2)';
                return (
                  <div key={vc.name}>
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text2)'}}>{vc.name}</span>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:condColor}}>
                        {vc.after}% <span style={{color:'var(--red2)', fontSize:8}}>▼{drop}</span>
                      </span>
                    </div>
                    <ProgressBar value={vc.after} color={condColor} height={4}/>
                    {vc.after < 50 && (
                      <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--red2)', marginTop:2}}>
                        ⚠ {vc.component.failureEffect} — needs {vc.component.repairSkill}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{
              marginTop:8, padding:'5px 8px', background:'var(--bg4)',
              borderLeft:'3px solid var(--amber)',
              fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.5,
            }}>
              PZ rule: Tires degrade fastest off-road. Always carry a spare. Brake failure mid-escape = death.
            </div>
          </div>

          {/* Character post-run state */}
          <div style={{padding:'12px 14px', borderBottom:'1px solid var(--border)'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>
              CHARACTER STATE <span style={{fontSize:7, fontStyle:'italic'}}>· post-run</span>
            </div>
            <FatigueTracker hoursAwake={10 + runHours}/>
            <div style={{marginTop:6}}>
              <NutritionBar label="Nutrition (depleted)" value={62} level={getNutritionLevel(62)}/>
              <div style={{height:5}}/>
              <NutritionBar label="Hydration (depleted)" value={48} level={getHydrationLevel(48)}/>
            </div>
            <div style={{
              marginTop:8, padding:'5px 8px', background:'var(--bg4)',
              borderLeft:'3px solid var(--amber)',
              fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.5,
            }}>
              PZ: a {runHours}h run burns ~{Math.round(runHours * 8)} stamina. Schedule rest + meal immediately or next run suffers cascading penalties.
            </div>
          </div>

          {/* Infection check reminder */}
          <div style={{padding:'12px 14px'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:6, letterSpacing:'0.12em'}}>
              POST-RUN CHECKLIST
            </div>
            {[
              { ok: true,  label: 'No bite detected', note: 'PZ: check after every zombie contact' },
              { ok: true,  label: 'No laceration wounds', note: '25% infection chance if untreated' },
              { ok: false, label: 'Tires need repair', note: 'PZ: blowout risk on next run' },
              { ok: true,  label: 'Gear durability OK', note: 'Acid rain caused minor corrosion' },
              { ok: false, label: 'Eat & hydrate before sleep', note: 'PZ: sleeping while hungry slows healing' },
            ].map((item, i) => (
              <div key={i} style={{
                display:'flex', alignItems:'flex-start', gap:7, marginBottom:5,
              }}>
                <div style={{
                  width:14, height:14, borderRadius:2, flexShrink:0, marginTop:1,
                  background: item.ok ? 'rgba(76,175,125,0.15)' : 'rgba(139,58,42,0.15)',
                  border:`1px solid ${item.ok ? 'var(--green)' : 'var(--red2)'}`,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:8, color: item.ok ? 'var(--green)' : 'var(--red2)',
                }}>{item.ok ? '✓' : '!'}</div>
                <div>
                  <div style={{fontFamily:'var(--font-body)', fontSize:11, color: item.ok?'var(--text2)':'var(--text)'}}>{item.label}</div>
                  <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic'}}>{item.note}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SCHEDULE SCREEN ─────────────────────────────────────────────────────────
function ScheduleScreen({ mode }) {
  const [tasks, setTasks] = useState([
    { id:1, type:'rest',     label:'Rest & Recover',    duration:3,  priority:1, status:'queued', startIn:0 },
    { id:2, type:'craft',    label:'Craft: Hazard Suit T2', duration:2, priority:2, status:'queued', startIn:3 },
    { id:3, type:'faction',  label:'Iron March Contract', duration:4, priority:3, status:'queued', startIn:5 },
    { id:4, type:'scavenge', label:'Scavenge: Crestwood Drive', duration:4, priority:4, status:'queued', startIn:9 },
    { id:5, type:'train',    label:'Train: Reflex',      duration:3,  priority:5, status:'queued', startIn:13 },
    { id:6, type:'repair',   label:'Repair: Reinforced Truck', duration:2, priority:6, status:'queued', startIn:16 },
  ]);
  const [dragIdx, setDragIdx] = useState(null);

  const totalHours = tasks.reduce((s, t) => s + t.duration, 0);
  const TIMELINE_HOURS = 24;

  const moveUp = (idx) => {
    if (idx === 0) return;
    const t = [...tasks];
    [t[idx-1], t[idx]] = [t[idx], t[idx-1]];
    setTasks(t.map((task, i) => ({...task, priority: i+1})));
  };
  const moveDown = (idx) => {
    if (idx === tasks.length-1) return;
    const t = [...tasks];
    [t[idx], t[idx+1]] = [t[idx+1], t[idx]];
    setTasks(t.map((task, i) => ({...task, priority: i+1})));
  };
  const removeTask = (id) => setTasks(tasks.filter(t => t.id !== id));

  const taskColors = {
    rest:'var(--blue)', craft:'var(--amber)', faction:'var(--purple)',
    scavenge:'var(--green)', train:'var(--red2)', repair:'var(--text2)',
    assign:'var(--amber2)', trade:'var(--green2)', defend:'var(--red)',
    extract:'var(--purple)',
  };

  // Timeline bar
  let cursor = 0;
  const timelineBlocks = tasks.map(task => {
    const block = { ...task, start: cursor, widthPct: (task.duration / TIMELINE_HOURS) * 100 };
    cursor += task.duration;
    return block;
  });

  return (
    <div className="screen-enter" style={{display:'flex', gap:8, padding:8, height:'100%', overflow:'hidden'}}>
      {/* Left: Task queue */}
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:8, minWidth:0, overflow:'hidden'}}>
        {/* Timeline */}
        <div className="panel" style={{padding:'10px 12px', flexShrink:0}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
            <div style={{fontFamily:'var(--font-title)', fontSize:14, color:'var(--amber)', letterSpacing:'0.1em'}}>24-HOUR SCHEDULE TIMELINE</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:10, color: totalHours > TIMELINE_HOURS ? 'var(--red2)' : 'var(--green)'}}>
              {totalHours}h / {TIMELINE_HOURS}h used
            </div>
          </div>
          {/* Hour markers */}
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:3}}>
            {[0,4,8,12,16,20,24].map(h => (
              <span key={h} style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
                {h === 0 ? 'NOW' : `+${h}h`}
              </span>
            ))}
          </div>
          {/* Timeline bar */}
          <div style={{height:28, background:'var(--bg4)', borderRadius:2, overflow:'hidden', display:'flex', position:'relative'}}>
            {timelineBlocks.map((block, i) => (
              <div key={block.id} style={{
                width: `${block.widthPct}%`, height:'100%', flexShrink:0,
                background: taskColors[block.type] || 'var(--text2)',
                borderRight: '1px solid var(--bg)',
                display:'flex', alignItems:'center', paddingLeft:4, overflow:'hidden',
                opacity: 0.8,
              }}>
                <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(255,255,255,0.8)', whiteSpace:'nowrap', overflow:'hidden'}}>
                  {block.label.split(':')[0]}
                </span>
              </div>
            ))}
            {totalHours < TIMELINE_HOURS && (
              <div style={{flex:1, background:'var(--bg4)', borderLeft:'1px dashed var(--border2)'}}/>
            )}
          </div>
          <div style={{marginTop:5, fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
            Scheduled window: when you return {totalHours > 0 ? `in ~${totalHours}h` : 'now'} · Tasks execute in priority order
          </div>
        </div>

        {/* Task list */}
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title" style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
            <span>Scheduled Tasks — Priority Order</span>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>Drag to reorder</div>
          </div>
          <div style={{flex:1, overflow:'auto', padding:8, display:'flex', flexDirection:'column', gap:5}}>
            {tasks.map((task, idx) => {
              const color = taskColors[task.type] || 'var(--text2)';
              const taskType = ZI.TASK_TYPES.find(t => t.id === task.type);
              const startTime = tasks.slice(0,idx).reduce((s,t)=>s+t.duration,0);
              return (
                <div key={task.id} style={{
                  display:'flex', alignItems:'center', gap:10,
                  padding:'8px 12px', background:'var(--bg3)',
                  border:`1px solid ${dragIdx===idx ? 'var(--amber)' : 'var(--border)'}`,
                  cursor:'grab',
                }}>
                  {/* Priority number */}
                  <div style={{
                    width:22, height:22, borderRadius:'50%', border:`1px solid ${color}`,
                    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
                    fontFamily:'var(--font-mono)', fontSize:10, color,
                  }}>{idx+1}</div>

                  {/* Color bar */}
                  <div style={{width:3, height:32, background:color, borderRadius:1, flexShrink:0}}/>

                  {/* Task info */}
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color}}>{taskType?.icon}</span>
                      <span style={{fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', fontWeight:500}}>{task.label}</span>
                    </div>
                    <div style={{display:'flex', gap:8}}>
                      <Tag color={color}>{fmtTime(task.duration*60)}</Tag>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>Starts +{startTime}h from now</span>
                    </div>
                  </div>

                  {/* Controls */}
                  <div style={{display:'flex', gap:3, flexShrink:0}}>
                    <button onClick={() => moveUp(idx)} style={{
                      background:'var(--bg4)', border:'1px solid var(--border)', color:'var(--text2)',
                      width:22, height:22, cursor:'pointer', fontSize:10, display:'flex', alignItems:'center', justifyContent:'center',
                    }}>↑</button>
                    <button onClick={() => moveDown(idx)} style={{
                      background:'var(--bg4)', border:'1px solid var(--border)', color:'var(--text2)',
                      width:22, height:22, cursor:'pointer', fontSize:10, display:'flex', alignItems:'center', justifyContent:'center',
                    }}>↓</button>
                    <button onClick={() => removeTask(task.id)} style={{
                      background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)', color:'var(--red2)',
                      width:22, height:22, cursor:'pointer', fontSize:10, display:'flex', alignItems:'center', justifyContent:'center',
                    }}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Right: Add task + summary */}
      <div style={{width:280, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        {/* Add task panel */}
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">Add Task</div>
          <div style={{flex:1, overflow:'auto', padding:8, display:'flex', flexDirection:'column', gap:5}}>
            {ZI.TASK_TYPES.filter(t => t.category === 'both' || t.category === (mode==='camp'?'camp':'solo')).map(taskType => {
              const color = taskColors[taskType.id] || 'var(--text2)';
              return (
                <div key={taskType.id}
                  onClick={() => setTasks(prev => [...prev, {
                    id: Date.now(), type: taskType.id,
                    label: taskType.name, duration: taskType.duration,
                    priority: prev.length+1, status:'queued',
                  }])}
                  style={{
                    display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                    cursor:'pointer', background:'var(--bg3)', border:`1px solid var(--border)`,
                    transition:'all 0.15s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.borderColor=color}
                  onMouseLeave={e => e.currentTarget.style.borderColor='var(--border)'}
                >
                  <span style={{fontSize:14}}>{taskType.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--text)'}}>{taskType.name}</div>
                    <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{fmtTime(taskType.duration*60)}</div>
                  </div>
                  <span style={{fontFamily:'var(--font-mono)', fontSize:10, color}}>+ Add</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Schedule summary */}
        <div className="panel" style={{padding:12, flexShrink:0}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>SCHEDULE SUMMARY</div>
          <div style={{display:'flex', flexDirection:'column', gap:5}}>
            <InfoRow label="Total tasks" value={tasks.length} color="var(--text)"/>
            <InfoRow label="Total time" value={fmtTime(totalHours*60)} color={totalHours>24?'var(--red2)':'var(--amber)'}/>
            <InfoRow label="Completion" value={`+${totalHours}h from now`} color="var(--text2)"/>
          </div>
          <div style={{height:1, background:'var(--border)', margin:'10px 0'}}/>
          <button className="btn btn-amber" style={{width:'100%', marginBottom:8}}>
            Lock Schedule & Close App
          </button>
          <button className="btn" style={{width:'100%'}}>
            Save Draft
          </button>
          <div style={{marginTop:8, fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', lineHeight:1.5}}>
            Tasks run automatically while offline. Return in {fmtTime(totalHours*60)} to collect results.
          </div>
        </div>
      </div>
    </div>
  );
}

      </span>

  );
}

              <div key={tier.tier} style={{display:'flex', alignItems:'center', gap:6}}>
                <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:tier.color, width:70}}>T{tier.tier} {tier.name.split('-')[0]}</span>

              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const { TweaksPanel, useTweaks } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentColor": "#705729",
    "darkMode": true,
    "threatLevel": 5,
    "showAnimations": true,
    "resourceRates": true
  }/*EDITMODE-END*/;

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [screen, setScreen] = useState('mode-select');
  const [mode, setMode] = useState(null);
  const [activeRoute, setActiveRoute] = useState(null);

  const [resources, setResources] = useState({
    Food:     { current: 320,  max: 500, rate: 12 },
    Scrap:    { current: 1840, max: 3000, rate: 8 },
    Ammo:     { current: 1240, max: 2000, rate: 0 },
    Medicine: { current: 84,   max: 200,  rate: 3 },
    Fuel:     { current: 210,  max: 400,  rate: 0 },
    RMAT:     { current: 19,   max: 100,  rate: 0 },
  });

  // Idle tick
  useEffect(() => {
    if (!mode || !tweaks.resourceRates) return;
    const t = setInterval(() => {
      setResources(prev => {
        const next = { ...prev };
        Object.keys(next).forEach(k => {
          if (next[k].rate > 0) {
            next[k] = { ...next[k], current: Math.min(next[k].current + next[k].rate / 60, next[k].max) };
          }
        });
        return next;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [mode, tweaks.resourceRates]);

  const worldEvent = ZI.WORLD_EVENTS.find(e => e.active);

  const handleModeSelect = (m) => {
    setMode(m);
    setScreen(m === 'camp' ? 'camp-main' : 'solo-main');
  };

  const renderScreen = () => {
    switch (screen) {
      case 'mode-select':   return <ModeSelectScreen onSelect={handleModeSelect}/>;
      case 'camp-main':     return <CampMainScreen resources={resources} setResources={setResources} threatLevel={tweaks.threatLevel}/>;
      case 'solo-main':     return <SoloMainScreen setScreen={setScreen} setActiveRoute={setActiveRoute}/>;
      case 'solo-loading':  return <LootLoadingScreen route={activeRoute} onComplete={() => setScreen('solo-main')}/>;
      case 'camp-schedule': return <ScheduleScreenV2 mode="camp"/>;
      case 'solo-schedule': return <ScheduleScreenV2 mode="solo"/>;
      case 'rmat-crafting': return <RmatCraftingScreen/>;
      case 'factions':      return <FactionsScreen/>;
      case 'marketplace':   return <MarketplaceScreenV2/>;
      case 'stat-leveling': return <StatLevelingScreen/>;
      case 'traversal':     return <TraversalScreen route={activeRoute || ZI.ROUTES[1]}/>;
      case 'hack-slash':    return <HackSlashScreen activity={mode==='camp'?'contracts':'scavenge'}/>;
      default:              return <ModeSelectScreen onSelect={handleModeSelect}/>;
    }
  };

  return (
    <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {screen !== 'mode-select' && (
        <TopBar
          mode={mode}
          screen={screen}
          setScreen={setScreen}
          resources={resources}
          threatLevel={tweaks.threatLevel}
          worldEvent={worldEvent}
        />
      )}
      <div style={{flex:1, overflow:'hidden', position:'relative'}}>
        {renderScreen()}
      </div>

      {TweaksPanel && (
        <TweaksPanel>
          <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)}/>
          <TweakSlider label="Threat Level" min={1} max={5} step={1} value={tweaks.threatLevel} onChange={v => setTweak('threatLevel', v)}/>
          <TweakToggle label="Live Resource Ticks" value={tweaks.resourceRates} onChange={v => setTweak('resourceRates', v)}/>
          <TweakToggle label="Animations" value={tweaks.showAnimations} onChange={v => setTweak('showAnimations', v)}/>
        </TweaksPanel>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
