              <div style={{fontFamily:'var(--font-body)', fontSize:13, color: runMode===id ? 'var(--amber)' : 'var(--text)' }}>{label}</div>
              <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginTop:2}}>{desc}</div>
            </div>
          ))}
        </div>

        {/* Route list */}
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">Available Routes — {biome?.name}</div>
          <div style={{flex:1, overflow:'auto', padding:8, display:'flex', flexDirection:'column', gap:6}}>
            {filteredRoutes.length === 0 ? (
              <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text3)', padding:16, textAlign:'center'}}>
                No routes available. Upgrade gear to unlock deeper zones.
              </div>
            ) : filteredRoutes.map(route => (
              <RouteCard key={route.id} route={route}
                selected={selectedRoute?.id === route.id}
                threatLevel={threatLevel}
                autoRepeat={!!autoRepeat[route.id]}
                onToggleRepeat={runMode==='passive' ? toggleRepeat : null}
                onClick={() => setSelectedRoute(selectedRoute?.id===route.id ? null : route)}
              />
            ))}
          </div>
        </div>
      </div>

      {/* Right: Route detail + launch */}
      <div style={{width:260, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        {selectedRoute ? (
          <RouteDetailPanel
            route={selectedRoute}
            runMode={runMode}
            effectiveStamina={effectiveStamina}
            squad={isCamp ? squad : []}
            setSquad={setSquad}
            threatLevel={threatLevel}
            isCamp={isCamp}
            onLaunch={() => {
              // Start a live route run — it fills the node chain and resolves into Last Run when it finishes.
              const result = ZI.startRouteRun(selectedRoute, isCamp ? squad : [], runMode, threatLevel, !!autoRepeat[selectedRoute.id]);
              if (result && !result.ok) { setLaunchError(result.reason); return; }
              setLaunchError(null);
              setActiveRoute(selectedRoute); setScreen(isCamp && ZI.hasWorkingVehicle() ? 'solo-loading' : 'traversal');
            }}
          />
        ) : isCamp ? (
          <SquadAssignPanel
            route={filteredRoutes[0]}
            squad={squad}
            setSquad={setSquad}
            threatLevel={threatLevel}
            onPick={() => setSelectedRoute(filteredRoutes[0])}
          />
        ) : (
          <SoloOperativePanel
            preparation={preparation}
            route={filteredRoutes[0]}
            threatLevel={threatLevel}
            onPick={() => setSelectedRoute(filteredRoutes[0])}
          />
        )}
        <LastRunPanel
          onSendAgain={() => {
            const last = ZI.getLastRun();
            const route = (last && ZI.ROUTES.find(r => r.id === last.routeId)) || selectedRoute;
            const ids = last ? last.squadIds : squad;
            const check = ZI.canSendAgain(route, ids);
            if (!check.ok) return check.reason;
            const result = ZI.startRouteRun(route, ids, runMode, threatLevel, !!autoRepeat[route.id]);
            if (result && !result.ok) return result.reason;
            setActiveRoute(route); setScreen(isCamp && ZI.hasWorkingVehicle() ? 'solo-loading' : 'traversal');
            return null;
          }}
        />
      </div>
    </div>
  );
}

// Solo Survivor mode default panel — no squad; the lone operative runs every route.
function SoloOperativePanel({ route, preparation, threatLevel, onPick }) {
  const p = preparation || (route && ZI.getRoutePreparation(route, threatLevel));
  const prob = p ? p.combatWinChance : 0;
  const band = ZI.riskBand(prob);
  return (
    <div className="panel" style={{flex:1, overflow:'auto'}}>
      <div className="panel-title">Lone Operative</div>
      <div style={{padding:10}}>
        {p ? <>
          <div style={{fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', marginBottom:8}}>The Wanderer · Lv {p.characterLevel}</div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', marginBottom:8}}>{route.name} · On foot</div>
          <InfoRow label="Fight win chance" value={prob + '% · ' + band.label} color={band.color}/>
          <ProgressBar value={prob} color={band.color} height={5}/>
          <InfoRow label="Avoid a fight" value={p.avoidChance + '%'}/>
          <InfoRow label="Room for loot" value={p.freeKg + ' kg'}/>
          <button className="btn btn-amber" style={{width:'100%', marginTop:10}} onClick={onPick}>View Route Details →</button>

}

  const band = ZI.riskBand(successProb);
  return (
    <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
      <div className="panel-title">Squad Assignment</div>
      <div style={{padding:10, overflow:'auto', flex:1}}>
        {route ? (
          <>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8}}>
              For <span style={{color:'var(--amber)'}}>{route.name}</span> · slots {route.squadMin}–{route.squadMax}

            <div style={{display:'flex', flexDirection:'column', gap:5}}>
              {roster.map(s => {

                    }}>{s.name[0]}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--text)'}}>{s.name}</div>
                      <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)'}}>Lv{s.level} {s.cls} · HP {s.hp} · STA {s.stamina}</div>
                    </div>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:12, color: on ? 'var(--amber)' : 'var(--text3)'}}>{on ? '☑' : '☐'}</span>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:10, padding:'7px 9px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
              <div style={{display:'flex', justifyContent:'space-between', fontFamily:'var(--font-mono)', fontSize:9, marginBottom:3}}>
                <span style={{color:'var(--text3)'}}>SUCCESS PROBABILITY</span>
                <span style={{color: band.color}}>{successProb}% · {band.label}</span>
              </div>
              <ProgressBar value={successProb} color={band.color} height={5}/>
              <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:4}}>
                {`Set chance for ${(ZI.BIOMES.find(b => b.id === route.biome) || {}).name || 'this biome'} (Tier ${(ZI.BIOMES.find(b => b.id === route.biome) || {}).tier || '—'})`}
              </div>
            </div>
            <button className="btn btn-amber" style={{width:'100%', marginTop:8}} onClick={onPick}>View Route Details →</button>
          </>
        ) : (
          <div style={{textAlign:'center', padding:20, fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)'}}>No routes in this biome.</div>
        )}
      </div>
    </div>
  );
}

// Change 6 — promoted Last Run summary with quick actions.
function LastRunPanel({ onSendAgain }) {
  const [last, setLast] = useState(() => (ZI.getLastRun && ZI.getLastRun()) || null);
  const [msg, setMsg] = useState(null);
  const pending = ZI.getUnclaimedRouteRewards(last);
  // Keep Claim totals current while idle repeats complete on this screen.
  useEffect(() => {
    const refresh = () => setLast((ZI.getLastRun && ZI.getLastRun()) || null);
    refresh();
    const timer = setInterval(refresh, 1000);
    return () => clearInterval(timer);
  }, []);
  const claim = () => {
    const r = ZI.claimLastRun();
    setMsg(r.ok ? `✓ Claimed ${r.amount} salvage → Recycler` : `⚠ ${r.reason}`);
    setLast((ZI.getLastRun && ZI.getLastRun()) || null);
  };
  const sendAgain = () => {
    const reason = onSendAgain && onSendAgain();
    if (reason) setMsg(`⚠ ${reason}`);
  };
  return (
    <div className="panel" style={{flexShrink:0, borderColor: last ? 'var(--green)' : 'var(--border)'}}>
      <div className="panel-title" style={{color: last ? 'var(--green)' : undefined}}>◈ Last Run</div>
      <div style={{padding:10}}>
        {last ? (
          <>
            <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
              <span style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--text)'}}>{last.name}</span>
              {last.claimed && <span className="tag" style={{color:'var(--text3)', borderColor:'var(--border)'}}>claimed</span>}
              <span className="tag" style={{color: last.mode==='passive'?'var(--text2)':'var(--amber)', borderColor:'var(--border)'}}>{last.mode==='passive'?'Idle':'Active'}</span>
            </div>
            <div style={{display:'flex', gap:12, flexWrap:'wrap', fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', marginBottom:6}}>
              <span>⏱ {last.time}</span><span>◆ {last.loot} loot</span>
              {last.vehicleWear ? <span style={{color:'#b48cf0'}}>⛽ −{last.vehicleWear}%</span> : null}
              {last.losses ? <span style={{color:'var(--red2)'}}>☠ {last.losses}</span> : <span style={{color:'var(--green)'}}>No losses</span>}
            </div>
            {last.outcomes && <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', marginBottom:7}}>
              Fights avoided {last.outcomes.avoided} · won {last.outcomes.won} · lost {last.outcomes.lost}
              {last.outcomes.capacityLimited && <div style={{color:'var(--amber)'}}>Pack space: {last.outcomes.lootLeftBehind} loot left behind</div>}
            </div>}
            {!last.claimed && (
              <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--green)', marginBottom:7}}>
                Unclaimed: {pending.loot} loot from {pending.runs} {pending.runs === 1 ? 'run' : 'runs'}
              </div>
            )}
            {last.log && (
              <div style={{maxHeight:72, overflow:'auto', marginBottom:7, borderLeft:'2px solid var(--border)', paddingLeft:7}}>
                {last.log.map((l,i) => {
                  const meta = ZI.NODE_META[l.type] || ZI.NODE_META.combat;
                  return <div key={i} style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.5}}>
                    <span style={{color:meta.color}}>{meta.icon}</span> {l.text}
                  </div>;
                })}
              </div>
            )}
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-amber" style={{flex:1, opacity: last.claimed?0.5:1, cursor: last.claimed?'not-allowed':'pointer'}} disabled={last.claimed} onClick={claim}>{pending.runs > 1 ? 'Claim All' : 'Claim'}</button>
              <button className="btn" style={{flex:1}} onClick={sendAgain}>Send Again</button>
            </div>
            {msg && <div style={{fontFamily:'var(--font-mono)', fontSize:9, color: msg[0]==='✓'?'var(--green)':'var(--red2)', marginTop:6}}>{msg}</div>}
          </>
        ) : (
          <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)'}}>No runs completed yet. Launch a route to see your haul here.</div>
        )}
      </div>
    </div>
  );
}

// Loot intel inside a node's hover box. More detail unlocks with visits.
function PoiIntel({ route, idx, type }) {
  const visits = ZI.poiVisits(route.id, idx);
  const { tier, next, index } = ZI.poiTier(visits);
  const loot = ZI.POI_LOOT[type] || ZI.POI_LOOT.combat;
  const shift = Math.max(0, (route.rmatTier || 0) - 1); // deeper routes shift finds up a tier
  const tierTag = (t) => { const k = 'T' + Math.min(5, t + shift); return <span style={{color:ZI.tierColor(k)}}>{ZI.TIER_META[k].label}</span>; };
  const line = { fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', lineHeight:1.45, whiteSpace:'normal' };
  return (
    <div style={{marginTop:6, paddingTop:5, borderTop:'1px solid var(--border)'}}>
      <div style={{display:'flex', justifyContent:'space-between', fontFamily:'var(--font-mono)', fontSize:9, marginBottom:3}}>
        <span style={{color:tier.color}}>◉ {tier.label}</span>
        <span style={{color:'var(--text3)'}}>{visits} visit{visits === 1 ? '' : 's'}</span>
      </div>
      {type === 'start' ? (
        <div style={line}>Your departure point. Nothing to loot here.</div>
      ) : index === 0 ? (
        <div style={line}>No intel yet. Finish a run through here to scout it.</div>
      ) : (
        <>
          {index >= 1 && index < 2 && <div style={line}>Loot types hidden until Familiar.</div>}
          {index >= 2 && <div style={line}><span style={{color:'var(--text3)'}}>Loot: </span>{loot.categories.join(' · ')}</div>}
          {index >= 3 && loot.items.map((it, k) => (
            <div key={k} style={line}>▸ {it.n} {tierTag(it.t)}</div>
          ))}
          {index >= 4 && loot.rare && (
            <div style={{...line, color:'var(--amber)'}}>★ Rare: {loot.rare.n} {tierTag(loot.rare.t)} · ~{loot.rare.chance}% per visit</div>
          )}

      )}
      {next && type !== 'start' && (
        <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginTop:3}}>
          {next.min - visits} more to {next.label}{index === 1 ? ' (loot types)' : index === 2 ? ' (item list)' : index === 3 ? ' (rare finds)' : ''}
        </div>
      )}
    </div>
  );
}

// Hover box rendered at body level (fixed) so scroll containers can't clip it.
// Opens above the node, flips below when there's no room, clamped to the viewport.
function NodeTip({ anchor, color, children }) {
  const ref = React.useRef(null);
  const [pos, setPos] = useState({ left: -9999, top: -9999 });
  React.useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const bw = el.offsetWidth, bh = el.offsetHeight, pad = 8;
    let top = anchor.top - bh - 6;
    if (top < pad) top = Math.min(anchor.bottom + 6, window.innerHeight - bh - pad);
    let left = anchor.left + anchor.width / 2 - bw / 2;
    left = Math.max(pad, Math.min(left, window.innerWidth - bw - pad));
    setPos({ left, top: Math.max(pad, top) });
  }, [anchor]);
  return (
    <div ref={ref} style={{
      position:'fixed', left:pos.left, top:pos.top, zIndex:1000, pointerEvents:'none',
      background:'var(--bg2)', border:`1px solid ${color}`, padding:'6px 9px', minWidth:170, maxWidth:240,
      boxShadow:'0 4px 14px rgba(0,0,0,0.6)',
    }}>{children}</div>
  );
}

function RouteNodeChain({ nodes, compact, progress, route }) {
  const [hover, setHover] = useState(null);
  const [anchor, setAnchor] = useState(null);
  const sz = compact ? 18 : 22;
  const n = nodes.length;
  const live = typeof progress === 'number';
  const p = live ? Math.max(0, Math.min(1, progress)) : 0;
  return (
    <div style={{position:'relative', width:'100%'}}>
      {/* One continuous track from first to last node center, with a live fill */}
      <div style={{position:'absolute', left:sz/2, right:sz/2, top:sz/2 - 2, height:4, borderRadius:2, background:'var(--bg4)', border:'1px solid var(--border)', boxSizing:'border-box'}}/>
      {live && (
        <>
          <div style={{position:'absolute', left:sz/2, top:sz/2 - 2, height:4, width:`calc((100% - ${sz}px) * ${p})`, background:'linear-gradient(90deg, var(--amber), var(--green))', borderRadius:2, transition:'width 1s linear'}}/>
          <div style={{position:'absolute', top:sz/2 - 4, left:`calc(${sz/2}px + (100% - ${sz}px) * ${p} - 4px)`, width:8, height:8, borderRadius:'50%', background:'var(--text)', boxShadow:'0 0 6px var(--amber)', transition:'left 1s linear', zIndex:2}}/>
        </>
      )}
      <div style={{position:'relative', display:'flex', justifyContent:'space-between', alignItems:'flex-start', zIndex:1}}>
        {nodes.map((node, i) => {
          const type = ZI.routeNodeType(node);
          const meta = ZI.NODE_META[type] || ZI.NODE_META.combat;
          const at = n > 1 ? i / (n - 1) : 0;
          const passed = live && p >= at;
          return (
            <div key={i} style={{position:'relative', display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0}}
              onMouseEnter={(e) => { setAnchor(e.currentTarget.getBoundingClientRect()); setHover(i); }}
              onMouseLeave={() => setHover(h => h === i ? null : h)}>
              <div style={{
                width:sz, height:sz, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'help',
                background: passed ? meta.color : 'var(--bg)', border:`2px solid ${meta.color}`,
                color: passed ? 'var(--bg)' : meta.color, fontSize:compact?9:11, lineHeight:1, transition:'background 0.3s, color 0.3s',
              }}>{meta.icon}</div>
              {hover === i && anchor && ReactDOM.createPortal(
                <NodeTip anchor={anchor} color={meta.color}>
                  <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:meta.color, letterSpacing:'0.06em'}}>{meta.icon} {meta.label.toUpperCase()}</div>
                  <div style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--text)', marginTop:1}}>{node}</div>
                  {live && <div style={{fontFamily:'var(--font-mono)', fontSize:9, color: passed ? 'var(--green)' : 'var(--text2)', marginTop:1}}>{passed ? '✓ Passed' : 'Ahead'}</div>}
                  {route && <PoiIntel route={route} idx={i} type={type}/>}
                </NodeTip>, document.body
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Re-renders every second while a route run is live.
function useRouteRun(routeId) {
  const [, tick] = useState(0);
  const prog = ZI.routeRunProgress(routeId);
  useEffect(() => {
    const t = setInterval(() => tick(x => x + 1), 1000);
    return () => clearInterval(t);
  }, [routeId]);
  return prog;
}
const fmtRunLeft = (ms) => { const s = Math.ceil(ms / 1000); return s >= 60 ? `${Math.floor(s/60)}m ${s%60}s` : `${s}s`; };

function RouteCard({ route, selected, onClick, threatLevel, autoRepeat, onToggleRepeat }) {
  const liveRun = useRouteRun(route.id);
  const preparation = ZI.routeUsesSoloPreparation() ? ((liveRun && liveRun.preparation) || ZI.getRoutePreparation(route, threatLevel)) : null;
  const biome = ZI.BIOMES.find(b => b.id === route.biome);
  const rmat = ZI.RMAT_TIERS[route.rmatTier];
  // Change 4 — threat state shifts border toward danger as global threat rises.
  const threat = threatLevel || 0;
  const danger = Math.min(5, route.risk + (threat >= 7 ? 1 : 0));
  const dangerColor = ['#3dcf8e','#a3c34a','#d9b94a','#d98a4a','#cf5d3d','#f06a5a'][danger] || 'var(--border)';
  const mutationActive = threat >= 6 && route.risk >= 4;
  return (
    <div onClick={onClick} style={{
      padding:'10px 12px', cursor:'pointer', transition:'all 0.15s',
      border:`1px solid ${selected ? 'var(--amber)' : dangerColor+'66'}`,
      borderLeft:`3px solid ${dangerColor}`,
      background: selected ? 'var(--bg4)' : 'var(--bg3)',
    }}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6}}>
        <span style={{display:'flex', alignItems:'center', gap:6, fontFamily:'var(--font-body)', fontSize:14, color: selected ? 'var(--amber)' : 'var(--text)', fontWeight:500}}>
          {route.name}
          {autoRepeat && <span title="Auto-Repeat active" style={{fontSize:11, color:'var(--purple)'}}>🔁</span>}
        </span>
        <RiskBar risk={route.risk}/>
      </div>
      <div style={{display:'flex', gap:6, marginBottom:6, flexWrap:'wrap'}}>
        <Tag color="var(--text2)">⏱ {fmtTime((preparation ? preparation.durationHours : route.duration)*60)}</Tag>
        <Tag color={rmat?.color||'var(--text2)'}>{ZI.rmatLabel(route.rmatTier)}</Tag>
        <Tag color="var(--text2)">Lv {route.recLevel}+</Tag>
      </div>
      {mutationActive && (
        <div style={{
          fontFamily:'var(--font-mono)', fontSize:9, color:'#f06a5a', background:'rgba(207,61,61,0.1)',
          border:'1px solid #f06a5a55', padding:'3px 6px', marginBottom:6,
        }}>⚠ Mutation Zone Active — bonus loot, elevated risk</div>
      )}
      {/* Change 1 — subway-style node chain, live-filling while the route is running */}
      {(() => {
        const prog = liveRun;
        return (
          <div style={{margin:'2px 0 7px'}}>
            <RouteNodeChain nodes={route.nodes} compact={true} progress={prog ? prog.pct : undefined} route={route}/>
            {prog && (
              <div style={{display:'flex', justifyContent:'space-between', fontFamily:'var(--font-mono)', fontSize:9, marginTop:4}}>
                <span style={{color:'var(--amber)'}}>● Running{prog.autoRepeat ? ' · 🔁' : ''} · {Math.floor(prog.pct*100)}%</span>
                <span style={{color:'var(--text2)'}}>{fmtRunLeft(prog.remainingMs)} left</span>
              </div>
            )}
          </div>
        );
      })()}
      {/* Change 2 — expected loot + estimates */}
      <div style={{display:'flex', gap:4, flexWrap:'wrap', marginBottom:5}}>
        {route.lootRange.map((l, i) => (
          <span key={i} style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text2)', background:'var(--bg)', border:'1px solid var(--border)', padding:'1px 5px'}}>{l}</span>
        ))}
      </div>
      <div style={{display:'flex', gap:10, flexWrap:'wrap', fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)'}}>
        {preparation ? <span>Room for loot {preparation.freeKg} kg · fight win {preparation.combatWinChance}% · avoid {preparation.avoidChance}%</span> : <span>⚡ Stamina ~{route.staminaCost}</span>}
        {!preparation && route.hasVehicle && ZI.hasWorkingVehicle() && <span style={{color:'#b48cf0'}}>⛽ Vehicle wear ~{route.vehicleWear}%</span>}
        <span style={{marginLeft:'auto', display:'flex', gap:8}}>
          {onToggleRepeat && (
            <button onClick={(e)=>{e.stopPropagation(); onToggleRepeat(route.id);}} style={{
              fontFamily:'var(--font-mono)', fontSize:8, padding:'1px 6px', cursor:'pointer',
              background: autoRepeat ? 'rgba(144,96,208,0.15)' : 'var(--bg4)',
              border:`1px solid ${autoRepeat ? 'var(--purple)' : 'var(--border)'}`,
              color: autoRepeat ? 'var(--purple)' : 'var(--text3)',
            }}>🔁 {autoRepeat ? 'Auto ON' : 'Auto-Repeat'}</button>
          )}
        </span>
      </div>
    </div>
  );
}

// ─── NOISE METER (PZ noise mechanics) ────────────────────────────────────────
function NoiseMeter({ route, runMode }) {
  const vehicleNoise = ZI.VEHICLE_SYSTEMS.noiseBiome[route.biome] || ZI.VEHICLE_SYSTEMS.noiseBiome.suburbia;
  // Base noise: vehicle engine + run mode modifier
  const baseDb = runMode === 'passive' ? vehicleNoise.engineNoise : Math.round(vehicleNoise.engineNoise * 0.6);
  const hearingRange = runMode === 'passive' ? vehicleNoise.hearingRange : Math.round(vehicleNoise.hearingRange * 0.5);
  const noisePct = clamp((baseDb / 160) * 100, 0, 100);
  const noiseColor = noisePct > 75 ? 'var(--red2)' : noisePct > 45 ? 'var(--amber)' : 'var(--green)';

  return (
    <div style={{marginBottom:10}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>
        NOISE PROFILE <span style={{fontStyle:'italic', color:'var(--text3)', fontSize:7}}>· PZ hearing model</span>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:4}}>
        <div>
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
            <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
              {runMode === 'passive' ? 'Vehicle (engine on)' : 'Foot movement'}
            </span>
            <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:noiseColor}}>{baseDb} dB</span>
          </div>
          <ProgressBar value={noisePct} color={noiseColor} height={5} animated={noisePct > 75}/>
        </div>
        <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>
          Hearing range: <span style={{color:noiseColor}}>{hearingRange}m</span>
          <span style={{marginLeft:8, fontSize:8, fontStyle:'italic'}}>{vehicleNoise.note}</span>
        </div>
        {runMode === 'passive' && baseDb > 100 && (
          <div style={{padding:'4px 7px', background:'rgba(139,58,42,0.12)', border:'1px solid var(--red)', fontFamily:'var(--font-mono)', fontSize:8, color:'var(--red2)'}}>
            ⚠ PZ rule: sustained engine noise draws migration waves. Consider foot approach at POIs.
          </div>
        )}
        {/* Quick reference: key noise sources */}
        <div style={{marginTop:2}}>
          {[
            { label:'Gunshot', db: 140, icon:'🔫' },
            { label:'Running', db: 50,  icon:'🏃' },
            { label:'Crouch',  db: 15,  icon:'🦶' },
          ].map(n => (
            <div key={n.label} style={{display:'flex', alignItems:'center', gap:5, marginBottom:2}}>
              <span style={{fontSize:9}}>{n.icon}</span>
              <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', width:50}}>{n.label}</span>
              <div style={{flex:1, height:3, background:'var(--bg4)', borderRadius:1, overflow:'hidden'}}>
                <div style={{width:`${(n.db/160)*100}%`, height:'100%',
                  background: n.db > 100 ? 'var(--red2)' : n.db > 60 ? 'var(--amber)' : 'var(--green)'
                }}/>
              </div>
              <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', width:28, textAlign:'right'}}>{n.db}dB</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

}

              <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text3)', marginBottom:4}}>EXPECTED LOOT</div>

                {route.lootRange.map((l,i) => (

        {tab === 'noise' && (

            {preparation ? <>

            <div style={{marginTop:8}}>
              <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text3)', marginBottom:5}}>ZOMBIE BEHAVIOR</div>
              <div style={{display:'flex', flexDirection:'column', gap:4}}>
                {biome?.zombies.slice(0,3).map(z => {
                  const name = z.split(' ')[0];

                  return (
                    <div key={z} style={{padding:'5px 8px', background:'var(--bg3)', border:'1px solid var(--border)'}}>
                      <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
                        <span style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--red2)'}}>{z}</span>
                        {behavior && <Tag color={behavior.sprint?'var(--red2)':'var(--amber)'}>{behavior.sprint?'SPRINTS':'WALKS'}</Tag>}
                      </div>
                      {behavior && <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)', fontStyle:'italic'}}>{behavior.note}</div>}

              <div style={{marginTop:8, padding:'6px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>

                  <b style={{color:'var(--text2)'}}>Memory:</b> Zombies forget position after ~{ZI.ZOMBIE_BEHAVIOR.memory.duration_s}s<br/>
                  <b style={{color:'var(--text2)'}}>Migration:</b> Above {ZI.ZOMBIE_BEHAVIOR.hearing.migration_threshold} in area = wave begins<br/>
                  <span style={{fontStyle:'italic'}}>{ZI.ZOMBIE_BEHAVIOR.memory.note}</span>
                </div>
              </div>
            </div>

        {tab === 'loot' && (
          <ContainersPanel biomeId={route.biome}/>

        {!canRun && (
          <div style={{
            padding:'6px 10px', background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)',
            fontFamily:'var(--font-mono)', fontSize:12, color:'var(--red2)', marginTop:8,
          }}>
            ⚠ {deployReason}
          </div>
        )}
      </div>
      <div style={{padding:10, borderTop:'1px solid var(--border)'}}>
        {isCamp && !ZI.hasWorkingVehicle() && (
          <div title="Loot comes back on foot. Find a working car at a Wandering checkpoint to unlock Cargo Unloading." style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)', marginBottom:6, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', cursor:'help'}}>
            🚗 No vehicle — cargo unloading locked
          </div>
        )}
        {/* TRAV-01a T16: Deploy is disabled with its reason when it can't run */}
        <button
          onClick={canRun ? onLaunch : undefined}
          disabled={!canRun}
          data-deploy="1"
          title={canRun ? '' : deployReason}
          className="btn btn-amber"
          style={{ width:'100%', opacity: canRun ? 1 : 0.4, cursor: canRun ? 'pointer' : 'not-allowed' }}

// ─── LOOT LOADING SCREEN ─────────────────────────────────────────────────────
// PZ justification: in PZ, transferring items between containers and vehicles
// takes real time proportional to item count. Heavier/bulkier items take longer.
// Zombie Idler makes this a dedicated screen to reinforce resource weight & time cost.
function LootLoadingScreen({ route, onComplete }) {
  const [phase, setPhase] = useState('arriving');
  const [loadProgress, setLoadProgress] = useState({});
  const [lootItems] = useState([
    { id:'l1', cat:'heavy',  name:'Reinforced Steel Panels ×4',  weight:120, container:'WarehouseShelf', timeMs:9000 },
    { id:'l2', cat:'medium', name:'Canned Rations ×18',           weight:36,  container:'KitchenCabinet', timeMs:4500 },
    { id:'l3', cat:'medium', name:'Advanced Toolkit',             weight:8,   container:'CarTrunk',       timeMs:3200 },
    { id:'l4', cat:'light',  name:'RMAT-1 Mechanical Shard ×2',  weight:1,   container:'ZombiePocket',   timeMs:1800 },
    { id:'l5', cat:'light',  name:'RMAT-1 Chemical Vial',         weight:1,   container:'LabStorage',     timeMs:1500 },
    { id:'l6', cat:'data',   name:'Blueprint: Workshop III',      weight:0,   container:'LabStorage',     timeMs:800  },
  ]);
  const [completedItems, setCompletedItems] = useState(new Set());
  const [activeItem, setActiveItem] = useState(null);
  const [vehicleOffload, setVehicleOffload] = useState(0);

  // PZ vehicle condition degradation during route
  const vehicleCondition = { before: 65, after: 47 };
  const vehComponents = [
    { name:'Engine',     before: 80, after: 74, component: ZI.VEHICLE_SYSTEMS.components.Engine },
    { name:'Tires',      before: 62, after: 42, component: ZI.VEHICLE_SYSTEMS.components.Tires },
    { name:'Battery',    before: 90, after: 88, component: ZI.VEHICLE_SYSTEMS.components.Battery },
    { name:'Brake Fluid',before: 75, after: 73, component: ZI.VEHICLE_SYSTEMS.components.BrakeFluid },
  ];

  // Character state after run (PZ fatigue model)
  const runHours = route?.duration || 4;
  const fatiguePhase = ZI.FATIGUE_MODEL.phases.find(p => (10 + runHours) >= p.hoursAwake[0] && (10 + runHours) < p.hoursAwake[1])
    || ZI.FATIGUE_MODEL.phases[ZI.FATIGUE_MODEL.phases.length-1];

  useEffect(() => {
    if (phase !== 'unloading') return;
    let delay = 1000;
    lootItems.forEach((item) => {
      setTimeout(() => {
        setActiveItem(item.id);
        const start = Date.now();
        const interval = setInterval(() => {
          const elapsed = Date.now() - start;
          const pct = Math.min((elapsed / item.timeMs) * 100, 100);
          setLoadProgress(p => ({ ...p, [item.id]: pct }));
          setVehicleOffload(v => Math.min(v + 0.3, 100));
          if (pct >= 100) {
            clearInterval(interval);
            setCompletedItems(prev => new Set([...prev, item.id]));
            setActiveItem(null);
          }
        }, 80);
      }, delay);
      delay += item.timeMs + 600;
    });
    setTimeout(() => setPhase('complete'), delay + 1000);
  }, [phase]);

  useEffect(() => {
    const t = setTimeout(() => setPhase('unloading'), 2400);
    return () => clearTimeout(t);
  }, []);

  const catColors = { heavy:'var(--red2)', medium:'var(--amber)', light:'var(--purple)', data:'var(--blue)' };

  return (
    <div className="screen-enter" style={{
      display:'flex', height:'100%', background:'var(--bg)',
      position:'relative', overflow:'hidden',
    }}>
      {/* Background grid */}
      <div style={{
        position:'absolute', inset:0, opacity:0.03,
        backgroundImage:'linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px)',
        backgroundSize:'48px 48px', pointerEvents:'none',
      }}/>

      {/* Main content */}
      <div style={{
        position:'relative', zIndex:1, width:'100%',
        display:'flex', gap:0, padding:0, overflow:'hidden',
      }}>
        {/* CENTER: Loot unloading */}
        <div style={{flex:1, display:'flex', flexDirection:'column', padding:'24px 28px', overflow:'auto'}}>
          {/* Header */}
          <div style={{marginBottom:24}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)', letterSpacing:'0.3em', marginBottom:6}}>
              {phase==='arriving' ? '— VEHICLE RETURNING —' : phase==='unloading' ? '— UNLOADING CARGO —' : '— EXTRACTION COMPLETE —'}
            </div>
            <div style={{fontFamily:'var(--font-title)', fontSize:30, color:'var(--amber)', lineHeight:1}}>
              {route?.name || 'Crestwood Drive'}
            </div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)', marginTop:5, display:'flex', gap:12}}>
              <span>{route?.biome ? ZI.BIOMES.find(b=>b.id===route.biome)?.name : 'Ruined Suburbia'}</span>
              <span>·</span>
              <span>{route?.duration || 4}h Run</span>
              <span>·</span>
              <span style={{color: fatiguePhase.color}}>{fatiguePhase.level} on return</span>
            </div>
          </div>

          {/* Vehicle status bar */}
          <div style={{
            background:'var(--bg2)', border:'1px solid var(--border)',
            padding:'12px 16px', marginBottom:16,
            display:'flex', alignItems:'center', gap:16,
          }}>
            <div style={{fontSize:28, flexShrink:0}}>🚛</div>
            <div style={{flex:1}}>
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5}}>
                <span style={{fontFamily:'var(--font-body)', fontSize:13, color:'var(--text)'}}>{(ZI.getVehicle() || {}).name || 'Vehicle'} — Cargo Bay</span>
                <span style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--amber)'}}>
                  {Math.round(vehicleOffload)}% Unloaded
                </span>
              </div>
              <ProgressBar value={vehicleOffload} color="var(--amber)" animated={phase==='unloading'} height={7}/>
            </div>
            <div style={{textAlign:'right', flexShrink:0}}>
              {phase === 'arriving' && (
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)'}}>ARRIVING...</div>
              )}
              {phase === 'complete' && (
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--green)'}}>✓ UNLOADED</div>
              )}
            </div>
          </div>

          {/* Loot items */}
          <div style={{display:'flex', flexDirection:'column', gap:5, marginBottom:16}}>
            {lootItems.map(item => {
              const isDone = completedItems.has(item.id);
              const isActive = activeItem === item.id;
              const pct = loadProgress[item.id] || 0;
              const catObj = ZI.LOOT_CATEGORIES[item.cat];
              const color = catColors[item.cat];
              const container = ZI.LOOT_CONTAINERS[item.container];

              return (
                <div key={item.id} style={{
                  display:'flex', alignItems:'center', gap:12,
                  padding:'8px 14px', background:'var(--bg2)',
                  border:`1px solid ${isDone ? 'var(--border2)' : isActive ? color : 'var(--border)'}`,
                  transition:'all 0.3s', opacity: phase==='arriving' ? 0.5 : 1,
                }}>
                  <div style={{
                    width:8, height:8, borderRadius:'50%', flexShrink:0,
                    background: isDone ? 'var(--green)' : isActive ? color : 'var(--border2)',
                    boxShadow: isActive ? `0 0 8px ${color}` : 'none',
                    transition:'all 0.3s',
                  }}/>
                  <div style={{flex:1}}>
                    <div style={{display:'flex', alignItems:'center', gap:8, marginBottom: (isActive||isDone) ? 3 : 0}}>
                      <span style={{fontFamily:'var(--font-body)', fontSize:13, color: isDone?'var(--text2)':isActive?'var(--text)':'var(--text2)'}}>
                        {item.name}
                      </span>
                      <Tag color={color}>{catObj?.label}</Tag>
                      {item.weight > 0 && (
                        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{item.weight}kg</span>
                      )}
                      <span style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginLeft:'auto'}}>
                        from {item.container.replace(/([A-Z])/g,' $1').trim()}
                      </span>
                    </div>
                    {(isActive || isDone) && (
                      <ProgressBar value={pct} color={isDone?'var(--green)':color} height={3} animated={isActive}/>
                    )}
                  </div>
                  <div style={{
                    fontFamily:'var(--font-mono)', fontSize:11,
                    color: isDone?'var(--green)':isActive?color:'var(--text3)',
                    width:64, textAlign:'right', flexShrink:0,
                  }}>
                    {isDone ? '✓ STORED' : isActive ? `${Math.round(pct)}%` : phase==='arriving'?'PENDING':'QUEUED'}
                  </div>
                </div>
              );
            })}
          </div>

          {phase === 'unloading' && (
            <div style={{
              textAlign:'center', fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)',
              padding:'8px', background:'var(--bg2)', border:'1px solid var(--border)',
            }}>
              Unloading in progress — heavy cargo takes longer (PZ container transfer logic). Do not interrupt.
            </div>
          )}

          {phase === 'complete' && (
            <div style={{display:'flex', gap:10, justifyContent:'center', marginTop:8}}>
              <button className="btn btn-amber btn-lg" onClick={onComplete}>
                Return to Hideout →
              </button>
            </div>
          )}
        </div>

        {/* RIGHT SIDEBAR: Vehicle condition + character state */}
        <div style={{
          width:280, borderLeft:'1px solid var(--border)', background:'var(--bg2)',
          display:'flex', flexDirection:'column', overflow:'auto', flexShrink:0,
        }}>
          {/* Vehicle degradation (PZ mechanics) */}
          <div style={{padding:'14px 14px 10px', borderBottom:'1px solid var(--border)'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>
              VEHICLE CONDITION <span style={{fontSize:7, fontStyle:'italic'}}>· PZ degradation model</span>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:7}}>
              {vehComponents.map(vc => {
                const drop = vc.before - vc.after;
                const condColor = vc.after > 70 ? 'var(--green)' : vc.after > 40 ? 'var(--amber)' : 'var(--red2)';
                return (
                  <div key={vc.name}>
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:2}}>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text2)'}}>{vc.name}</span>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:condColor}}>
                        {vc.after}% <span style={{color:'var(--red2)', fontSize:8}}>▼{drop}</span>
                      </span>
                    </div>
                    <ProgressBar value={vc.after} color={condColor} height={4}/>
                    {vc.after < 50 && (
                      <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--red2)', marginTop:2}}>
                        ⚠ {vc.component.failureEffect} — needs {vc.component.repairSkill}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{
              marginTop:8, padding:'5px 8px', background:'var(--bg4)',
              borderLeft:'3px solid var(--amber)',
              fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.5,
            }}>
              PZ rule: Tires degrade fastest off-road. Always carry a spare. Brake failure mid-escape = death.
            </div>
          </div>

          {/* Character post-run state */}
          <div style={{padding:'12px 14px', borderBottom:'1px solid var(--border)'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>
              CHARACTER STATE <span style={{fontSize:7, fontStyle:'italic'}}>· post-run</span>
            </div>
            <FatigueTracker hoursAwake={10 + runHours}/>
            <div style={{marginTop:6}}>
              <NutritionBar label="Nutrition (depleted)" value={62} level={getNutritionLevel(62)}/>
              <div style={{height:5}}/>
              <NutritionBar label="Hydration (depleted)" value={48} level={getHydrationLevel(48)}/>
            </div>
            <div style={{
              marginTop:8, padding:'5px 8px', background:'var(--bg4)',
              borderLeft:'3px solid var(--amber)',
              fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', lineHeight:1.5,
            }}>
              PZ: a {runHours}h run burns ~{Math.round(runHours * 8)} stamina. Schedule rest + meal immediately or next run suffers cascading penalties.
            </div>
          </div>

          {/* Infection check reminder */}
          <div style={{padding:'12px 14px'}}>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:6, letterSpacing:'0.12em'}}>
              POST-RUN CHECKLIST
            </div>
            {[
              { ok: true,  label: 'No bite detected', note: 'PZ: check after every zombie contact' },
              { ok: true,  label: 'No laceration wounds', note: '25% infection chance if untreated' },
              { ok: false, label: 'Tires need repair', note: 'PZ: blowout risk on next run' },
              { ok: true,  label: 'Gear durability OK', note: 'Acid rain caused minor corrosion' },
              { ok: false, label: 'Eat & hydrate before sleep', note: 'PZ: sleeping while hungry slows healing' },
            ].map((item, i) => (
              <div key={i} style={{
                display:'flex', alignItems:'flex-start', gap:7, marginBottom:5,
              }}>
                <div style={{
                  width:14, height:14, borderRadius:2, flexShrink:0, marginTop:1,
                  background: item.ok ? 'rgba(76,175,125,0.15)' : 'rgba(139,58,42,0.15)',
                  border:`1px solid ${item.ok ? 'var(--green)' : 'var(--red2)'}`,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:8, color: item.ok ? 'var(--green)' : 'var(--red2)',
                }}>{item.ok ? '✓' : '!'}</div>
                <div>
                  <div style={{fontFamily:'var(--font-body)', fontSize:11, color: item.ok?'var(--text2)':'var(--text)'}}>{item.label}</div>
                  <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic'}}>{item.note}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SCHEDULE SCREEN ─────────────────────────────────────────────────────────
function ScheduleScreen({ mode }) {
  const [tasks, setTasks] = useState([
    { id:1, type:'rest',     label:'Rest & Recover',    duration:3,  priority:1, status:'queued', startIn:0 },
    { id:2, type:'craft',    label:'Craft: Hazard Suit T2', duration:2, priority:2, status:'queued', startIn:3 },
    { id:3, type:'faction',  label:'Iron March Contract', duration:4, priority:3, status:'queued', startIn:5 },
    { id:4, type:'scavenge', label:'Scavenge: Crestwood Drive', duration:4, priority:4, status:'queued', startIn:9 },
    { id:5, type:'train',    label:'Train: Reflex',      duration:3,  priority:5, status:'queued', startIn:13 },
    { id:6, type:'repair',   label:'Repair: Reinforced Truck', duration:2, priority:6, status:'queued', startIn:16 },
  ]);
  const [dragIdx, setDragIdx] = useState(null);

  const totalHours = tasks.reduce((s, t) => s + t.duration, 0);
  const TIMELINE_HOURS = 24;

  const moveUp = (idx) => {
    if (idx === 0) return;
    const t = [...tasks];
    [t[idx-1], t[idx]] = [t[idx], t[idx-1]];
    setTasks(t.map((task, i) => ({...task, priority: i+1})));
  };
  const moveDown = (idx) => {
    if (idx === tasks.length-1) return;
    const t = [...tasks];
    [t[idx], t[idx+1]] = [t[idx+1], t[idx]];
    setTasks(t.map((task, i) => ({...task, priority: i+1})));
  };
  const removeTask = (id) => setTasks(tasks.filter(t => t.id !== id));

  const taskColors = {
    rest:'var(--blue)', craft:'var(--amber)', faction:'var(--purple)',
    scavenge:'var(--green)', train:'var(--red2)', repair:'var(--text2)',
    assign:'var(--amber2)', trade:'var(--green2)', defend:'var(--red)',
    extract:'var(--purple)',
  };

  // Timeline bar
  let cursor = 0;
  const timelineBlocks = tasks.map(task => {
    const block = { ...task, start: cursor, widthPct: (task.duration / TIMELINE_HOURS) * 100 };
    cursor += task.duration;
    return block;
  });

  return (
    <div className="screen-enter" style={{display:'flex', gap:8, padding:8, height:'100%', overflow:'hidden'}}>
      {/* Left: Task queue */}
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:8, minWidth:0, overflow:'hidden'}}>
        {/* Timeline */}
        <div className="panel" style={{padding:'10px 12px', flexShrink:0}}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
            <div style={{fontFamily:'var(--font-title)', fontSize:14, color:'var(--amber)', letterSpacing:'0.1em'}}>24-HOUR SCHEDULE TIMELINE</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:10, color: totalHours > TIMELINE_HOURS ? 'var(--red2)' : 'var(--green)'}}>
              {totalHours}h / {TIMELINE_HOURS}h used
            </div>
          </div>
          {/* Hour markers */}
          <div style={{display:'flex', justifyContent:'space-between', marginBottom:3}}>
            {[0,4,8,12,16,20,24].map(h => (

                  <div style={{display:'flex', gap:3, flexShrink:0}}>
                    <button onClick={() => moveUp(idx)} style={{

                    }}>↑</button>
                    <button onClick={() => moveDown(idx)} style={{
                      background:'var(--bg4)', border:'1px solid var(--border)', color:'var(--text2)',
                      width:22, height:22, cursor:'pointer', fontSize:10, display:'flex', alignItems:'center', justifyContent:'center',
                    }}>↓</button>
                    <button onClick={() => removeTask(task.id)} style={{
                      background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)', color:'var(--red2)',

        </div>
      </div>

      {/* Right: Add task + summary */}
      <div style={{width:280, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>

        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>

              return (
                <div key={taskType.id}

                  </div>
                  <span style={{fontFamily:'var(--font-mono)', fontSize:10, color}}>+ Add</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Schedule summary */}
        <div className="panel" style={{padding:12, flexShrink:0}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:8, letterSpacing:'0.12em'}}>SCHEDULE SUMMARY</div>

          <button className="btn" style={{width:'100%'}}>

          </button>
          <div style={{marginTop:8, fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', lineHeight:1.5}}>
            Tasks run automatically while offline. Return in {fmtTime(totalHours*60)} to collect results.
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── RMAT CRAFTING SCREEN ─────────────────────────────────────────────────────
function CraftJobsStrip() {
  const ZI = window.ZI;
  const [, force] = React.useState(0);
  React.useEffect(() => { const t = setInterval(() => force(n => n + 1), 500); return () => clearInterval(t); }, []);
  const jobs = ZI.getJobs().jobs.filter(j => j.type === 'craft' || j.type === 'repair');
  const slots = ZI.craftSlots();
  const active = jobs.filter(j => j.status === 'active').length;
  return (
    <div style={{ padding:'6px 8px', borderBottom:'1px solid var(--border)', background:'var(--bg2)' }}>
      <div style={{ display:'flex', alignItems:'center', marginBottom: jobs.length?5:0 }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)' }}>
          Craft jobs {active}/{slots}{ZI.structureLevel('workshop')<5 ? ' · upgrade Workshop for more' : ''}
        </span>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
        {jobs.slice(0,4).map(j => {
          const nm = j.type === 'repair' ? (ZI.getGearItem(j.refId)||{}).name : ((ZI.CRAFT_RECIPES||[]).find(r=>r.id===j.refId)||{}).name;
          const pct = ZI.jobProgress(j) * 100;
          const rem = ZI.jobRemaining(j);
          return (
            <div key={j.id} style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color: j.status==='active'?'var(--amber)':'var(--text3)', width:96, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{j.type==='repair'?'🔧 ':''}{nm||j.refId}</span>
              <div style={{ flex:1, height:5, background:'var(--bg4)', borderRadius:2 }}>
                <div style={{ height:'100%', width:`${pct}%`, background: j.status==='active'?'var(--amber)':'var(--text3)', borderRadius:2 }}/>
              </div>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', width:42, textAlign:'right' }}>{j.status==='queued'?'queued':rem>=60?`${Math.round(rem/60)}m`:`${rem}s`}</span>
              <button onClick={() => { ZI.cancelJob(j.id); force(n=>n+1); }} title="Cancel" style={{ fontFamily:'var(--font-mono)', fontSize:8, cursor:'pointer', background:'none', border:'1px solid var(--border)', color:'var(--text3)', padding:'0 4px' }}>✕</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    : <span style={{fontSize:size}}>{recipe.icon}</span>;
  const sel = recipes.find(r => r.id === selId) || null;
  const tomeGate = (r) => ZI.tomeSchematicGate ? ZI.tomeSchematicGate(r.id) : null;
  const canCraft = (r) => {
    const gate = tomeGate(r);
    return (!gate || gate.unlocked) && Object.entries(r.cost).every(([k, q]) => (stock[k] || 0) >= q);
  };

  const fmtDur = (sec) => {
    if (sec < 3600) return `${Math.round(sec / 60)}m`;
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return `${h}h${m ? ` ${m}m` : ''}`;
  };
  // Recipe times are in-game seconds, on the shared game clock: 1 game hour = ZI.REAL_MS_PER_GAME_HOUR (60 real s).
  const craftRealSec = (r) => (r.time || 6) * window.ZI.REAL_MS_PER_GAME_HOUR / 3600000;
  const fmtReal = (sec) => sec < 60 ? `${Math.max(1, Math.round(sec))}s` : `${Math.floor(sec / 60)}m${Math.round(sec % 60) ? ` ${Math.round(sec % 60)}s` : ''}`;

  const doCraft = (r) => {
    if (!canCraft(r)) return;
    setStock(prev => {
      const next = { ...prev };
      Object.entries(r.cost).forEach(([k, q]) => { next[k] = Math.max(0, (next[k] || 0) - q); if (M[k]) M[k].current = next[k]; });

          <div className="panel" style={{ width:'100%', maxWidth:420, padding:16, borderColor:'#ff3b3b', background:'var(--bg2)', boxShadow:'0 8px 28px rgba(0,0,0,0.7)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'#ff3b3b', letterSpacing:'0.12em' }}>TUTORIAL · CRAFTING · {craftTutStep + 1}/{CRAFT_TUT.length}</span>
              <button onClick={endCraftTut} style={{ background:'none', border:'none', color:'var(--text2)', cursor:'pointer', fontFamily:'var(--font-mono)', fontSize:11 }}>Skip ✕</button>
            </div>
            <div style={{ fontFamily:'var(--font-title)', fontSize:18, color:'var(--text)', marginBottom:6 }}>{tut.title}</div>
            <div style={{ fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', lineHeight:1.5 }}>{tut.body}</div>
            {craftTutStep === 0 && (
              <div style={{ marginTop:8, fontFamily:'var(--font-mono)', fontSize:11, color: anyMats ? 'var(--green)' : 'var(--red2)' }}>
                {anyMats ? 'You already have some materials — check which recipes you can afford.' : 'Stockpile: empty'}
              </div>
            )}
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:12 }}>
              <button className="btn" disabled={craftTutStep === 0} onClick={() => setCraftTutStep(s => s - 1)} style={{ opacity: craftTutStep === 0 ? 0.4 : 1 }}>Back</button>
              {craftTutStep < CRAFT_TUT.length - 1
                ? <button className="btn btn-amber" onClick={() => setCraftTutStep(s => s + 1)}>Next</button>
                : <button className="btn btn-amber" onClick={endCraftTut}>Got it</button>}
            </div>
          </div>
        </div>
      )}
      {!craftTut && (
        <window.TutStepMenu label="Crafting" side="right" inset={12} zIndex={30} steps={CRAFT_TUT.map(t => t.title)} onPick={n => { setCraftTutStep(n); setCraftTut(true); }}/>
      )}
      {/* ── LEFT: Material Stockpile + RMAT Tiers ── */}
      <div style={{width:200, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        <div className="panel" style={{display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">Material Stockpile</div>
          <div style={{padding:8, display:'flex', flexDirection:'column', gap:6}}>
            {Object.entries(M).map(([key, m]) => {
              const cur = stock[key] ?? m.current;
              return (
                <div key={key} style={{padding:'7px 9px', background:'var(--bg3)', border:'1px solid var(--border)'}}>
                  <div style={{display:'flex', alignItems:'center', gap:7, marginBottom:4}}>
                    <span style={{fontSize:13}}>{m.icon}</span>
                    <span style={{fontFamily:'var(--font-body)', fontSize:11, color:'var(--text)', flex:1}}>{m.name}</span>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:11, color:m.color}}>{cur}/{m.max}</span>
                  </div>
                  <ProgressBar value={(cur / m.max) * 100} color={m.color} height={4}/>
                </div>
              );
            })}
          </div>
        </div>
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">RMAT Tiers</div>
          <div style={{padding:8, overflow:'auto', display:'flex', flexDirection:'column', gap:5}}>
            {ZI.RMAT_TIERS.map(tier => (
              <div key={tier.tier} style={{padding:'6px 8px', background:'var(--bg3)', borderLeft:`3px solid ${tier.color}`, border:`1px solid ${tier.color}33`}}>
                <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:3}}>
                  <div style={{width:7, height:7, borderRadius:'50%', background:tier.color, flexShrink:0}}/>
                  <span style={{fontFamily:'var(--font-body)', fontSize:11, color:tier.color, flex:1}}>T{tier.tier}: {tier.name}</span>
                  <span className="tag" style={{color:tier.color, borderColor:tier.color, background:tier.color+'22', fontSize:8}}>{tier.rarity}</span>
                </div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)'}}>{tier.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── CENTER: Recipe Browser ── */}
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:8, minWidth:0, overflow:'hidden'}}>
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title" style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
            <span>Crafting Recipes</span>
            <div style={{display:'flex', gap:4}}>
              {[['all','ALL'],['rmat','RMAT'],['gear','GEAR'],['consumable','CONSUM']].map(([k,label]) => (
                <button key={k} onClick={() => setKindFilter(k)} style={{
                  fontFamily:'var(--font-mono)', fontSize:9, padding:'2px 8px', cursor:'pointer',
                  border:`1px solid ${kindFilter===k ? 'var(--amber)' : 'var(--border)'}`,
                  background: kindFilter===k ? 'rgba(200,169,110,0.15)' : 'var(--bg4)',
                  color: kindFilter===k ? 'var(--amber)' : 'var(--text3)',
                }}>{label}</button>
              ))}
            </div>
            <div style={{display:'flex', gap:4}}>
              {[['all','ALL'],['equip','⚔'],['enhance','▲'],['consume','✚'],['trade','⧉'],['faction','⚑']].map(([k,label]) => (
                <button key={k} onClick={() => setPurposeFilter(k)} title={k==='all'?'All purposes':(ZI.PURPOSE_META[k]&&ZI.PURPOSE_META[k].label)}
                  style={{
                    fontFamily:'var(--font-mono)', fontSize:9, padding:'2px 7px', cursor:'pointer',
                    border:`1px solid ${purposeFilter===k ? (k==='all'?'var(--amber)':ZI.PURPOSE_META[k].color) : 'var(--border)'}`,
                    background: purposeFilter===k ? (k==='all'?'rgba(200,169,110,0.15)':ZI.PURPOSE_META[k].color+'22') : 'var(--bg4)',
                    color: purposeFilter===k ? (k==='all'?'var(--amber)':ZI.PURPOSE_META[k].color) : 'var(--text3)',
                  }}>{label}</button>
              ))}
            </div>
            <div style={{display:'flex', gap:4, marginLeft:'auto'}}>
              {[null,0,1,2,3,4,5].map(t => (
                <button key={t===null?'all':t} onClick={() => setTierFilter(t)} style={{
                  fontFamily:'var(--font-mono)', fontSize:9, padding:'2px 8px', cursor:'pointer',
                  border:`1px solid ${tierFilter===t ? (t===null?'var(--amber)':tierColor(t)) : 'var(--border)'}`,
                  background: tierFilter===t ? (t===null?'rgba(200,169,110,0.15)':tierColor(t)+'22') : 'var(--bg4)',
                  color: tierFilter===t ? (t===null?'var(--amber)':tierColor(t)) : 'var(--text3)',
                }}>{t === null ? 'ALL' : `T${t}`}</button>
              ))}
            </div>
          </div>
          <CraftJobsStrip/>
          <div style={{flex:1, overflow:'auto', padding:8, display:'flex', flexDirection:'column', gap:6}}>
            {filtered.map(r => {
              const ok = canCraft(r);
              const tc = tierColor(r.tier);
              return (
                <div key={r.id} onClick={() => setSelId(selId === r.id ? null : r.id)} style={{
                  padding:'10px 12px', cursor:'pointer', transition:'all 0.15s',
                  border:`1px solid ${selId===r.id ? 'var(--amber)' : 'var(--border)'}`,
                  borderLeft:`3px solid ${tc}`,
                  background: selId===r.id ? 'var(--bg4)' : 'var(--bg3)',
                }}>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6}}>
                    <div style={{display:'flex', alignItems:'center', gap:8}}>
                      {recipeIcon(r, 32)}
                      <span style={{fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', fontWeight:500}}>{r.name}</span>
                      <span className="tag" style={{color:tc, borderColor:tc, background:tc+'22'}}>T{r.tier}</span>
                      {(r.kind==='gear' || r.kind==='consumable') &&
                        <span className="tag" style={{color:'#7aa8f0', borderColor:'#7aa8f0', background:'rgba(74,128,224,0.12)'}}>⚙ EQUIPS</span>}
                      {(() => {
                        const gi = r.grantsGear && ZI.getGearItem && ZI.getGearItem(r.grantsGear);
                        const purposes = gi && gi.purpose || [];
                        return purposes.map(p => {
                          const pm = ZI.PURPOSE_META[p]; if (!pm) return null;
                          return <span key={p} className="tag" title={pm.label} style={{color:pm.color, borderColor:pm.color, background:pm.color+'22'}}>{pm.icon} {pm.label}</span>;
                        });
                      })()}
                    </div>
                    {tomeGate(r) && !tomeGate(r).unlocked
                      ? <span className="tag" style={{color:'#c59af2', borderColor:'#c59af2', background:'rgba(160,100,220,0.12)'}}>🔒 Schematic Locked</span>
                      : ok
                      ? <span className="tag" style={{color:'#3dcf8e', borderColor:'#3dcf8e', background:'rgba(61,207,142,0.12)'}}>✓ Craftable</span>
                      : <span className="tag" style={{color:'#f06a5a', borderColor:'#f06a5a', background:'rgba(207,61,61,0.12)'}}>✗ Missing</span>}
                  </div>
                  <div style={{display:'flex', gap:5, flexWrap:'wrap', marginBottom:6}}>
                    {Object.entries(r.cost).map(([k, q]) => {
                      const have = (stock[k] || 0) >= q;
                      return (
                        <span key={k} style={{
                          fontFamily:'var(--font-mono)', fontSize:9, padding:'2px 7px',
                          border:`1px solid ${have ? 'var(--border)' : '#f06a5a'}`,
                          color: have ? 'var(--text2)' : '#f06a5a',
                          background:'var(--bg)', display:'flex', alignItems:'center', gap:3,
                        }}>{M[k]?.icon} {q} {M[k]?.name || k}</span>
                      );
                    })}
                  </div>
                  <div style={{display:'flex', gap:12, alignItems:'center', flexWrap:'wrap'}}>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:10, color:tc}}>→ {r.out.map(o => `${o.q}× ${o.n}`).join(', ')}</span>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--amber)'}}>⏱ {fmtDur(r.time)}</span>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginLeft:'auto'}}>Unlock: {r.unlock}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* ── RIGHT: Recipe Detail + Drop Rates ── */}
      <div style={{width:300, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        {sel ? (() => {
          const tc = tierColor(sel.tier);
          const ok = canCraft(sel);
          const gate = tomeGate(sel);
          const rates = (ZI.CRAFT_DROP_RATES && ZI.CRAFT_DROP_RATES[sel.enemy]) || [0,0,0,0,0,0];
          return (
            <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
              <div className="panel-title">Recipe Details</div>
              <div style={{flex:1, overflow:'auto', padding:10}}>
                <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
                  {recipeIcon(sel, 96)}
                  <div>
                    <div style={{fontFamily:'var(--font-title)', fontSize:16, color:tc}}>{sel.name}</div>
                    <div style={{display:'flex', gap:5, marginTop:3}}>
                      <span className="tag" style={{color:tc, borderColor:tc, background:tc+'22'}}>T{sel.tier} {(ZI.RMAT_TIERS[sel.tier]||{}).name}</span>
                      <span className="tag" style={{color:'var(--text2)', borderColor:'var(--border)'}}>{(ZI.RMAT_TIERS[sel.tier]||{}).rarity}</span>
                    </div>
                  </div>
                </div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', fontStyle:'italic', borderLeft:`2px solid ${tc}`, paddingLeft:8, marginBottom:10, lineHeight:1.5}}>{sel.lore}</div>
                {sel.grantsGear && window.ZI_CRAFTING_FRAMES.getRecords().some(r => r.id === sel.grantsGear) && <a className="btn btn-sm" style={{marginBottom:10}} href={window.ZI_CRAFTING_FRAMES.href(sel.grantsGear)}>Proposed frame preview</a>}
                <div style={{display:'flex', flexDirection:'column', gap:5, marginBottom:10}}>
                  <InfoRow label="Output" value={sel.out.map(o => `${o.q}× ${o.n}`).join(', ')} color={tc}/>
                  <InfoRow label="Craft Time" value={`${fmtDur(sel.time)} game · ${fmtReal(craftRealSec(sel))} real`} color="var(--amber)"/>
                  <InfoRow label="Drop Source" value={sel.enemy} color="var(--red2)"/>
                  <InfoRow label="Unlocked By" value={sel.unlock} color="var(--text2)"/>
                  {gate && <InfoRow label="Tome Schematic" value={`${gate.series} · ${gate.currentCopies}/${gate.copies} copies${gate.missing?.length ? ` · Needs ${gate.missing.join(', ')}` : ''}`} color={gate.unlocked ? '#3dcf8e' : '#c59af2'}/>}
                </div>
                <div className="divider"/>
                <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', margin:'8px 0'}}>REQUIRED MATERIALS</div>
                <div style={{display:'flex', flexDirection:'column', gap:5, marginBottom:12}}>
                  {Object.entries(sel.cost).map(([k, q]) => {
                    const have = stock[k] || 0;
                    const col = have >= q ? '#3dcf8e' : have > 0 ? '#e07a30' : '#f06a5a';
                    return (
                      <div key={k} style={{display:'flex', alignItems:'center', gap:8}}>
                        <span style={{fontSize:12}}>{M[k]?.icon}</span>
                        <span style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', flex:1}}>{M[k]?.name || k}</span>
                        <span style={{fontFamily:'var(--font-mono)', fontSize:11, color:col}}>{have}/{q}</span>
                      </div>
                    );
                  })}
                </div>
                <div className="divider"/>
                <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', margin:'8px 0'}}>RMAT DROP RATES — {sel.enemy}</div>
                <div style={{display:'flex', flexDirection:'column', gap:3}}>
                  {ZI.RMAT_TIERS.map((tier, i) => (
                    <div key={tier.tier} style={{display:'flex', alignItems:'center', gap:6}}>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:tier.color, width:64}}>T{tier.tier} {tier.name.split(' ')[0]}</span>
                      <div style={{flex:1}}><ProgressBar value={rates[i] || 0} max={60} color={tier.color} height={5}/></div>
                      <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:tier.color, width:30, textAlign:'right'}}>{rates[i] || 0}%</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{padding:10, borderTop:'1px solid var(--border)'}}>
                <button onClick={() => onCraftClick(sel)} disabled={!ok} style={{
                  width:'100%', padding:'10px', cursor: ok ? 'pointer' : 'not-allowed',
                  fontFamily:'var(--font-body)', fontSize:13, letterSpacing:'0.06em',
                  background: ok ? '#1a3020' : 'var(--bg4)', color: ok ? '#3dcf8e' : 'var(--text3)',
                  border:`1px solid ${ok ? '#3dcf8e' : 'var(--border)'}`,
                }}>
                  {gate && !gate.unlocked ? '🔒 Schematic Locked' : ok ? (sel.tier === 5 ? '⚠ Begin Exotic Craft' : '⚙ Craft Now') : '✗ Materials Insufficient'}
                </button>
              </div>
            </div>
          );
        })() : (
          <div className="panel" style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'var(--font-title)', fontSize:14, color:'var(--text3)', marginBottom:8}}>Select a Recipe</div>
              <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text3)'}}>Choose a recipe to see materials, drop rates, and craft.</div>
            </div>
          </div>
        )}
      </div>

      {/* Toast */}
      {toast && (
        <div style={{
          position:'absolute', top:14, right:14, zIndex:50,
          fontFamily:'var(--font-mono)', fontSize:12, color:'#3dcf8e',
          background:'#10231a', border:'1px solid #3dcf8e', padding:'9px 14px',
          boxShadow:'0 4px 20px rgba(0,0,0,0.5)', animation:'fadeIn 0.2s ease',
        }}>{toast}</div>
      )}

      {/* T5 confirmation modal */}
      {t5Confirm && (
        <div onClick={() => setT5Confirm(null)} style={{
          position:'absolute', inset:0, zIndex:60, background:'rgba(0,0,0,0.7)',
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div onClick={e => e.stopPropagation()} className="panel" style={{width:380, padding:18, borderColor:tierColor(5)}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
              <span style={{fontSize:28}}>{t5Confirm.icon}</span>
              <div style={{fontFamily:'var(--font-title)', fontSize:16, color:tierColor(5)}}>Begin {t5Confirm.name}?</div>
            </div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)', lineHeight:1.6, marginBottom:14}}>
              This Exotic craft takes <span style={{color:'var(--amber)'}}>{fmtDur(t5Confirm.time)}</span> and cannot be queued. It must be confirmed manually.
            </div>
            <div style={{display:'flex', gap:8}}>
              <button onClick={() => { const r = t5Confirm; setT5Confirm(null); doCraft(r); }} style={{
                flex:1, padding:'9px', cursor:'pointer', fontFamily:'var(--font-body)', fontSize:12,
                background:'#1a3020', color:'#3dcf8e', border:'1px solid #3dcf8e',
              }}>Confirm</button>
              <button onClick={() => setT5Confirm(null)} style={{
                flex:1, padding:'9px', cursor:'pointer', fontFamily:'var(--font-body)', fontSize:12,
                background:'var(--bg4)', color:'var(--text2)', border:'1px solid var(--border)',
              }}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* T5 completion full-screen event */}
      {t5Event && (
        <div onClick={() => setT5Event(null)} style={{
          position:'absolute', inset:0, zIndex:70, cursor:'pointer',
          background:`radial-gradient(circle at center, ${tierColor(5)}33, rgba(0,0,0,0.92))`,
          display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.3s ease',
        }}>
          <div style={{textAlign:'center', maxWidth:460, padding:24}}>
            <div style={{fontSize:72, marginBottom:12}}>{t5Event.icon}</div>
            <div style={{fontFamily:'var(--font-title)', fontSize:26, color:tierColor(5), marginBottom:6, textShadow:`0 0 30px ${tierColor(5)}`}}>{t5Event.name}</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:tierColor(5), letterSpacing:'0.2em', marginBottom:16}}>◈ EXOTIC ECHO CRAFTED ◈</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:12, color:'var(--text2)', fontStyle:'italic', lineHeight:1.7, marginBottom:18}}>{t5Event.lore}</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:tierColor(5)}}>{t5Event.out.map(o => `${o.q}× ${o.n}`).join('  ·  ')}</div>
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginTop:20}}>click to dismiss</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── FACTIONS SCREEN ─────────────────────────────────────────────────────────
function FactionsScreen() {
  // Locked until the first Fort is resolved (quest turned in, or the guard killed).
  const unlocked = ZI.factionsUnlocked ? ZI.factionsUnlocked() : 'friendly';
  if (!unlocked) {
    const f = ZI.getFortPos && ZI.getFortPos(), q = ZI.getFallowQuest ? ZI.getFallowQuest() : { state:'none' };
    return (
      <div className="screen-enter" style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
        <div className="panel" style={{ maxWidth:460, padding:20, textAlign:'center' }}>
          <div style={{ fontSize:34, marginBottom:6 }}>🔒</div>
          <div style={{ fontFamily:'var(--font-title)', fontSize:20, color:'var(--text)', marginBottom:8 }}>No one knows your name yet</div>
          <div style={{ fontFamily:'var(--font-body)', fontSize:15, color:'var(--text2)', lineHeight:1.55 }}>
            {q.state === 'none' && <>Smoke rises from a palisade at <b style={{ color:'#f0d060' }}>🏰 {f ? f.coord : 'the Fort'}</b> on the Traversal map. The people behind those pikes are the way in.</>}
            {q.state === 'active' && <>The Hearthguard want <b style={{ color:'#a2dca2' }}>Fallow Ground</b> cleared: {ZI.fallowProgress()}/{ZI.fallowGoal()} kills at {q.cell.coord}.</>}
            {q.state === 'ready' && <>The field is clear. Return to the Fort at <b style={{ color:'#f0d060' }}>{f && f.coord}</b> to turn in Fallow Ground.</>}
          </div>
        </div>
      </div>
    );
  }
  // Live standings from the single reputation store (negative tiers included).
  const LIVE = ZI.liveFactions();
  const [selectedFaction, setSelectedFaction] = useState('ironmarch');

  const faction = LIVE.find(f => f.id === selectedFaction);
  const repRankIdx = ZI.REP_RANKS.indexOf(faction.rank);
  const repToNext = repRankIdx < ZI.REP_RANKS.length - 1 ? ZI.REP_THRESHOLDS[repRankIdx+1] - faction.rep : 0;
  const repPct = repRankIdx < ZI.REP_RANKS.length - 1
    ? ((faction.rep - ZI.REP_THRESHOLDS[repRankIdx]) / (ZI.REP_THRESHOLDS[repRankIdx+1] - ZI.REP_THRESHOLDS[repRankIdx])) * 100
    : 100;

  const contracts = ZI.CONTRACTS.filter(c => c.faction === selectedFaction);
  const [, forceRerender] = useState(0);
  const availableContracts = contracts.filter(c => ZI.contractState(c.id) === 'OFFERED');
  const activeContractEntries = contracts.filter(c => ZI.contractState(c.id) === 'ACTIVE');
  const completedContracts = contracts.filter(c => ZI.contractState(c.id) === 'COMPLETE');

  return (
    <div className="screen-enter" style={{display:'flex', gap:8, padding:8, height:'100%', overflow:'hidden'}}>
      {/* Left: Faction list */}
      <div style={{width:240, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">Factions</div>
          <div style={{flex:1, overflow:'auto', padding:8, display:'flex', flexDirection:'column', gap:5}}>
            {LIVE.map(f => {
              const rIdx = ZI.REP_RANKS.indexOf(f.rank);
              const fRepPct = rIdx < ZI.REP_RANKS.length - 1
                ? ((f.rep - ZI.REP_THRESHOLDS[rIdx]) / (ZI.REP_THRESHOLDS[rIdx+1] - ZI.REP_THRESHOLDS[rIdx])) * 100
                : 100;
              return (
                <div key={f.id} onClick={() => setSelectedFaction(f.id)} style={{
                  padding:'8px 10px', cursor:'pointer', transition:'all 0.15s',
                  border:`1px solid ${selectedFaction===f.id ? f.color : 'var(--border)'}`,
                  background: selectedFaction===f.id ? 'var(--bg4)' : 'var(--bg3)',
                }}>
                  <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
                    <div style={{width:7, height:7, borderRadius:'50%', background:f.color, flexShrink:0}}/>
                    <span style={{fontFamily:'var(--font-body)', fontSize:13, color: selectedFaction===f.id ? f.color : 'var(--text)', fontWeight:500, flex:1}}>{f.name}</span>
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', flex:1}}>{f.standing}{f.id === 'lodge' ? ' · +60% prices' : ''}</span>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:f.color}}>{f.rep} REP</span>
                  </div>
