<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* High-contrast palette — all text tokens ≥4.5:1 on --bg3 */
    --bg:        #0f0e0c;
    --bg2:       #1a1814;
    --bg3:       #221e17;
    --bg4:       #2c261d;
    --border:    #4a4034;
    --border2:   #635645;
    --text:      #f0e8d6;
    --text2:     #cbbd9f;
    --text3:     #a39478;
    --amber:     #e6c47e;
    --amber2:    #f5dca6;
    --red:       #e0624c;
    --red2:      #f08a52;
    --rust2:     #e0624c;
    --green:     #62d69a;
    --green2:    #a2dca2;
    --blue:      #74b6ee;
    --purple:    #c894ff;
    --yellow:    #f6de74;
    --metal:     #a3b3c2;
    --font-title: 'Special Elite', serif;
    --font-body:  'Oswald', sans-serif;
    --font-mono:  'Share Tech Mono', monospace;
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

  #root { width: 100%; height: 100%; }

  /* Texture overlays */
  .paper-texture::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: 
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Utility */
  .font-title { font-family: var(--font-title); }
  .font-mono  { font-family: var(--font-mono); }
  .text-amber { color: var(--amber); }
  .text-red   { color: var(--red2); }
  .text-green { color: var(--green); }
  .text-dim   { color: var(--text2); }
  .text-dimmer{ color: var(--text3); }

  /* Panels */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .panel::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(200,169,110,0.03) 0%, transparent 50%);
  }
  .panel-title {
    font-family: var(--font-title);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }

  /* Buttons */
  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    padding: 8px 16px;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); background: var(--bg4); }
  .btn-amber { border-color: var(--amber); color: var(--amber); }
  .btn-amber:hover { background: rgba(200,169,110,0.12); }
  .btn-red { border-color: var(--red); color: var(--red2); }
  .btn-red:hover { background: rgba(139,58,42,0.15); }
  .btn-green { border-color: var(--green); color: var(--green); }
  .btn-green:hover { background: rgba(76,175,125,0.12); }
  .btn-sm { font-size: 11px; padding: 5px 10px; }
  .btn-lg { font-size: 15px; padding: 12px 28px; letter-spacing: 0.12em; }

  /* Tags */
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }

  /* Progress bars */
  .progress-bar {
    height: 6px;
    background: var(--bg4);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.3s ease;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px; height: 100%;
    background: rgba(255,255,255,0.4);
  }

  /* Dividers */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 8px 0;
  }

  /* Tooltip */
  .tooltip-wrap { position: relative; }
  .tooltip-wrap:hover .tooltip-box { opacity: 1; pointer-events: auto; }
  .tooltip-box {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg4); border: 1px solid var(--border2);
    padding: 8px 12px; min-width: 160px; max-width: 220px;
    font-size: 11px; line-height: 1.5; color: var(--text2);
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 9999; white-space: normal;
  }

  /* Animated ticker */
  @keyframes tick-up { from { opacity: 0; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
  .tick-float { animation: tick-up 1.5s ease-out forwards; pointer-events: none; }

  /* Threat pulse */
  @keyframes threat-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .threat-active { animation: threat-pulse 2s ease-in-out infinite; }

  /* Screen transitions */
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen-enter { animation: screen-in 0.25s ease-out; }

  /* Scanline effect on hover for mode cards */
  @keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  .scanline-hover:hover .scanline-inner {
    animation: scanline 1.5s linear infinite;
  }
  .scanline-inner {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, transparent 40%, rgba(200,169,110,0.04) 50%, transparent 60%);
  }

  /* Loading bar animation */
  @keyframes loading-fill { from { width: 0%; } to { width: 100%; } }

  /* Notification badge */
  .notif-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red2);
    box-shadow: 0 0 6px var(--red2);
    flex-shrink: 0;
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 9px 16px;
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    position: relative;
    top: 1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }

  /* World event banner */
  @keyframes scroll-event { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .event-scroll { animation: scroll-event 18s linear infinite; white-space: nowrap; display: inline-block; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes travPin { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.25); opacity:0.7; } }
  .trav-here-pin { animation: travPin 1.4s ease-in-out infinite; }
  .wander-hud button { white-space: nowrap; flex-shrink: 0; }
  .wander-menu > button { width: 100%; text-align: left; }
  @keyframes tutSpot { 0%,100% { border-color:#ff3b3b; } 50% { border-color:#ffb3b3; } }
  .tut-spot { animation: tutSpot 1.1s ease-in-out infinite; }
  @keyframes tutArrow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .tut-arrow { animation: tutArrow 0.9s ease-in-out infinite; }
  @keyframes ziProj { from { left: 0%; opacity: 1; } 90% { opacity: 1; } to { left: 100%; opacity: 0; } }
  .zi-proj { animation: ziProj 0.24s linear forwards; }
  @keyframes ziDmg { 0% { transform: translate(-50%, 0) scale(1.35); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-50%, -34px) scale(1); opacity: 0; } }
  .zi-dmg { position:absolute; left:50%; font-family: var(--font-title); font-size: 20px; font-weight: bold; color: #ff3b3b; text-shadow: 0 0 2px #000, 0 2px 0 #000, 0 0 8px rgba(255,59,59,0.6); pointer-events: none; white-space: nowrap; animation: ziDmg 0.9s ease-out forwards; z-index: 20; }
  @keyframes ziFlame { 0% { transform: scaleX(0.2); transform-origin: left; opacity: 0.6; } 50% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.95); opacity: 0; } }
  .zi-flame { animation: ziFlame 0.45s ease-out forwards; transform-origin: left center; }
  @keyframes ziDrawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const ZI = window.ZI;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : Math.floor(n); }
function fmtTime(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}
function clamp(v,min,max) { return Math.max(min, Math.min(max, v)); }

function getNutritionLevel(val) {
  return ZI.NUTRITION.levels.find(l => val >= l.min && val < l.max) || ZI.NUTRITION.levels[ZI.NUTRITION.levels.length-1];
}
function getHydrationLevel(val) {
  return ZI.NUTRITION.hydration.find(l => val >= l.min && val < l.max) || ZI.NUTRITION.hydration[ZI.NUTRITION.hydration.length-1];
}

function ProgressBar({ value, max=100, color='var(--amber)', height=6, animated=false }) {
  const pct = clamp((value/max)*100, 0, 100);
  return (
    <div className="progress-bar" style={{height}}>
      <div className="progress-fill" style={{
        width: `${pct}%`, background: color,
        boxShadow: animated ? `0 0 8px ${color}` : 'none',
      }}/>
    </div>
  );
}

function Tag({ children, color='var(--amber2)', bg='transparent' }) {
  return <span className="tag" style={{color, borderColor: color, background: bg}}>{children}</span>;
}

function RiskBar({ risk }) {
  const colors = ['','var(--green)','var(--green2)','var(--amber)','var(--red2)','var(--red)'];
  return (
    <div style={{display:'flex', gap:3}}>
      {[1,2,3,4,5].map(i => (
        <div key={i} style={{
          width:8, height:14, borderRadius:1,
          background: i <= risk ? colors[risk] : 'var(--bg4)',
          opacity: i <= risk ? 1 : 0.4,
        }}/>
      ))}
    </div>
  );
}

// ─── TOP BAR ─────────────────────────────────────────────────────────────────
function TopBar({ mode, screen, setScreen, threatLevel, worldEvent }) {
  const resources = useTopBarResources(); // Nutrition · Food · Ammo · Fuel · RMAT, read from the game (ZI.getTopBarResources)
  const [time, setTime] = useState(new Date());
  const [saveMsg, setSaveMsg] = useState(null);
  const activeSlot = ZI.getActiveSlot();
  const doSave = () => {
    const r = ZI.saveToActiveSlot();
    setSaveMsg(r.ok ? `✓ Saved to Slot ${r.slot}` : `⚠ ${r.reason}`);
    setTimeout(() => setSaveMsg(null), 2200);
  };
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const gameNow = ZI.getCalendar(); // shared calendar; `time` ticking each second re-renders this
  const gameDay = gameNow.day, gameYear = gameNow.year;
  const gameClock = String(gameNow.hh).padStart(2,'0') + ':' + String(gameNow.mm).padStart(2,'0');
  const isCamp = mode === 'camp';
  const tabs = isCamp ? [
    ['camp-main','Overview'], ['camp-schedule','Schedule'], ['traversal','Traversal'], ['marketplace','Shop'], ['rmat-crafting','Crafting'],
    ['stockpile','Stockpile'], ['factions','Factions'], ['stat-leveling','Stats'], ['hack-slash','Wandering'], ['codex','Codex'],
  ] : [
    ['solo-main','Routes'], ['traversal','Traversal'], ['solo-schedule','Schedule'], ['marketplace','Shop'], ['rmat-crafting','Crafting'],
    ['stockpile','Stockpile'], ['factions','Factions'], ['stat-leveling','Stats'], ['hack-slash','Wandering'], ['codex','Codex'],
  ];

  // Phones (< 760 px): a compact bar with a ☰ button that opens a side menu listing every screen.
  // The full bar's tabs, resources and badges don't fit, and an off-screen tab used to slide the whole app sideways.
  const [narrow, setNarrow] = useState(() => (window.innerWidth || 1024) < 760);
  const [drawer, setDrawer] = useState(false);
  useEffect(() => {
    const f = () => { const n = (window.innerWidth || 1024) < 760; setNarrow(n); if (!n) setDrawer(false); };
    window.addEventListener('resize', f); return () => window.removeEventListener('resize', f);
  }, []);
  useEffect(() => {
    if (!drawer) return;
    const k = (e) => { if (e.key === 'Escape') setDrawer(false); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [drawer]);

  if (narrow) {
    const cur = tabs.find(t => t[0] === screen);
    const go = (s) => { setScreen(s); setDrawer(false); };
    return (
      <div data-topbar="compact" style={{ height:44, background:'var(--bg3)', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', flexShrink:0, zIndex:100, position:'relative' }}>
        <button aria-label="Open menu" aria-expanded={drawer} data-nav-toggle="1" onClick={() => setDrawer(true)} style={{
          width:44, height:'100%', flexShrink:0, background:'none', border:'none', borderRight:'1px solid var(--border)', color:'var(--amber)', fontSize:20, lineHeight:1, cursor:'pointer',
        }}>☰</button>
        <div style={{ padding:'0 8px', display:'flex', alignItems:'center', gap:6, height:'100%', borderRight:'1px solid var(--border)', position:'relative', flexShrink:0 }}>
          <button onClick={doSave} aria-label={activeSlot ? `Save to Slot ${activeSlot.slot}` : 'Save'} title={activeSlot ? `Save progress to Slot ${activeSlot.slot}` : 'No save file selected'} style={{
            fontFamily:'var(--font-mono)', fontSize:12, padding:'3px 8px', cursor:'pointer', whiteSpace:'nowrap',
            background:'rgba(76,175,125,0.12)', border:'1px solid var(--green)', color:'var(--green)',
          }}>💾</button>
          <SettingsButton/>
          {saveMsg && <span style={{ position:'absolute', top:46, left:0, zIndex:200, whiteSpace:'nowrap', fontFamily:'var(--font-mono)', fontSize:11, color: saveMsg[0]==='✓' ? 'var(--green)' : 'var(--red2)', background:'var(--bg2)', border:'1px solid var(--border)', padding:'5px 9px' }}>{saveMsg}</span>}
        </div>
        <button onClick={() => setDrawer(true)} aria-label="Current screen, open menu" style={{ flex:1, minWidth:0, height:'100%', padding:'0 10px', display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'flex-start', background:'none', border:'none', cursor:'pointer', textAlign:'left' }}>
          <span style={{ maxWidth:'100%', fontFamily:'var(--font-body)', fontSize:13, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--amber)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{cur ? cur[1] : 'Zombie Idler'}</span>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', whiteSpace:'nowrap' }}>YEAR {gameYear} · DAY {gameDay} · {gameClock}</span>
        </button>
        {worldEvent && <EventChip worldEvent={worldEvent}/>}
        {drawer && (
          <>
            <div data-nav-backdrop="1" onClick={() => setDrawer(false)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.55)', zIndex:290 }}/>
            <nav data-nav-drawer="1" aria-label="Screens" style={{
              position:'fixed', top:0, left:0, bottom:0, width:'min(280px, 82vw)', zIndex:300, display:'flex', flexDirection:'column',
              background:'var(--bg2)', borderRight:'1px solid var(--amber)', boxShadow:'8px 0 24px rgba(0,0,0,0.6)', animation:'ziDrawerIn 0.18s ease-out',
            }}>
              <div style={{ height:44, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 6px 0 14px', borderBottom:'1px solid var(--border)', flexShrink:0 }}>
                <div onClick={() => { setDrawer(false); ZI.clearResume(); setScreen('mode-select'); }} title="Main menu" style={{ cursor:'pointer', fontFamily:'var(--font-title)', fontSize:16, color:'var(--amber)', letterSpacing:'0.05em', lineHeight:1 }}>
                  ZOMBIE<br/><span style={{ fontSize:10, letterSpacing:'0.3em', color:'var(--text2)' }}>IDLER</span>
                </div>
                <button aria-label="Close menu" onClick={() => setDrawer(false)} style={{ width:36, height:36, background:'none', border:'none', color:'var(--text2)', fontSize:18, cursor:'pointer' }}>✕</button>
              </div>
              <div style={{ padding:'8px 14px', display:'flex', alignItems:'center', gap:6, borderBottom:'1px solid var(--border)', flexShrink:0 }}>
                <div style={{ width:7, height:7, borderRadius:'50%', background: isCamp ? 'var(--green)' : 'var(--amber)', boxShadow:`0 0 6px ${isCamp ? 'var(--green)' : 'var(--amber)'}` }}/>
                <span style={{ fontFamily:'var(--font-body)', fontSize:11, letterSpacing:'0.12em', color:'var(--text2)', textTransform:'uppercase' }}>{isCamp ? 'Camp Leader' : 'Solo Survivor'}</span>
              </div>
              <div style={{ flex:1, overflowY:'auto', padding:'6px 0' }}>
                {tabs.map(([s, label]) => {
                  const on = screen === s;
                  return (
                    <button key={s} data-nav-item={s} onClick={() => go(s)} aria-current={on ? 'page' : undefined} style={{

// Top-bar tabs: as many as fit are shown; the rest (never the active one) go in "▾ More".
function NavTabs({ tabs, screen, setScreen }) {
  const boxRef = useRef(null), measureRef = useRef(null);
  const [fit, setFit] = useState(tabs.length);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const calc = () => {
      const box = boxRef.current, m = measureRef.current; if (!box || !m) return;
      // Room left = bar width minus every other fixed item (event banner excluded; it can shrink to an icon).
      const bar = box.parentElement;
      const others = [...bar.children].filter(c => c !== box && !c.hasAttribute('data-shrinkable')).reduce((a, c) => a + c.offsetWidth, 0);
      const avail = bar.clientWidth - others - 44; // keep ~44px for the ⚠ event icon
      const ws = [...m.children].map(c => c.offsetWidth), MORE = 80;
      let used = 0, n = 0;
      for (let k = 0; k < ws.length; k++) { if (used + ws[k] + (k < ws.length - 1 ? MORE : 0) > avail) break; used += ws[k]; n++; }
      setFit(Math.max(1, n));
    };
    calc();
    const ro = new ResizeObserver(calc); if (boxRef.current && boxRef.current.parentElement) ro.observe(boxRef.current.parentElement);
    return () => ro.disconnect();
  }, [tabs.length]);
  let shown = tabs.slice(0, fit), hidden = tabs.slice(fit);
  const activeHidden = hidden.find(t => t[0] === screen);
  if (activeHidden && shown.length) { hidden = [shown[shown.length - 1], ...hidden.filter(t => t !== activeHidden)]; shown = [...shown.slice(0, -1), activeHidden]; }
  const tabStyle = (on) => ({
    fontFamily:'var(--font-body)', fontSize:12, letterSpacing:'0.1em', textTransform:'uppercase', whiteSpace:'nowrap', flexShrink:0,
    color: on ? 'var(--amber)' : 'var(--text2)', padding:'0 13px', background:'none', border:'none', cursor:'pointer', height:'100%',
    borderBottom: on ? '2px solid var(--amber)' : '2px solid transparent', transition:'all 0.15s', position:'relative', top:1,
  });
  return (
    <div ref={boxRef} style={{ display:'flex', height:'100%', borderRight:'1px solid var(--border)', flexShrink:0, position:'relative' }}>
      <div ref={measureRef} aria-hidden="true" style={{ position:'absolute', visibility:'hidden', pointerEvents:'none', display:'flex', height:0, overflow:'hidden' }}>
        {tabs.map(([s, label]) => <button key={s} style={tabStyle(false)}>{label}</button>)}
      </div>
      {shown.map(([s, label]) => <button key={s} onClick={() => setScreen(s)} style={tabStyle(screen === s)}>{label}</button>)}
      {hidden.length > 0 && (
        <div style={{ position:'relative', display:'flex', alignItems:'center' }}>
          <button onClick={() => setOpen(o => !o)} style={{ ...tabStyle(false), color: open ? 'var(--amber)' : 'var(--text)' }}>▾ More</button>
          {open && (
            <>
              <div onClick={() => setOpen(false)} style={{ position:'fixed', inset:0, zIndex:190 }}/>
              <div className="panel" style={{ position:'absolute', top:'100%', right:0, zIndex:200, minWidth:170, padding:4, background:'var(--bg2)', borderColor:'var(--amber)', boxShadow:'0 8px 24px rgba(0,0,0,0.6)', display:'flex', flexDirection:'column' }}>
                {hidden.map(([s, label]) => (
                  <button key={s} onClick={() => { setScreen(s); setOpen(false); }} style={{ fontFamily:'var(--font-body)', fontSize:13, letterSpacing:'0.08em', textTransform:'uppercase', textAlign:'left', padding:'8px 10px', background:'none', border:'none', color:'var(--text)', cursor:'pointer' }}>{label}</button>
                ))}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// Shows as many resource chips as fit; the rest collapse into a "▾ +N" dropdown
// so chips never squash into each other when the bar is narrow.
function ResourceBar({ resources }) {
  const entries = Object.entries(resources);
  const boxRef = useRef(null);
  const measureRef = useRef(null);
  const [fit, setFit] = useState(entries.length);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const calc = () => {
      const box = boxRef.current, m = measureRef.current; if (!box || !m) return;
      const avail = box.clientWidth - 8;
      const widths = [...m.children].map(c => c.offsetWidth);
      const MORE = 64;
      let used = 0, n = 0;
      for (let i = 0; i < widths.length; i++) {
        const needMore = i < widths.length - 1 ? MORE : 0;
        if (used + widths[i] + needMore > avail) break;
        used += widths[i]; n++;
      }
      setFit(n);
    };
    calc();
    const ro = new ResizeObserver(calc); if (boxRef.current) ro.observe(boxRef.current);
    return () => ro.disconnect();
  }, [entries.length]);
  const shown = entries.slice(0, fit), hidden = entries.slice(fit);
  return (
    <div ref={boxRef} style={{ display:'flex', alignItems:'center', flex:'1 1 150px', minWidth:84, height:'100%', borderRight:'1px solid var(--border)', padding:'0 4px', position:'relative' }}>
      {/* invisible measuring row */}
      <div ref={measureRef} aria-hidden="true" style={{ position:'absolute', visibility:'hidden', pointerEvents:'none', display:'flex', height:0, overflow:'hidden' }}>
        {entries.map(([k, v]) => <ResourceChip key={k} label={k} value={v}/>)}
      </div>
      {shown.map(([k, v]) => <ResourceChip key={k} label={k} value={v}/>)}
      {hidden.length > 0 && (
        <div style={{ position:'relative', height:'100%', display:'flex', alignItems:'center' }}>
          <button onClick={() => setOpen(o => !o)} title="More resources" style={{
            fontFamily:'var(--font-mono)', fontSize:11, padding:'3px 8px', margin:'0 6px', cursor:'pointer', whiteSpace:'nowrap',
            background: open ? 'var(--bg4)' : 'transparent', border:`1px solid ${open ? 'var(--amber)' : 'var(--border)'}`, color:'var(--text)',
          }}>▾ +{hidden.length}</button>
          {open && (
            <>
              <div onClick={() => setOpen(false)} style={{ position:'fixed', inset:0, zIndex:190 }}/>
              <div className="panel" style={{ position:'absolute', top:'100%', left:0, zIndex:200, minWidth:180, background:'var(--bg2)', borderColor:'var(--amber)', boxShadow:'0 8px 24px rgba(0,0,0,0.6)', padding:'4px 0' }}>
                {hidden.map(([k, v]) => (
                  <div key={k} style={{ height:34, display:'flex' }}><ResourceChip label={k} value={v} block/></div>
                ))}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// Top bar resources come from the game code (ZI.getTopBarResources in game/economy.js), re-read every second and
// whenever the stash or loadout changes, so crafting, loot and spending show up without a reload.
function useTopBarResources() {
  const read = () => (ZI.getTopBarResources ? ZI.getTopBarResources() : {});
  const [res, setRes] = useState(read);
  useEffect(() => {
    const refresh = () => setRes(read());
    const t = setInterval(refresh, 1000);
    const off = ZI.onInventoryChange ? ZI.onInventoryChange(refresh) : null;
    return () => { clearInterval(t); if (off) off(); };
  }, []);
  return res;
}

// ─── SPLASH BACKDROP (rotating art behind the Save Files page) ────────────────
function SplashBackdrop() {
  const S = ZI.SPLASH, SET = ZI.SPLASH_SET;
  const boxRef = useRef(null);
  const wrapRefs = useRef({});
  const [filled, setFilled] = useState([]);           // filled image-slot ids
  const [mild, setMild] = useState(ZI.getReducedGore());
  const [cur, setCur] = useState(-1);                 // index into SET currently shown
  const [edit, setEdit] = useState(null);             // { idx, variant:'std'|'mild' } when arranging art
  const bag = useRef([]); const last = useRef(-1);
  const slotId = (e, v) => 'splash-' + e.id.toLowerCase() + (v === 'mild' ? '-mild' : '');
  // Poll which slots hold art (image-slot sets data-filled once an image is present).
  useEffect(() => {
    const read = () => { const b = boxRef.current; if (!b) return; setFilled([...b.querySelectorAll('image-slot[data-filled]')].map(n => n.id)); };
    read(); const t = setInterval(read, 1500); return () => clearInterval(t);
  }, []);
  const variantFor = (e) => (mild && filled.includes(slotId(e, 'mild'))) ? 'mild' : 'std';
  const playable = SET.map((e, i) => i).filter(i => filled.includes(slotId(SET[i], 'std')) || (mild && filled.includes(slotId(SET[i], 'mild'))));
  const playKey = playable.join(',');
  // Shuffle bag: every image once before repeats, never back-to-back across refills.
  const nextIdx = () => {
    const pool = playable; if (!pool.length) return -1;
    bag.current = bag.current.filter(i => pool.includes(i));
    if (!bag.current.length) {
      const b = pool.slice();
      for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
      if (b.length > 1 && b[0] === last.current) [b[0], b[b.length - 1]] = [b[b.length - 1], b[0]];
      bag.current = b;
    }
    const n = bag.current.shift(); last.current = n; return n;
  };
  // Rotation timer (random 25–30 s), paused while the tab is hidden or art is being arranged.
  useEffect(() => {
    if (edit) return;
    if (!playable.length) { setCur(-1); return; }
    if (cur < 0 || !playable.includes(cur)) { setCur(nextIdx()); return; }
    if (playable.length < 2) return;
    let remain = (S.MIN_S + Math.random() * (S.MAX_S - S.MIN_S)) * 1000, t0 = Date.now(), t = null;
    const arm = () => { t0 = Date.now(); t = setTimeout(() => setCur(nextIdx()), remain); };
    const vis = () => { if (document.hidden) { clearTimeout(t); remain -= Date.now() - t0; } else arm(); };
    arm(); document.addEventListener('visibilitychange', vis);
    return () => { clearTimeout(t); document.removeEventListener('visibilitychange', vis); };
  }, [cur, playKey, edit]);
  // Ken Burns: slow zoom + drift across the display interval (+ fade) on activation.
  useEffect(() => {
    if (cur < 0) return;
    const el = wrapRefs.current[cur + variantFor(SET[cur])]; if (!el) return;
    const r = () => ((Math.random() * 2 - 1) * S.PAN * 100).toFixed(2);
    const dur = S.MAX_S + S.FADE_S;
    el.style.transition = 'none';
    el.style.transform = `translate(${r()}%, ${r()}%) scale(1)`;
    void el.offsetWidth;
    el.style.transition = `transform ${dur}s linear`;
    el.style.transform = `translate(${r()}%, ${r()}%) scale(${S.SCALE_END})`;
  }, [cur, mild]);
  const toggleMild = () => { const v = !mild; setMild(v); ZI.setReducedGore(v); };
  const count = SET.filter(e => filled.includes(slotId(e, 'std'))).length;
  const E = edit ? SET[edit.idx] : null;
  return (
    <>
      <div ref={boxRef} style={{ position:'absolute', inset:0, overflow:'hidden', zIndex: edit ? 60 : 0, background:'radial-gradient(ellipse at 30% 20%, #1c1a15 0%, #0b0a08 70%)' }}>
        {SET.map((e, i) => ['std', 'mild'].map(v => {
          const shown = edit ? (edit.idx === i && edit.variant === v) : (cur === i && variantFor(e) === v);
          return (
            <div key={e.id + v} ref={n => { if (n) wrapRefs.current[i + v] = n; }}
              style={{ position:'absolute', inset: edit ? 0 : '-5%', opacity: shown ? 1 : 0, transition:`opacity ${S.FADE_S}s ease-in-out`, pointerEvents: edit && shown ? 'auto' : 'none', visibility: (edit && !shown) ? 'hidden' : 'visible' }}>
              <image-slot id={slotId(e, v)} shape="rect" fit="cover" placeholder={`${e.id} · ${e.title}${v === 'mild' ? ' (mild)' : ''} — drop artwork here`} style={{ width:'100%', height:'100%', display:'block' }}></image-slot>
            </div>
          );
        }))}
        {!edit && <div style={{ position:'absolute', inset:0, pointerEvents:'none', background:`rgba(0,0,0,${S.DIM})` }}/>}
        {!edit && <div style={{ position:'absolute', inset:0, pointerEvents:'none', background:'radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%)' }}/>}
      </div>
      {edit ? (
        <div style={{ position:'absolute', left:0, right:0, top:0, zIndex:61, padding:'10px 14px', background:'rgba(8,8,6,0.88)', borderBottom:'1px solid var(--amber)', display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <button className="btn" onClick={() => setEdit({ idx:(edit.idx + SET.length - 1) % SET.length, variant:edit.variant })}>◀</button>

            <div style={{ fontFamily:'var(--font-body)', fontSize:13, color:'var(--text2)' }}>{E.brief}</div>
          </div>

            <div style={{ display:'flex', gap:4 }}>
              {['std', 'mild'].map(v => (
                <button key={v} className={edit.variant === v ? 'btn btn-amber' : 'btn'} onClick={() => setEdit({ idx:edit.idx, variant:v })}>{v === 'std' ? 'Standard' : 'Mild'}</button>
              ))}
            </div>
          )}
          <button className="btn" onClick={() => setEdit({ idx:(edit.idx + 1) % SET.length, variant:edit.variant })}>▶</button>
          <button className="btn btn-amber" onClick={() => setEdit(null)}>Done</button>
        </div>
      ) : (
        <div style={{ position:'absolute', right:14, bottom:14, zIndex:5, display:'flex', gap:6, flexWrap:'wrap', justifyContent:'flex-end' }}>
          <button className="btn" onClick={toggleMild} title="Use the mild version of gore scenes when one has been added">{mild ? '☑' : '☐'} Reduced gore</button>
          <button className="btn" onClick={() => setEdit({ idx: cur >= 0 ? cur : 0, variant:'std' })}>🖼 Splash art {count}/{SET.length}</button>
        </div>
      )}
    </>
  );
}

// ─── SAVE FILES SCREEN (shown after choosing a game mode) ─────────────────────
function SaveFilesScreen({ mode, onBack }) {
  const [, force] = useState(0);
  const [confirm, setConfirm] = useState(null); // { slot, action }
  const [notice, setNotice] = useState(null);   // { ok, text } — export/import result
  const [creating, setCreating] = useState(null); // Oct 29: slot number while the Character Creation steps are open
  const fileInput = React.useRef(null);
  const importTarget = React.useRef(null);
  const isCamp = mode === 'camp';
  const accent = isCamp ? 'var(--green)' : 'var(--amber)';
  const slots = ZI.listSlots(mode);
  const fmt = (ts) => ts ? new Date(ts).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  const act = (slot, action) => {
    // Oct 29: New Game opens Character Creation; the save is created only after "Start Surviving".
    if (action === 'new' || action === 'overwrite') { setConfirm(null); if (window.CharacterCreationScreen && ZI.CHAR_CREATION) setCreating(slot); else ZI.startNewInSlot(mode, slot); }
    else if (action === 'load') { if (!ZI.loadSlot(mode, slot)) setNotice({ ok:false, text:`File ${slot} is damaged and has no good backup copy, so it cannot be loaded. Your other files are safe. You can Import an exported copy into it, or Delete it.` }); }
    else if (action === 'delete') { ZI.deleteSlot(mode, slot); setConfirm(null); force(n => n + 1); }
    else if (action === 'export') {
      const r = ZI.exportSlot(mode, slot);
      if (!r.ok) { setNotice({ ok:false, text:r.reason }); return; }
      const url = URL.createObjectURL(new Blob([r.text], { type:'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = r.fileName; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setNotice({ ok:true, text:`File ${slot} exported as ${r.fileName}. Open the game on the other site and use Import there.` });
    }
    else if (action === 'import') { setConfirm(null); importTarget.current = slot; if (fileInput.current) { fileInput.current.value = ''; fileInput.current.click(); } }
  };
  const onImportFile = (e) => {
    const f = e.target.files && e.target.files[0], slot = importTarget.current;
    if (!f || !slot) return;
    const rd = new FileReader();
    rd.onerror = () => setNotice({ ok:false, text:'The file could not be read.' });
    rd.onload = () => {
      const r = ZI.importSlot(String(rd.result || ''), mode, slot);
      if (!r.ok) { setNotice({ ok:false, text:r.reason }); return; }
      if (r.intoActive) { ZI._boot(mode, slot); return; } // the live file was replaced: reload into it
      setNotice({ ok:true, text:`Imported into File ${slot}. Press Continue to play it.` }); force(n => n + 1);
    };
    rd.readAsText(f);
  };
  if (creating) return (
    <div style={{ position:'relative', height:'100%', overflow:'hidden', background:'var(--bg)' }}>
      <CharacterCreationScreen mode={mode} slot={creating} onCancel={() => setCreating(null)} onConfirm={(profile) => ZI.startNewInSlot(mode, creating, profile)}/>
    </div>
  );
  return (
    <div style={{ position:'relative', height:'100%', overflow:'hidden' }}>
    <SplashBackdrop/>
    <div className="screen-enter" style={{ position:'relative', zIndex:1, height:'100%', overflow:'auto', display:'flex', alignItems:'flex-start', justifyContent:'center', padding:'40px 20px 70px', pointerEvents:'none' }}>
      <div style={{ width:'100%', maxWidth:760, pointerEvents:'auto' }}>
        <button onClick={onBack} className="btn" style={{ marginBottom:18 }}>← Change game mode</button>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:accent, letterSpacing:'0.2em', marginBottom:6 }}>{isCamp ? 'CAMP LEADER' : 'SOLO SURVIVOR'}</div>
        <div style={{ fontFamily:'var(--font-title)', fontSize:30, color:'var(--text)', marginBottom:6 }}>Save Files</div>
        <div style={{ fontFamily:'var(--font-body)', fontSize:14, color:'var(--text2)', marginBottom:22 }}>
          Start a new file or continue where you left off. Use 💾 Save in the top bar to keep your progress.
        </div>
        <input ref={fileInput} type="file" accept=".json,application/json" style={{ display:'none' }} onChange={onImportFile}/>
        {notice && (
          <div role="status" style={{ marginBottom:12, padding:'8px 12px', border:`1px solid ${notice.ok ? accent : 'var(--red2)'}`, fontFamily:'var(--font-mono)', fontSize:12, color: notice.ok ? 'var(--text)' : 'var(--red2)', display:'flex', gap:10, alignItems:'center' }}>
            <span style={{ flex:1 }}>{notice.text}</span>
            <button className="btn" onClick={() => setNotice(null)}>OK</button>
          </div>
        )}
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {slots.map(sl => (
            <div key={sl.slot} className="panel" style={{ padding:16, display:'flex', alignItems:'center', gap:16, flexWrap:'wrap', borderColor: sl.empty ? 'var(--border)' : accent }}>
              <div style={{ width:54, height:54, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', border:`2px solid ${sl.empty ? 'var(--border)' : accent}`, fontFamily:'var(--font-title)', fontSize:22, color: sl.empty ? 'var(--text3)' : accent }}>{sl.slot}</div>
              <div style={{ flex:'1 1 220px', minWidth:0 }}>
                {sl.empty ? (
                  <>
                    <div style={{ fontFamily:'var(--font-body)', fontSize:16, color:'var(--text2)' }}>Empty slot</div>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text3)', marginTop:3 }}>No saved progress</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontFamily:'var(--font-body)', fontSize:16, color:'var(--text)' }}>{sl.label}</div>
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--text2)', marginTop:3, display:'flex', gap:14, flexWrap:'wrap' }}>
                      <span>Saved {fmt(sl.savedAt)}</span>
                      {sl.summary && <span>Leader Lv {sl.summary.level}</span>}
                      {sl.summary && <span>{sl.summary.distance.toLocaleString()} m travelled</span>}
                    </div>
                  </>
                )}
              </div>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                {confirm && confirm.slot === sl.slot ? (
                  <>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--red2)', alignSelf:'center' }}>
                      {confirm.action === 'delete' ? 'Delete this file?' : confirm.action === 'import' ? 'Replace this file with an imported save?' : 'Overwrite with a new game?'}
                    </span>
                    <button className="btn" style={{ borderColor:'var(--red2)', color:'var(--red2)' }} onClick={() => act(sl.slot, confirm.action)}>Yes</button>
                    <button className="btn" onClick={() => setConfirm(null)}>Cancel</button>
                  </>
                ) : sl.empty ? (
                  <>
                    <button className="btn btn-amber" onClick={() => act(sl.slot, 'new')}>+ New Game</button>
                    <button className="btn" title="Load a save file exported from another browser or site" onClick={() => act(sl.slot, 'import')}>Import</button>
                  </>
                ) : (
                  <>
                    <button className="btn btn-amber" onClick={() => act(sl.slot, 'load')}>▶ Continue</button>
                    <button className="btn" onClick={() => setConfirm({ slot:sl.slot, action:'overwrite' })}>New Game</button>
                    <button className="btn" title="Download this file to move it to another browser or site" onClick={() => act(sl.slot, 'export')}>Export</button>
                    <button className="btn" title="Replace this file with a save file exported elsewhere" onClick={() => setConfirm({ slot:sl.slot, action:'import' })}>Import</button>
                    <button className="btn" style={{ color:'var(--red2)' }} onClick={() => setConfirm({ slot:sl.slot, action:'delete' })}>Delete</button>
                  </>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
    </div>
  );
}

            <div style={{marginLeft:'auto', flexShrink:0}}>
              <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginBottom:3}}>
                DAY 47 COMPOSITION <span style={{fontStyle:'italic'}}>· PZ migration model</span>
              </div>
              <div style={{display:'flex', gap:4}}>
                {[
                  { label:'Shambler', pct:40, color:'var(--text2)' },
                  { label:'Runner',   pct:30, color:'var(--amber)' },
                  { label:'Spitter',  pct:18, color:'var(--green)' },
                  { label:'Brute',    pct:10, color:'var(--red2)' },
                  { label:'Mutant',   pct:2,  color:'var(--purple)' },
                ].map(z => (
                  <div key={z.label} className="tooltip-wrap" style={{display:'flex', flexDirection:'column', alignItems:'center', gap:2}}>
                    <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:z.color}}>{z.pct}%</div>
                    <div style={{width:28, height:20, background:'var(--bg4)', borderRadius:1, overflow:'hidden', display:'flex', alignItems:'flex-end'}}>
                      <div style={{width:'100%', background:z.color, height:`${z.pct*2}%`, transition:'height 0.5s'}}/>
                    </div>
                    <div style={{fontFamily:'var(--font-mono)', fontSize:7, color:'var(--text3)'}}>{z.label.slice(0,4)}</div>
                    <div className="tooltip-box">{z.label}<br/>PZ: {z.label==='Shambler'?'Slow, predictable — use noise traps':z.label==='Runner'?'Sprint on sight — use obstacles':z.label==='Spitter'?'Ranged acid — force repositioning':z.label==='Brute'?'Wall breaker — target first':z.label==='Mutant'?'Apex variant — full camp alert':''}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* Top-down camp overview */}
        <CampInfrastructurePanel/>
      </div>

      {/* Right: Selected survivor detail OR resource summary */}
      <div style={{width:260, display:'flex', flexDirection:'column', gap:8, flexShrink:0}}>
        {selectedSurvivor ? (
          <SurvivorDetail survivor={selectedSurvivor} onClose={() => setSelectedSurvivor(null)}/>
        ) : (
          <ResourceSummaryPanel resources={resources}/>
        )}
        <LeaderSiegePanel threatLevel={threatLevel}/>
        <CampEventsPanel threatLevel={threatLevel}/>
      </div>
    </div>
  );
}

function StatChip({ label, value, color }) {

function CampInfrastructurePanel() {
  const ZI = window.ZI;
  const M = window.ZI_MATERIALS;
  const [sel, setSel] = React.useState(null);
  const [, force] = React.useState(0);
  const rerender = () => force(n => n + 1);
  const leaderLvl = ZI.getCampLeaderLevel();
  const structures = ZI.CAMP_STRUCTURES || [];
  const tc = (t) => ZI.tierColor(t);

  const stateColor = { built:'var(--green)', ready:'var(--amber)', locked:'var(--text3)' };
  const selStruct = sel && ZI.getStructure(sel);
  const doBuild = (id) => { const r = ZI.buildStructure(id); rerender(); if (!r.ok) window.__campMsg = r.reason; };

  const CostBundle = ({ cost }) => {
    if (!cost) return <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)' }}>Max level reached.</span>;
    const hold = ZI.getRmatHoldings(); const comp = ZI.getComponents();
    return (
      <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
        {Object.entries(cost.materials || {}).map(([k, q]) => {
          const have = (M[k] && M[k].current) || 0;
          return <span key={k} style={{ fontFamily:'var(--font-mono)', fontSize:9, padding:'1px 5px', border:`1px solid ${have>=q?'var(--border)':'#f06a5a'}`, color:have>=q?'var(--text2)':'#f06a5a' }}>{M[k]?.icon} {q} {M[k]?.name||k}</span>;
        })}
        {Object.entries(cost.rmat || {}).map(([k, q]) => {
          const have = hold[k] || 0;
          return <span key={k} style={{ fontFamily:'var(--font-mono)', fontSize:9, padding:'1px 5px', border:`1px solid ${have>=q?tc(k):'#f06a5a'}`, color:have>=q?tc(k):'#f06a5a' }}>RMAT {k} ×{q}</span>;
        })}
        {Object.entries(cost.components || {}).map(([k, q]) => {
          const have = comp[k] || 0;
          return <span key={k} style={{ fontFamily:'var(--font-mono)', fontSize:9, padding:'1px 5px', border:`1px solid ${have>=q?'var(--purple)':'#f06a5a'}`, color:have>=q?'var(--purple)':'#f06a5a' }}>{k.replace('_',' ')} ×{q}</span>;
        })}
        {cost.time && <span style={{ fontFamily:'var(--font-mono)', fontSize:9, padding:'1px 5px', color:'var(--amber)' }}>⏱ {cost.time>=3600?`${Math.round(cost.time/3600)}h`:`${Math.round(cost.time/60)}m`}</span>}
      </div>
    );
  };

  return (
    <div className="panel" style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', position:'relative' }}>
      {/* Top-down schematic (full width) */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <div className="panel-title" style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
          <span>Camp Overview</span>
          <span style={{ marginLeft:'auto', fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)' }}>CL Lv {leaderLvl} · Def {ZI.campDefenseRating()}</span>
        </div>
        <div style={{ flex:1, overflow:'auto', padding:10, background:'repeating-linear-gradient(0deg,transparent,transparent 23px,rgba(255,255,255,0.03) 23px,rgba(255,255,255,0.03) 24px),repeating-linear-gradient(90deg,transparent,transparent 23px,rgba(255,255,255,0.03) 23px,rgba(255,255,255,0.03) 24px)', border:'1px dashed var(--border)', margin:8 }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(88px, 1fr))', gap:7, alignContent:'start' }}>
            {structures.map(st => {
              const state = ZI.structureState(st.id);
              const lvl = ZI.structureLevel(st.id);
              const buildJob = ZI.getJobs().jobs.find(j => j.type === 'build' && j.refId === st.id);
              const col = stateColor[state];
              const isSel = sel === st.id;
              return (
                <div key={st.id} onClick={() => setSel(isSel ? null : st.id)}
                  title={st.desc}
                  style={{
                    minHeight: 56,
                    background: state==='locked' ? 'var(--bg2)' : 'var(--bg3)',
                    border:`1px solid ${isSel ? 'var(--amber)' : col}`, borderTop:`3px solid ${col}`,
                    padding:'6px 8px', cursor:'pointer', opacity: state==='locked' ? 0.8 : 1,
                    display:'flex', flexDirection:'column', gap:3,
                  }}>
                  <div style={{ fontFamily:'var(--font-body)', fontSize:12, color: state==='locked'?'var(--text3)':'var(--text)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{st.name}</div>
                  {buildJob ? (
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--amber)' }}>
                      ⏳ {buildJob.status==='queued'?'queued':`${ZI.jobRemaining(buildJob)>=60?Math.round(ZI.jobRemaining(buildJob)/60)+'m':ZI.jobRemaining(buildJob)+'s'}`}
                    </div>
                  ) : state === 'locked' ? (
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)' }}>🔒 Lv {st.requires.campLeaderLevel}</div>
                  ) : state === 'ready' ? (
                    <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--amber)' }}>Build</div>
                  ) : (
                    <div style={{ display:'flex', gap:2 }}>
                      {Array.from({length: st.maxLevel}).map((_, i) => (
                        <span key={i} style={{ width:5, height:5, borderRadius:'50%', background: i < lvl ? col : 'var(--bg4)', border:`1px solid ${col}` }}/>
                      ))}
                    </div>
                  )}
                  {st.job && state !== 'locked' && <div style={{ fontFamily:'var(--font-mono)', fontSize:7, color:'var(--purple)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>⚑ {st.job}</div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
      {/* Info / build panel — overlay popover (fits narrow columns) */}
      {selStruct && (() => {
        const state = ZI.structureState(sel); const lvl = ZI.structureLevel(sel);
        const cost = ZI.structureNextCost(sel); const afford = ZI.canAffordStructure(sel);
        return (
          <div onClick={() => setSel(null)} style={{ position:'absolute', inset:0, zIndex:30, background:'rgba(0,0,0,0.55)', display:'flex', alignItems:'center', justifyContent:'center', padding:12 }}>
            <div onClick={e => e.stopPropagation()} style={{ width:'min(280px,96%)', maxHeight:'92%', overflow:'auto', background:'var(--bg2)', border:'1px solid var(--amber)', boxShadow:'0 8px 28px rgba(0,0,0,0.6)', padding:12 }}>
              <div style={{ display:'flex', alignItems:'center', marginBottom:3 }}>
                <span style={{ fontFamily:'var(--font-title)', fontSize:15, color:'var(--amber)' }}>{selStruct.name}</span>
                <button onClick={() => setSel(null)} style={{ marginLeft:'auto', cursor:'pointer', background:'none', border:'1px solid var(--border)', color:'var(--text3)', fontFamily:'var(--font-mono)', fontSize:10, padding:'1px 7px' }}>✕</button>
              </div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text2)', lineHeight:1.5, marginBottom:8 }}>{selStruct.desc}</div>
              <div style={{ display:'flex', flexDirection:'column', gap:4, marginBottom:8 }}>
                <InfoRow label="Level" value={`${lvl} / ${selStruct.maxLevel}`} color="var(--text)"/>
                {selStruct.job && <InfoRow label="Enables Job" value={selStruct.job} color="var(--purple)"/>}
                <InfoRow label="Unlock" value={`Camp Leader Lv ${selStruct.requires.campLeaderLevel}`} color={ZI.getCampLeaderLevel()>=selStruct.requires.campLeaderLevel?'var(--green)':'var(--red2)'}/>
                {(selStruct.requires.structures||[]).length>0 && <InfoRow label="Requires" value={selStruct.requires.structures.map(p=>ZI.getStructure(p)?.name).join(', ')} color="var(--text2)"/>}
              </div>
              <div className="divider"/>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', margin:'8px 0 5px' }}>{lvl>0 ? `UPGRADE TO LV ${lvl+1}` : 'BUILD COST'}</div>
              <CostBundle cost={cost}/>
              {cost && Object.keys(selStruct.effectPerLevel).length>0 && (
                <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--green)', marginTop:8 }}>
                  +{Object.entries(selStruct.effectPerLevel).map(([k,v])=>`${v} ${k}`).join(', ')} per level
                </div>
              )}
              {cost && (
                <button onClick={() => doBuild(sel)} disabled={state==='locked' || !afford}
                  style={{
                    width:'100%', marginTop:10, padding:'8px', fontFamily:'var(--font-body)', fontSize:12,
                    cursor: (state!=='locked'&&afford)?'pointer':'not-allowed',
                    background: (state!=='locked'&&afford) ? '#1a3020' : 'var(--bg4)',
                    color: (state!=='locked'&&afford) ? '#3dcf8e' : 'var(--text3)',
                    border:`1px solid ${(state!=='locked'&&afford)?'#3dcf8e':'var(--border)'}`,
                  }}>
                  {state==='locked' ? `🔒 Camp Leader Lv ${selStruct.requires.campLeaderLevel}` : !afford ? '✗ Insufficient resources' : lvl>0 ? '⬆ Upgrade' : '🔨 Build'}
                </button>
              )}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

      transition:'border-color 0.15s',
    }}
    onMouseEnter={e => e.currentTarget.style.borderColor='var(--amber)'}
    onMouseLeave={e => e.currentTarget.style.borderColor='var(--border)'}

      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5}}>

        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:statusColor, textTransform:'uppercase'}}>{building.status}</span>
      </div>
      <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', marginBottom:5}}>{building.output}</div>

// ─── MOODLES PANEL (PZ-inspired status effects) ────────────────────────────
function MoodlesPanel({ survivor }) {
  // Derive moodles from survivor stats — mirrors PZ's automatic moodle system
  const moodles = [];
  const nutri = getNutritionLevel(survivor.nutrition);
  const hydration = getHydrationLevel(survivor.hydration);

  // Hunger moodle (PZ: Peckish → Hungry → Very Hungry → Famished → Starving)
  if (survivor.nutrition < 35) {
    const lvl = survivor.nutrition < 15 ? 4 : survivor.nutrition < 25 ? 3 : 2;
    moodles.push({ key:'hungry', icon:'🍖', label: ZI.MOODLES.Hungry.levels[lvl], color: ZI.MOODLES.Hungry.color,
      severity: lvl, penalty: `Stamina ${(ZI.MOODLES.Hungry.staminaPenalties[lvl]*100).toFixed(0)}% · XP ${(ZI.MOODLES.Hungry.xpPenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Famished survivors have visibly shaking hands and reduced combat speed' });
  }
  if (survivor.hydration < 45) {
    const lvl = survivor.hydration < 20 ? 3 : survivor.hydration < 32 ? 2 : 1;
    moodles.push({ key:'thirsty', icon:'💧', label: ZI.MOODLES.Thirsty.levels[lvl], color: ZI.MOODLES.Thirsty.color,
      severity: lvl, penalty: `Stamina ${(ZI.MOODLES.Thirsty.staminaPenalties[lvl]*100).toFixed(0)}% · Speed ${(ZI.MOODLES.Thirsty.speedPenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Dehydration causes blurred vision effects and rapid stamina drain' });
  }
  if (survivor.morale < 50) {
    const lvl = survivor.morale < 25 ? 2 : 1;
    moodles.push({ key:'panicked', icon:'😰', label: ZI.MOODLES.Panicked.levels[lvl], color: ZI.MOODLES.Panicked.color,
      severity: lvl, penalty: `Accuracy ${(ZI.MOODLES.Panicked.accuracyPenalties[lvl]*100).toFixed(0)}% · Noise +${(ZI.MOODLES.Panicked.noisePenalties[lvl]*100).toFixed(0)}%`,
      pzNote: 'PZ: Panicked survivors breathe loudly — increasing detection radius' });
  }
  if (survivor.status === 'hungry') {
    moodles.push({ key:'tired', icon:'😴', label:'Tired', color: ZI.MOODLES.Tired.color,
      severity:1, penalty:'Attack Speed -10% · Awareness -15%',
      pzNote:'PZ: Tired survivors miss more often and react slower to threats' });
  }
  if (survivor.id === 4) { // Cole Marsh — show infection for demo
    moodles.push({ key:'sick', icon:'🤢', label:'Queasy', color: ZI.MOODLES.Sick.color,
      severity:0, penalty:'HP drain 0/hr · Stamina -5%',
      pzNote:'PZ: Queasy can be early infection — check for bites immediately' });
  }

  if (moodles.length === 0) return (
    <div style={{padding:'6px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>✓ No active moodles</div>
    </div>
  );

  return (
    <div style={{display:'flex', flexDirection:'column', gap:4}}>
      {moodles.map(m => (
        <div key={m.key} style={{
          padding:'5px 8px', background:'var(--bg4)',
          borderLeft:`3px solid ${m.color}`,
          border:`1px solid ${m.color}33`,
        }}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:2}}>
            <span style={{fontSize:11}}>{m.icon}</span>
            <span style={{fontFamily:'var(--font-body)', fontSize:12, color:m.color, fontWeight:500}}>{m.label}</span>
            <div style={{display:'flex', gap:1, marginLeft:'auto'}}>
              {[0,1,2,3].map(i => (
                <div key={i} style={{
                  width:5, height:5, borderRadius:1,
                  background: i <= m.severity ? m.color : 'var(--border2)',
                }}/>
              ))}
            </div>
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>{m.penalty}</div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:2, fontStyle:'italic', opacity:0.7}}>{m.pzNote}</div>
        </div>
      ))}
    </div>
  );
}

// ─── INFECTION TRACKER (PZ's Knox Infection logic) ─────────────────────────
function InfectionTracker({ survivor }) {
  // Simulate infection state
  const infectionStates = {
    1: null,
    2: null,
    3: null,
    4: { stage: 0, hoursElapsed: 2, source: 'Laceration (25% chance)', treatable: true },
    5: null,
    6: null,
  };
  const infection = infectionStates[survivor.id];

  return (
    <div style={{marginBottom:8}}>
      <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:5, letterSpacing:'0.1em'}}>
        INFECTION STATUS
        <span style={{marginLeft:6, color:'var(--text3)', fontSize:8}}>(PZ Knox Model)</span>
      </div>
      {infection ? (
        <div style={{padding:'7px 8px', background:'rgba(139,58,42,0.15)', border:'1px solid var(--red)'}}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:4}}>
            <div className="notif-dot"/>
            <span style={{fontFamily:'var(--font-body)', fontSize:12, color:'var(--red2)', fontWeight:500}}>
              {ZI.INFECTION.symptoms[infection.stage]}
            </span>
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:3}}>
            Source: {infection.source} · {infection.hoursElapsed}h elapsed
          </div>
          {infection.treatable && (
            <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>
              ✓ Medical RMAT cure available ({'<'}6h window)
            </div>
          )}
          {/* Symptom progression */}
          <div style={{display:'flex', gap:2, marginTop:5, flexWrap:'wrap'}}>
            {ZI.INFECTION.symptoms.map((s, i) => (
              <div key={i} style={{
                fontFamily:'var(--font-mono)', fontSize:8, padding:'1px 5px',
                background: i === infection.stage ? 'rgba(139,58,42,0.3)' : 'transparent',
                color: i === infection.stage ? 'var(--red2)' : i < infection.stage ? 'var(--text3)' : 'var(--text3)',
                border:`1px solid ${i === infection.stage ? 'var(--red)' : 'var(--border)'}`,
              }}>{s}</div>
            ))}
          </div>
          <div style={{marginTop:5, fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', fontStyle:'italic'}}>
            PZ: Bite = 100% fatal. Laceration = 25%. Treat immediately with Medical RMAT.
          </div>
        </div>
      ) : (
        <div style={{padding:'5px 8px', background:'var(--bg4)', border:'1px solid var(--border)'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>
            ✓ No active infection · Last checked: post-horde
          </div>
          <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:2}}>
            Bite: 100% · Laceration: 25% · Scratch: 7% infection chance
          </div>
        </div>
      )}
    </div>
  );
}

// ─── FATIGUE TRACKER (PZ-style sleep deprivation cascade) ──────────────────
function FatigueTracker({ hoursAwake = 14 }) {
  const phase = ZI.FATIGUE_MODEL.phases.find(p => hoursAwake >= p.hoursAwake[0] && hoursAwake < p.hoursAwake[1])
    || ZI.FATIGUE_MODEL.phases[ZI.FATIGUE_MODEL.phases.length - 1];
  const pct = clamp((hoursAwake / 24) * 100, 0, 100);

  return (
    <div style={{marginBottom:8}}>
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:3}}>
        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>FATIGUE</span>
        <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:phase.color}}>{phase.level} · {hoursAwake}h awake</span>
      </div>
      <ProgressBar value={pct} color={phase.color} height={5} animated={hoursAwake > 20}/>
      <div style={{fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:3}}>
        Combat {phase.combatMod >= 0 ? '+' : ''}{(phase.combatMod*100).toFixed(0)}% · XP {phase.xpMod >= 0 ? '+' : ''}{(phase.xpMod*100).toFixed(0)}%
        <span style={{marginLeft:6, fontStyle:'italic', opacity:0.7}}>· PZ: ignored fatigue → forced blackout</span>
      </div>
    </div>
  );
}

      </div>
      <div style={{flex:1, overflow:'auto', padding:10}}>
        {/* Header */}
        <div style={{display:'flex', gap:10, marginBottom:10}}>
          <div style={{
            width:44, height:44, borderRadius:'50%', border:`2px solid ${classObj?.color||'var(--amber)'}`,
            background:'var(--bg4)', display:'flex', alignItems:'center', justifyContent:'center',

// The active-combat model lives in ZI.simulateCombat / resolveAttack; this is a
// light real-time surface (Attack/Dodge/Item/Auto) over the same math.
function ActiveCombatView({ enemy, onResolve, survivorBlock }) {
  const ZI = window.ZI;
  const F = ZI.STAT_FORMULAS;
  const [s] = React.useState(() => Object.assign({}, survivorBlock || F.survivorStatBlock()));
  const [e] = React.useState(() => Object.assign({}, ZI.STAT_FORMULAS.enemyStatBlock(enemy)));
  const [sHp, setSHp] = React.useState(s.hp);
  const [eHp, setEHp] = React.useState(e.hp);
  const [log, setLog] = React.useState([]);
  const [dodgeReady, setDodgeReady] = React.useState(true);
  const [hitWindow, setHitWindow] = React.useState(false);
  const [floaters, setFloaters] = React.useState([]);
  const doneRef = React.useRef(false);
  const dodgeArmedRef = React.useRef(0);

  const pushLog = (by, r) => setLog(l => [...l.slice(-5), { by, ...r }]);
  const floater = (val, crit, side) => { const id = Math.random(); setFloaters(f => [...f, { id, val, crit, side }]); setTimeout(() => setFloaters(f => f.filter(x => x.id !== id)), 700); };

  // Rhythm window for timed hits.
  React.useEffect(() => {
    const t = setInterval(() => { setHitWindow(true); setTimeout(() => setHitWindow(false), 550); }, 1600);
    return () => clearInterval(t);
  }, []);

  const finish = (outcome) => { if (doneRef.current) return; doneRef.current = true; onResolve({ outcome, hpLeft: Math.max(0, sHp) }); };

  // Enemy attacks on its initiative cadence.
  React.useEffect(() => {
    if (doneRef.current) return;
    const ms = Math.max(700, 2600 - (e.initiative || 8) * 60);
    const t = setInterval(() => {
      if (doneRef.current) return;
      // Timed dodge → guaranteed evade if armed within window.
      if (Date.now() - dodgeArmedRef.current < 600) { pushLog('enemy', { result:'dodged' }); return; }
      const r = F.resolveAttack(e, { ...s, hp: sHp, evasion: s.evasion });
      if (r.result === 'miss') { pushLog('enemy', r); return; }
      floater(r.dealt, r.result === 'crit', 'survivor');
      setSHp(h => { const nh = Math.max(0, h - r.dealt); if (nh <= 0) finish('downed'); return nh; });
      pushLog('enemy', r);
    }, ms);
    return () => clearInterval(t);
  }, [sHp, eHp]);

  const attack = () => {
    if (doneRef.current) return;
    const atk = { ...s, hp: sHp };
    if (hitWindow) { atk.accuracy += 15; atk.crit += 20; } // timed-hit bonus (capped by design)
    const r = F.resolveAttack(atk, { ...e, hp: eHp });
    if (r.result === 'miss') { pushLog('survivor', r); return; }
    floater(r.dealt, r.result === 'crit', 'enemy');
    setEHp(h => { const nh = Math.max(0, h - r.dealt); if (nh <= 0) finish('win'); return nh; });
    pushLog('survivor', r);
  };
  const dodge = () => { if (!dodgeReady || doneRef.current) return; dodgeArmedRef.current = Date.now(); setDodgeReady(false); setTimeout(() => setDodgeReady(true), 2500); };
  const auto = () => { if (doneRef.current) return; const res = ZI.simulateCombat({ ...s, hp: sHp }, { ...e, hp: eHp }, 'idle'); finish(res.outcome); };
  const flee = () => { if (doneRef.current) return; const chance = F.escapeChance(ZI.statLevel('stealth'), ZI.statLevel('athletics'), s.initiative*4, enemy); if (Math.random()*100 < chance) finish('flee'); else pushLog('enemy', { result:'flee failed' }); };

  const Bar = ({ hp, max, color, label }) => (
    <div style={{ flex:1 }}>
      <div style={{ display:'flex', justifyContent:'space-between', fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:2 }}><span>{label}</span><span style={{ color }}>{Math.max(0,hp)}/{max}</span></div>
      <div style={{ height:10, background:'var(--bg4)', borderRadius:3 }}><div style={{ height:'100%', width:`${Math.max(0,hp/max*100)}%`, background:color, borderRadius:3, transition:'width 0.2s' }}/></div>
    </div>
  );
  return (
    <div style={{ position:'absolute', inset:0, zIndex:90, background:'rgba(6,5,4,0.96)', display:'flex', flexDirection:'column', padding:16 }}>
      <div style={{ display:'flex', gap:14, marginBottom:12 }}>
        <Bar hp={sHp} max={s.hpMax} color="var(--green)" label={s.name}/>
        <Bar hp={eHp} max={e.hpMax} color="var(--red2)" label={e.name}/>
      </div>
      {/* Combat stage */}
      <div style={{ flex:1, position:'relative', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 40px', border:'1px dashed var(--border)', background:'radial-gradient(circle at center, rgba(139,58,42,0.08), transparent)' }}>
        <div style={{ fontSize:48 }}>🧍</div>
        <div style={{ fontSize:52 }}>🧟</div>
        {floaters.map(f => (
          <div key={f.id} style={{ position:'absolute', left: f.side==='enemy'?'70%':'25%', top:'30%', fontFamily:'var(--font-mono)', fontSize: f.crit?24:16, fontWeight:'bold', color: f.side==='enemy'?'var(--amber2)':'var(--red2)', animation:'fadeIn 0.2s', pointerEvents:'none' }}>{f.val}{f.crit?'!':''}</div>
        ))}
        {hitWindow && <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)', fontFamily:'var(--font-mono)', fontSize:10, color:'var(--green)' }}>◉ STRIKE WINDOW</div>}
      </div>
      {/* Controls */}
      <div style={{ display:'flex', gap:8, marginTop:12 }}>
        <button onClick={attack} style={{ flex:2, padding:'12px', fontFamily:'var(--font-body)', fontSize:14, cursor:'pointer', background: hitWindow?'rgba(80,200,120,0.2)':'#2a1a1a', border:`1px solid ${hitWindow?'var(--green)':'var(--red2)'}`, color: hitWindow?'var(--green)':'var(--red2)' }}>⚔ Attack{hitWindow?' ✦':''}</button>
        <button onClick={dodge} disabled={!dodgeReady} style={{ flex:1, padding:'12px', fontFamily:'var(--font-body)', fontSize:13, cursor: dodgeReady?'pointer':'not-allowed', background:'var(--bg4)', border:`1px solid ${dodgeReady?'var(--blue)':'var(--border)'}`, color: dodgeReady?'var(--blue)':'var(--text3)' }}>💨 Dodge</button>
        <button onClick={flee} style={{ flex:1, padding:'12px', fontFamily:'var(--font-body)', fontSize:13, cursor:'pointer', background:'var(--bg4)', border:'1px solid var(--amber)', color:'var(--amber)' }}>🏃 Flee</button>
        <button onClick={auto} style={{ flex:1, padding:'12px', fontFamily:'var(--font-body)', fontSize:13, cursor:'pointer', background:'var(--bg4)', border:'1px solid var(--text3)', color:'var(--text2)' }}>⏩ Auto</button>
      </div>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'var(--text3)', marginTop:6, textAlign:'center' }}>
        Tap Attack in the strike window for +accuracy/+crit · Dodge just before a hit to guarantee evade · Auto hands the fight to the engine
      </div>
    </div>
  );
}

function useSoloRoutePreparation(route, threatLevel, enabled = true) {
  const [, refresh] = useState(0);
  useEffect(() => {
    if (!enabled) return;
    let queued = null;
    const update = () => {
      if (queued !== null) return;
      queued = setTimeout(() => { queued = null; refresh(n => n + 1); }, 0);
    };
    const inventory = ZI.onInventoryChange ? ZI.onInventoryChange(update) : null;
    const xp = ZI.onXp ? ZI.onXp(update) : null;
    const timer = setInterval(update, 1000);
    return () => { clearInterval(timer); if (queued !== null) clearTimeout(queued); if (inventory) inventory(); if (xp) xp(); };
  }, [enabled]);
  return enabled && route ? ZI.getRoutePreparation(route, threatLevel) : null;
}

        {p.canDeploy ? 'Heavier equipment slows travel and leaves less room for salvage.' : p.blockedReason}
      </div>
      {onReturnToRoute ? (
        <button className="btn btn-amber" style={{width:'100%', marginTop:9}} onClick={onReturnToRoute}>Return to selected route</button>
      ) : (
        <>
          <button className="btn" style={{width:'100%', marginTop:9}} onClick={onManageGear || (() => setScreen('stockpile'))}>Manage gear &amp; carried items</button>
          <button className="btn" style={{width:'100%', marginTop:5}} onClick={() => setScreen('stat-leveling')}>View skills</button>
        </>
      )}
    </div>
  );
}

function RouteLoadoutPreparation({ route, threatLevel, onReturnToRoute }) {
  const preparation = useSoloRoutePreparation(route, threatLevel);
  return <SoloRoutePreparationPanel preparation={preparation} routeName={route && route.name} onReturnToRoute={onReturnToRoute} compact/>;
}

function SoloMainScreen({ setScreen, setActiveRoute, threatLevel, mode, initialPlan = null, onManageGear }) {
  const isCamp = mode === 'camp'; // Squad Assignment is a Camp Leader-mode feature only
  const [selectedBiome, setSelectedBiome] = useState(() => initialPlan ? initialPlan.biome : 'suburbia');
  const [selectedRoute, setSelectedRoute] = useState(() => initialPlan ? ZI.ROUTES.find(r => r.id === initialPlan.routeId) || null : null);
  const [runMode, setRunMode] = useState(() => initialPlan ? initialPlan.runMode : 'active');
  const [autoRepeat, setAutoRepeat] = useState(() => initialPlan ? { ...initialPlan.autoRepeat } : {}); // routeId → bool
  const [squad, setSquad] = useState([]);           // assigned survivor ids
  const toggleRepeat = (id) => setAutoRepeat(m => { const on = !m[id]; ZI.setRouteRunRepeat(id, on); return { ...m, [id]: on }; });

  const filteredRoutes = ZI.ROUTES.filter(r => r.biome === selectedBiome);
  const biome = ZI.BIOMES.find(b => b.id === selectedBiome);

  const [launchError, setLaunchError] = useState(null);

    name: 'The Wanderer', class: 'ranger', level: 14,
    stamina: 78, gear: 'Hunting Rifle (WM) + Hazard Suit T2',

    nutrition: 74, hydration: 82,

  const hydration = getHydrationLevel(character.hydration);

    <div className="screen-enter" style={{display:'flex', gap:8, padding:8, height:'100%', overflow:'hidden'}}>

        {/* Solo preparation uses actual skills, loadout and carrying totals. */}
        {!isCamp ? <SoloRoutePreparationPanel preparation={preparation} setScreen={setScreen} onManageGear={onManageGear ? () => onManageGear({
          biome: selectedBiome, routeId: (selectedRoute || filteredRoutes[0])?.id || null,
          runMode, autoRepeat: { ...autoRepeat },
        }) : null}/> : (
<div className="panel" style={{padding:12, flexShrink:0}}>
          <div style={{display:'flex', gap:10, marginBottom:10}}>
            <div style={{
              width:42, height:42, borderRadius:'50%', border:'2px solid var(--amber)',
              background:'var(--bg4)', display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:'var(--font-title)', fontSize:20, color:'var(--amber)', flexShrink:0,
            }}>W</div>
            <div>
              <div style={{fontFamily:'var(--font-body)', fontSize:15, color:'var(--text)', fontWeight:600}}>The Wanderer</div>
              <div style={{fontFamily:'var(--font-body)', fontSize:11, color:'var(--text2)', letterSpacing:'0.1em'}}>Lv14 Ranger · Lone Operative</div>
            </div>
          </div>
          {/* Nutrition */}
          <div style={{marginBottom:8}}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:4}}>
              <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>NUTRITION</span>
              <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:nutri.color}}>{nutri.label}</span>
            </div>
            <ProgressBar value={character.nutrition} color={nutri.color} height={5}/>
            <div style={{display:'flex', justifyContent:'space-between', marginTop:5, marginBottom:2}}>
              <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)'}}>HYDRATION</span>
              <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:hydration.color}}>{hydration.label}</span>
            </div>
            <ProgressBar value={character.hydration} color={hydration.color} height={5}/>
          </div>
          <div style={{
            padding:'5px 8px', background:'var(--bg4)',
            borderLeft:`3px solid ${totalStaminaMod >= 0 ? 'var(--green)' : 'var(--red2)'}`,

            Stamina: {character.stamina} → <b>{effectiveStamina}</b> ({totalStaminaMod >= 0 ? '+' : ''}{(totalStaminaMod*100).toFixed(0)}%)

            {Object.entries(character.attributes).map(([k,v]) => {
              const attr = ZI.SURVIVAL_ATTRS.find(a => a.key === k || a.key === k+'2');
              const label = k==='V2'?'Valor':k==='V'?'Vitality':attr?.name||k;
              return (
                <div key={k} style={{display:'flex', gap:4, alignItems:'center'}}>
                  <span style={{
                    fontFamily:'var(--font-mono)', fontSize:10, color:'var(--amber)', width:10, flexShrink:0,
                    fontWeight:'bold',
                  }}>{k==='V2'?'V':k}</span>
                  <div style={{flex:1}}>
                    <ProgressBar value={v} color="var(--amber)" height={4}/>
                  </div>

                </div>

          <div className="divider" style={{margin:'10px 0 8px'}}/>
          <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', lineHeight:1.6}}>
            {ZI.hasWorkingVehicle() ? (
              <>
                <div>🚛 {ZI.getVehicle().name}</div>
                <ProgressBar value={character.vehicleCondition} color="var(--amber)" height={4}/>
                <div style={{marginTop:2, color:'var(--text3)'}}>Condition: {character.vehicleCondition}%</div>

        {/* Biome selector */}
        <div className="panel" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <div className="panel-title">Select Biome</div>
          <div style={{padding:8, display:'flex', flexDirection:'column', gap:5, overflow:'auto'}}>

                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:3}}>
                  <span style={{fontFamily:'var(--font-body)', fontSize:13, color: selectedBiome===b.id ? b.color : 'var(--text)' }}>{b.name}</span>

      </div>

      {/* Center: Routes */}
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:8, minWidth:0, overflow:'hidden'}}>
        {launchError && <div role="alert" style={{color:'var(--red2)', padding:8}}>{launchError}</div>}
        {biome && (
          <div className="panel" style={{padding:12, flexShrink:0}}>
            <div style={{display:'flex', alignItems:'center', gap:12}}>
              <div style={{
                width:10, height:10, borderRadius:'50%', background:biome.color,
                boxShadow:`0 0 8px ${biome.color}`,
              }}/>
              <div style={{fontFamily:'var(--font-title)', fontSize:20, color:biome.color}}>{biome.name}</div>
              <Tag color={biome.color}>Tier {biome.tier}</Tag>
            </div>
            <div style={{display:'flex', gap:24, marginTop:8}}>
              <div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:3}}>ZOMBIE ECOLOGY</div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)'}}>{biome.zombies.slice(0,2).join(' · ')}</div>
              </div>
              <div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:3}}>HAZARDS</div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--red2)'}}>{biome.hazards.slice(0,2).join(' · ')}</div>
              </div>
              <div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--text3)', marginBottom:3}}>RMAT ACCESS</div>
                <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--purple)'}}>{biome.rmat}</div>
              </div>
            </div>
          </div>
        )}

        {/* Run mode selector */}
        <div style={{display:'flex', gap:6, flexShrink:0}}>
          {[['active','Active Run','Monitor & direct your route in real-time'],['passive','Idle Run','Automated — reduced loot, runs while away']].map(([id,label,desc]) => (
            <div key={id} onClick={() => setRunMode(id)} style={{
              flex:1, padding:'8px 12px', cursor:'pointer',
              border:`1px solid ${runMode===id ? 'var(--amber)' : 'var(--border)'}`,
              background: runMode===id ? 'var(--bg4)' : 'var(--bg3)',
              transition:'all 0.15s',
