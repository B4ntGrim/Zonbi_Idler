function ContractCard({ contract, factionColor, onChanged }) {
  const ZI = window.ZI;
  const [msg, setMsg] = React.useState(null);
  const state = ZI.contractState(contract.id);
  const tierColor = ZI.tierColor ? ZI.tierColor(contract.tier) : factionColor;
  const blockReason = state === 'OFFERED' ? ZI.contractBlockReason(contract) : null;
  const rewardStr = [
    contract.reward.rep ? `${contract.reward.rep} Rep` : null,
    contract.reward.materials ? Object.entries(contract.reward.materials).map(([k,q]) => `${q} ${k}`).join(', ') : null,
    contract.reward.rmat ? Object.entries(contract.reward.rmat).map(([k,q]) => `RMAT ${k} ×${q}`).join(', ') : null,
    contract.reward.gear ? (ZI.getGearItem(contract.reward.gear)||{}).name : null,
  ].filter(Boolean).join(' + ');
  const objectiveStr = Object.entries(contract.objective || {}).map(([k,v]) => `${k}: ${v}`).join(', ');

  const accept = () => {
    const r = ZI.acceptContract(contract.id);
    if (!r.ok) { setMsg(`⚠ Cannot accept: ${r.reason}`); return; }
    setMsg('✓ Contract accepted'); onChanged && onChanged();
  };
  const complete = () => {
    const ok = ZI.completeContract(contract.id);
    setMsg(ok ? '✓ Contract turned in — reward granted' : '⚠ Cannot complete yet');
    onChanged && onChanged();
  };

  return (
    <div style={{
      padding:'10px 12px', background:'var(--bg3)',
      border:`1px solid ${state==='ACTIVE' ? 'var(--amber)' : 'var(--border)'}`, transition:'border-color 0.15s',
    }}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5}}>
        <span style={{fontFamily:'var(--font-body)', fontSize:14, color:'var(--text)', fontWeight:500}}>{contract.title}</span>
        <Tag color={tierColor}>{contract.tier}</Tag>
      </div>
      <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--text2)', marginBottom:6}}>{contract.type} · {objectiveStr}</div>
      <div style={{display:'flex', gap:8, alignItems:'center', justifyContent:'space-between'}}>
        <Tag color="var(--text2)">{contract.type}</Tag>
        <div style={{fontFamily:'var(--font-mono)', fontSize:10, color:'var(--green)'}}>{rewardStr}</div>
      </div>
      {blockReason && (
        <div style={{marginTop:6, fontFamily:'var(--font-mono)', fontSize:9, color:'var(--red2)'}}>🔒 {blockReason}</div>
      )}
      <div style={{marginTop:6, display:'flex', justifyContent:'flex-end', gap:6, alignItems:'center'}}>
        {msg && <span style={{fontFamily:'var(--font-mono)', fontSize:9, color: msg[0]==='✓'?'var(--green)':'var(--red2)', marginRight:'auto'}}>{msg}</span>}
        {state === 'OFFERED' && (
          <button className="btn btn-sm btn-green" disabled={!!blockReason} style={{opacity: blockReason?0.5:1, cursor: blockReason?'not-allowed':'pointer'}} onClick={accept}>Accept Contract</button>
        )}
        {state === 'ACTIVE' && (
          <button className="btn btn-sm btn-amber" onClick={complete}>Turn In</button>
        )}
        {state === 'COMPLETE' && (
          <span style={{fontFamily:'var(--font-mono)', fontSize:9, color:'var(--green)'}}>✓ Completed</span>
        )}
      </div>
    </div>
  );
}

function App() {
  const { TweaksPanel, useTweaks } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentColor": "#ad8d52",
    "darkMode": true,
    "threatLevel": 5,
    "showAnimations": true,
    "resourceRates": true
  }/*EDITMODE-END*/;

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // After loading/starting a save the page reloads so every system re-reads storage;
  // the boot flag drops the player straight back into their mode.
  const bootMode = ZI.consumeBootMode();
  // A brand-new game opens on the Traversal satellite map (where the tutorial starts).
  const freshStart = bootMode && localStorage.getItem('zi_fresh_start') === '1';
  const [screen, setScreen] = useState(bootMode ? (freshStart ? 'traversal' : (bootMode === 'camp' ? 'camp-main' : 'traversal')) : 'mode-select'); // TRAV-01a S6: a Solo reload opens on Traversal (was Routes)
  useEffect(() => { if (freshStart && screen !== 'traversal') localStorage.removeItem('zi_fresh_start'); }, [screen]);
  const [mode, setMode] = useState(bootMode || null);
  const [activeRoute, setActiveRoute] = useState(null);
  // Planning context is temporary UI state. Inventory and route-run saves stay canonical.
  const [routePlan, setRoutePlan] = useState(null);
  const [preparingRoute, setPreparingRoute] = useState(false);
  const navigate = next => {
    setPreparingRoute(false);
    if (window.ZI_CRAFTING_FRAMES.readRoute().active) window.location.hash = next === 'rmat-crafting' ? '#crafting' : '';
    setScreen(next);
  };
  useEffect(() => {
    const openCraftingFrame = () => { if (window.ZI_CRAFTING_FRAMES.readRoute().active) { setPreparingRoute(false); setScreen('rmat-crafting'); } };
    openCraftingFrame();
    window.addEventListener('hashchange', openCraftingFrame);
    return () => window.removeEventListener('hashchange', openCraftingFrame);
  }, []);
  const openRouteGear = plan => { setRoutePlan(plan); setPreparingRoute(true); setScreen('stockpile'); };

  const [resources, setResources] = useState({
    Food:     { current: 320,  max: 500, rate: 12 },
    Scrap:    { current: 1840, max: 3000, rate: 8 },
    Ammo:     { current: 1240, max: 2000, rate: 0 },
    Medicine: { current: 84,   max: 200,  rate: 3 },
    Fuel:     { current: 210,  max: 400,  rate: 0 },
    RMAT:     { current: 19,   max: 100,  rate: 0 },
  });

  // Idle tick
  useEffect(() => {
    if (!mode || !tweaks.resourceRates) return;
    const t = setInterval(() => {
      setResources(prev => {
        const next = { ...prev };
        Object.keys(next).forEach(k => {
          if (next[k].rate > 0) {
            next[k] = { ...next[k], current: Math.min(next[k].current + next[k].rate / 60, next[k].max) };
          }
        });
        return next;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [mode, tweaks.resourceRates]);

  const worldEvent = ZI.WORLD_EVENTS.find(e => e.active);

  const handleModeSelect = (m) => {
    setMode(m);
    setScreen('save-files');
  };

  const renderScreen = () => {
    switch (screen) {
      case 'mode-select':   return <ModeSelectScreen onSelect={handleModeSelect}/>;
      case 'save-files':    return <SaveFilesScreen mode={mode} onBack={() => { ZI.clearResume(); setScreen('mode-select'); }}/>;
      case 'camp-main':     return <CampMainScreen resources={resources} setResources={setResources} threatLevel={tweaks.threatLevel}/>;
      case 'solo-main':     return <SoloMainScreen setScreen={navigate} setActiveRoute={setActiveRoute} threatLevel={tweaks.threatLevel} mode={mode} initialPlan={mode === 'camp' ? null : routePlan} onManageGear={openRouteGear}/>;
      case 'solo-loading':  return ZI.hasWorkingVehicle()
        ? <LootLoadingScreen route={activeRoute} onComplete={() => setScreen('traversal')}/>
        : <SatelliteTraversalScreen setScreen={setScreen} setActiveRoute={setActiveRoute}/>;
      // Oct 29: the Schedule tab shows the Operations page (reference/operations-schedule-proposal.md); the old mock
      // timeline (ScheduleScreenV2) stays in screens-v2b.jsx for rollback.
      case 'camp-schedule': return window.OperationsScreen ? <OperationsScreen mode="camp" setScreen={navigate}/> : <ScheduleScreenV2 mode="camp"/>;
      case 'solo-schedule': return window.OperationsScreen ? <OperationsScreen mode="solo" setScreen={navigate}/> : <ScheduleScreenV2 mode="solo"/>;
      case 'rmat-crafting': return <RmatCraftingScreen/>;
      case 'stockpile':     return <StockpileScreen initialTab={preparingRoute ? 'loadout' : 'recycler'} onNavigate={navigate}
        preparationPanel={preparingRoute && routePlan ? <RouteLoadoutPreparation
          route={ZI.ROUTES.find(r => r.id === routePlan.routeId)} threatLevel={tweaks.threatLevel}
          onReturnToRoute={() => navigate('solo-main')}/> : null}/>;
      case 'factions':      return <FactionsScreen/>;
      case 'marketplace':   return <MarketParent/>;
      case 'stat-leveling': return <StatLevelingScreen/>;
      case 'traversal':     return <SatelliteTraversalScreen setScreen={setScreen} setActiveRoute={setActiveRoute}/>;
      case 'hack-slash':    return <WanderingScreen route={activeRoute || ZI.ROUTES[1]} setScreen={setScreen}/>;
      case 'codex':         return <ZombieCodexScreen/>;
      default:              return <ModeSelectScreen onSelect={handleModeSelect}/>;
    }
  };

  return (
    <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', overflow:'hidden'}}>
      {screen !== 'mode-select' && screen !== 'save-files' && (
        <TopBar
          mode={mode}
          screen={screen}
          setScreen={navigate}
          threatLevel={tweaks.threatLevel}
          worldEvent={worldEvent}
        />
      )}
      <div style={{flex:1, overflow:'hidden', position:'relative'}}>
        {renderScreen()}
      </div>

      {TweaksPanel && (
        <TweaksPanel>
          <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)}/>
          <TweakSlider label="Threat Level" min={1} max={5} step={1} value={tweaks.threatLevel} onChange={v => setTweak('threatLevel', v)}/>
          <TweakToggle label="Live Resource Ticks" value={tweaks.resourceRates} onChange={v => setTweak('resourceRates', v)}/>
          <TweakToggle label="Animations" value={tweaks.showAnimations} onChange={v => setTweak('showAnimations', v)}/>
        </TweaksPanel>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
