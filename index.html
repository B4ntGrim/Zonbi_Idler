<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* High-contrast palette — all text tokens ≥4.5:1 on --bg3 */
    --bg:        #0f0e0c;
    --bg2:       #1a1814;
    --bg3:       #221e17;
    --bg4:       #2c261d;
    --border:    #4a4034;
    --border2:   #635645;
    --text:      #f0e8d6;
    --text2:     #cbbd9f;
    --text3:     #a39478;
    --amber:     #e6c47e;
    --amber2:    #f5dca6;
    --red:       #e0624c;
    --red2:      #f08a52;
    --rust2:     #e0624c;
    --green:     #62d69a;
    --green2:    #a2dca2;
    --blue:      #74b6ee;
    --purple:    #c894ff;
    --yellow:    #f6de74;
    --metal:     #a3b3c2;
    --font-title: 'Special Elite', serif;
    --font-body:  'Oswald', sans-serif;
    --font-mono:  'Share Tech Mono', monospace;
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }

  #root { width: 100%; height: 100%; }

  /* Texture overlays */
  .paper-texture::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: 
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Utility */
  .font-title { font-family: var(--font-title); }
  .font-mono  { font-family: var(--font-mono); }
  .text-amber { color: var(--amber); }
  .text-red   { color: var(--red2); }
  .text-green { color: var(--green); }
  .text-dim   { color: var(--text2); }
  .text-dimmer{ color: var(--text3); }

  /* Panels */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .panel::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(200,169,110,0.03) 0%, transparent 50%);
  }
  .panel-title {
    font-family: var(--font-title);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }

  /* Buttons */
  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    padding: 8px 16px;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); background: var(--bg4); }
  .btn-amber { border-color: var(--amber); color: var(--amber); }
  .btn-amber:hover { background: rgba(200,169,110,0.12); }
  .btn-red { border-color: var(--red); color: var(--red2); }
  .btn-red:hover { background: rgba(139,58,42,0.15); }
  .btn-green { border-color: var(--green); color: var(--green); }
  .btn-green:hover { background: rgba(76,175,125,0.12); }
  .btn-sm { font-size: 11px; padding: 5px 10px; }
  .btn-lg { font-size: 15px; padding: 12px 28px; letter-spacing: 0.12em; }

  /* Tags */
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }

  /* Progress bars */
  .progress-bar {
    height: 6px;
    background: var(--bg4);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.3s ease;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px; height: 100%;
    background: rgba(255,255,255,0.4);
  }

  /* Dividers */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 8px 0;
  }

  /* Tooltip */
  .tooltip-wrap { position: relative; }
  .tooltip-wrap:hover .tooltip-box { opacity: 1; pointer-events: auto; }
  .tooltip-box {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--bg4); border: 1px solid var(--border2);
    padding: 8px 12px; min-width: 160px; max-width: 220px;
    font-size: 11px; line-height: 1.5; color: var(--text2);
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 9999; white-space: normal;
  }

  /* Animated ticker */
  @keyframes tick-up { from { opacity: 0; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
  .tick-float { animation: tick-up 1.5s ease-out forwards; pointer-events: none; }

  /* Threat pulse */
  @keyframes threat-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .threat-active { animation: threat-pulse 2s ease-in-out infinite; }

  /* Screen transitions */
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen-enter { animation: screen-in 0.25s ease-out; }

  /* Scanline effect on hover for mode cards */
  @keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  .scanline-hover:hover .scanline-inner {
    animation: scanline 1.5s linear infinite;
  }
  .scanline-inner {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, transparent 40%, rgba(200,169,110,0.04) 50%, transparent 60%);
  }

  /* Loading bar animation */
  @keyframes loading-fill { from { width: 0%; } to { width: 100%; } }

  /* Notification badge */
  .notif-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red2);
    box-shadow: 0 0 6px var(--red2);
    flex-shrink: 0;
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .tab-btn {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text2);
    padding: 9px 16px;
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    position: relative;
    top: 1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--amber); border-bottom-color: var(--amber); }

  /* World event banner */
  @keyframes scroll-event { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .event-scroll { animation: scroll-event 18s linear infinite; white-space: nowrap; display: inline-block; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes travPin { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.25); opacity:0.7; } }
  .trav-here-pin { animation: travPin 1.4s ease-in-out infinite; }
  .wander-hud button { white-space: nowrap; flex-shrink: 0; }
  .wander-menu > button { width: 100%; text-align: left; }
  @keyframes tutSpot { 0%,100% { border-color:#ff3b3b; } 50% { border-color:#ffb3b3; } }
  .tut-spot { animation: tutSpot 1.1s ease-in-out infinite; }
  @keyframes tutArrow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .tut-arrow { animation: tutArrow 0.9s ease-in-out infinite; }
  @keyframes ziProj { from { left: 0%; opacity: 1; } 90% { opacity: 1; } to { left: 100%; opacity: 0; } }
  .zi-proj { animation: ziProj 0.24s linear forwards; }
  @keyframes ziDmg { 0% { transform: translate(-50%, 0) scale(1.35); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-50%, -34px) scale(1); opacity: 0; } }
  .zi-dmg { position:absolute; left:50%; font-family: var(--font-title); font-size: 20px; font-weight: bold; color: #ff3b3b; text-shadow: 0 0 2px #000, 0 2px 0 #000, 0 0 8px rgba(255,59,59,0.6); pointer-events: none; white-space: nowrap; animation: ziDmg 0.9s ease-out forwards; z-index: 20; }
  @keyframes ziFlame { 0% { transform: scaleX(0.2); transform-origin: left; opacity: 0.6; } 50% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(0.95); opacity: 0; } }
  .zi-flame { animation: ziFlame 0.45s ease-out forwards; transform-origin: left center; }
  @keyframes ziDrawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
</style>
